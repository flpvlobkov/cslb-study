<style>
:root{
  --ink:#101B33; --inkSoft:#2A3852; --cobalt:#1E4FD8; --paper:#F5F7FB;
  --card:#FFF; --steel:#8A94A8; --line:#DDE3EE; --amber:#F5A623;
  --green:#1F9D55; --red:#D64545;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
header{padding:18px 2px 12px}
h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
  letter-spacing:.5px;line-height:1;margin:0;
}
h1 span{color:var(--cobalt)}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);margin-top:4px}
.stripe{height:6px;border-radius:3px;margin-top:12px;
  background:repeating-linear-gradient(45deg,var(--amber) 0 14px,var(--ink) 14px 28px)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.pill{
  padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--inkSoft);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
  letter-spacing:.4px;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.pill.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;box-shadow:0 2px 8px rgba(16,27,51,.06)}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);
  margin-bottom:6px;display:flex;justify-content:space-between}
.q{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;
  border-radius:10px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:15px;line-height:1.45;cursor:pointer;
  font-family:inherit}
.opt:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.opt .ltr{font-family:'IBM Plex Mono',monospace;font-weight:600;margin-right:8px}
.opt.right{background:#E6F4EC;border-color:var(--green);color:#14683A;font-weight:600}
.opt.wrong{background:#FBEAEA;border-color:var(--red);color:var(--red);font-weight:600}
.opt .mk{float:right;font-weight:700}
.why{border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.6;
  color:var(--inkSoft);margin-top:4px}
.why.ok{background:#F0F9F3;border-left:4px solid var(--green)}
.why.no{background:#FEF3F3;border-left:4px solid var(--red)}
.why b{display:block;margin-bottom:5px}
.why.ok b{color:var(--green)} .why.no b{color:var(--red)}
.btn{width:100%;padding:16px 0;border-radius:12px;border:none;background:var(--cobalt);
  color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:.6px;cursor:pointer;margin-top:12px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#F0F9F3;color:var(--green);border:2px solid var(--green);font-size:16px;padding:12px 0}
.tiles{display:flex;gap:8px;margin-bottom:16px}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 12px;text-align:center}
.tile .n{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1}
.tile .l{font-size:12px;color:var(--steel);margin-top:4px}
.tile .s{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--steel)}
button.tile{min-width:0;font-family:inherit;color:inherit;cursor:pointer;transition:border-color .2s,background-color .2s}
button.tile:hover,button.tile:active{border-color:var(--red);background:#FFF8F8}
.nav-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit}
.nav-btn .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.3px;color:var(--ink)}
.nav-btn .d{font-size:13.5px;color:var(--steel);margin-top:2px}
.note-box{background:var(--ink);border-radius:14px;padding:16px 18px;color:#C8D2E6;
  font-size:13.5px;line-height:1.6;margin-top:6px}
.note-box .k{color:var(--amber);font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:16px;letter-spacing:1px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:none;border:none;cursor:pointer;font-family:inherit}
.acc .h{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.3px;color:var(--ink)}
.acc .pm{color:var(--cobalt);font-size:18px}
.acc .body{padding:0 16px 14px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-top:1px solid var(--line);font-size:14px}
.sr .a{color:var(--inkSoft);line-height:1.4}
.sr .b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--cobalt);
  text-align:right;white-space:nowrap}
.sheet-row{border-top:1px solid var(--line)}
.sheet-row .sr{border:0;align-items:center;padding:12px 0}
.sheet-row .a{flex:1;min-width:0}
.sheet-row .b{flex:1;min-width:0;max-width:58%;white-space:normal;overflow-wrap:anywhere;
  background:#EFF3FF;border:0;border-radius:8px;padding:10px;min-height:44px;
  font-size:13px;line-height:1.55;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.sheet-row .b[aria-expanded=true]{background:#DFE8FF;outline:2px solid var(--cobalt)}
.sheet-help{background:#F5F8FF;border-left:3px solid var(--cobalt);border-radius:8px;padding:16px;margin:0 0 14px;animation:help-in .18s ease-out}
.sheet-help p{margin:6px 0 16px;font-size:15px;line-height:1.7;color:var(--inkSoft)}
.sheet-help h3{margin:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--cobalt)}
.sheet-help .cue{padding:12px;background:#FFF8E5;border-radius:8px;color:#685116}
.help-actions,.learning-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.help-actions button,.learning-tools button,.review-item{font:inherit;cursor:pointer;min-height:44px;
  padding:9px 12px;background:white;border:1px solid var(--line);border-radius:8px;color:var(--cobalt);font-size:13px}
.help-actions button[aria-pressed=true]{background:#E8F5ED;color:var(--green);border-color:var(--green)}
.help-source{display:block;color:var(--cobalt);font-size:13px;line-height:1.5;margin:12px 0;overflow-wrap:anywhere}
.learning-tools{margin:0 0 14px;justify-content:flex-end}
.learning-tools .quiet-on{background:#E8F5ED;color:var(--green)}
.sheet-intro{font-size:14px;line-height:1.65;color:var(--inkSoft);margin:0 0 14px}
.review-item{display:block;text-align:left;width:100%;margin-top:7px}
.sheet-review{padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:#fff}
.sheet-review summary{cursor:pointer;color:var(--cobalt);font-weight:600;min-height:28px}
.save-warning{padding:12px;background:#FFF0F0;border:1px solid var(--red);color:var(--red);border-radius:8px;margin-bottom:12px;font-size:14px;line-height:1.5}
.quiet-mode *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
@keyframes help-in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){.sheet-row .sr{display:block}.sheet-row .a{display:block;margin-bottom:6px}.sheet-row .b{display:block;max-width:100%;width:100%;text-align:left}.sheet-help{padding:12px}}
.tip{background:#FDF6E5;border:1px solid #EFD9A0;border-radius:12px;padding:14px;
  font-size:13.5px;line-height:1.55;color:#6B5510}
textarea{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);
  font-size:15px;font-family:'Inter',sans-serif;background:var(--card);color:var(--ink);
  resize:vertical}
textarea.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;background:#F7F9FC;
  color:var(--inkSoft)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:14px}
.bar>div{height:5px;background:var(--cobalt);border-radius:3px;transition:width .3s}
.score{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;padding:8px 0;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.8px;color:var(--steel);border-top:3px solid transparent;margin-top:-9px}
nav button.on{color:var(--cobalt);border-top-color:var(--cobalt)}
.gt{border-bottom:2px dotted var(--cobalt);color:var(--cobalt);cursor:pointer;font-weight:600}
.gt:active{background:#E6F1FB}
.badge{display:inline-block;margin-left:6px;background:var(--red);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:1px 6px;border-radius:999px;vertical-align:1px}
.pill.on .badge{background:#fff;color:var(--cobalt)}
.wrow{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  margin-bottom:8px;cursor:pointer;font-family:inherit}
.wtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.wname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.3px;color:var(--ink)}
.wpct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.wbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.wbar>div{height:7px;border-radius:4px;transition:width .3s}
.wsub{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:12px;color:var(--steel)}
/* Clean study layout; bottom navigation retains its original styling. */
:root{--steel:#66748B;--red:#BD303D;--green:#167743}
.wrap{max-width:720px;padding-bottom:110px}
header{padding:24px 2px 20px}
h1{font-family:'Inter',system-ui,sans-serif;font-size:clamp(21px,5.7vw,29px);letter-spacing:-.8px;line-height:1.2}
.sub{font-family:inherit;font-size:11px;line-height:1.6;margin-top:7px}
.stripe{height:3px;margin-top:17px;background:var(--cobalt);border-radius:0;opacity:.18}
.card,.tile,.nav-btn,.acc{box-shadow:none;border-radius:12px}
.card{padding:20px}
.q{line-height:1.65;font-size:18px}
.opt{font-size:16px;padding:14px;line-height:1.6}
.opt:last-child{margin-bottom:0}
.why{line-height:1.75}
button{touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.category-grid .pill{min-width:0;white-space:normal;text-align:left;border-radius:10px;padding:10px 12px;font-family:inherit;letter-spacing:0;border-width:1px}
.category-name{display:block;font-size:13px;font-weight:700;line-height:1.3}
.category-rate{display:block;font-size:11px;font-weight:600;line-height:1.4;margin-top:5px;color:var(--steel)}
.category-rate.danger{color:var(--red)}
.category-rate.warning{color:#A86B09}
.category-rate.clear{color:var(--green)}
.category-title-row{display:flex;align-items:center;gap:7px}
.category-status-icon{width:18px;height:18px;flex:0 0 18px}
.category-mini-bar{display:block;height:4px;margin-top:7px;border-radius:999px;background:#E8EDF5;overflow:hidden}
.category-mini-bar>span{display:block;height:100%;border-radius:999px;transition:width .35s ease,background-color .35s ease}
.category-grid .pill.on{background:#EDF2FF;border-color:var(--cobalt);color:var(--ink)}
.category-grid .pill.weakest{border-color:#E3A0A8}
.category-grid .pill.on.weakest{border-color:var(--cobalt)}
.section-label{font-size:12px;font-weight:700;color:var(--inkSoft);margin:0 0 10px}
.progress-help{font-size:12px;color:var(--steel);line-height:1.6;margin:0 0 14px}
.focus-picker{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;margin-bottom:10px;transition:border-color .2s ease,background-color .2s ease,transform .15s ease}
.focus-picker:active{transform:scale(.992)}
.focus-picker.danger{border-color:#E7ADB3;background:#FFF8F8}
.focus-picker.warning{border-color:#E9D49F;background:#FFFCF3}
.focus-picker.clear{border-color:#A9D5BE;background:#F5FBF7}
.focus-picker-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px;border-radius:9px;background:#EEF2F7;color:var(--steel)}
.focus-picker.danger .focus-picker-icon{background:#FBE6E8;color:var(--red)}
.focus-picker.warning .focus-picker-icon{background:#FFF0C8;color:#A86B09}
.focus-picker.clear .focus-picker-icon{background:#E4F4EB;color:var(--green)}
.focus-picker-icon svg{width:21px;height:21px}
.focus-picker-copy{min-width:0;flex:1}
.focus-picker-label{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--steel);text-transform:uppercase;margin-bottom:2px}
.focus-picker-value{display:block;font-size:14px;font-weight:700;line-height:1.35}
.focus-picker-rate{display:block;font-size:11px;font-weight:600;line-height:1.4;margin-top:2px;color:var(--steel)}
.focus-picker.danger .focus-picker-rate{color:var(--red)}
.focus-picker.warning .focus-picker-rate{color:#A86B09}
.focus-picker.clear .focus-picker-rate{color:var(--green)}
.focus-chevron{width:20px;height:20px;color:var(--steel);transition:transform .2s ease}
.focus-picker.open .focus-chevron{transform:rotate(180deg)}
.focus-menu{padding:13px;margin:-3px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 8px 22px rgba(16,27,51,.08);animation:focusReveal .2s ease-out both}
.focus-menu .category-grid{margin-bottom:10px}
.question-stage{scroll-margin-top:10px;animation:questionIn .2s ease-out both}
.focus-card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 14px;border:1px solid #F0C8CD;border-radius:10px;background:#FFF6F7;text-align:left;font-family:inherit;cursor:pointer;margin-bottom:16px;color:var(--ink)}
.focus-card strong{display:block;font-size:14px;line-height:1.5}
.focus-card small{display:block;font-size:12px;line-height:1.6;color:var(--red)}
.focus-action{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
.study-modes{padding:4px;background:#E9EEF6;border-radius:10px;display:flex;gap:4px;margin-bottom:18px}
.study-modes .pill{flex:1;padding:10px 6px;border:0;border-radius:7px;font-family:inherit;font-size:12px;letter-spacing:0;background:transparent}
.study-modes .pill.on{background:white;color:var(--cobalt);box-shadow:0 1px 3px #101b3310}
.meta{font-family:inherit;font-size:11px;line-height:1.5;gap:12px;margin-bottom:10px}
.wname{font-family:inherit;font-size:14px;letter-spacing:0}
.wpct{font-family:inherit;font-size:12px}
.wtop{gap:10px}.wsub{font-size:11px;line-height:1.5}
@keyframes focusReveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes questionIn{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:600px){.category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:380px){.card{padding:15px}.category-grid .pill{padding:9px}.focus-card{align-items:flex-start;flex-direction:column;gap:4px}}

.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
