function lawRef(code,section){return ['California '+code+' § '+section,'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode='+code+'&sectionNum='+section];}
function dirRef(section){return ['Cal/OSHA § '+section,'https://www.dir.ca.gov/'+(section.indexOf('14300.')===0?'t8/':'title8/')+section.replace('.','_')+'.html'];}
var PAY_REF=['California final-pay rules','https://www.dir.ca.gov/dlse/FAQ_Paydays.htm'];
var SHEET_HELP=[
 [
  ['Add labor and materials for the whole project. The minor-work exemption requires a total below $1,000, no required building permit, and no employees. A smaller job can still require a license.','A $700 job needing a permit is not exempt just because it is below $1,000.','Total + permit + employees. Check all three.',lawRef('BPC','7048')],
  ['A home improvement contract (HIC) over $500 must meet written-contract requirements. This is a different threshold from the license exemption. Special qualifying service-and-repair rules also exist.','A $900 home improvement is above the written-contract threshold.','$500 = writing, not licensing.',lawRef('BPC','7159')],
  ['This special service-and-repair contract is limited to $750. The customer must initiate the call, work must address that problem, and no payment is due until completion.','A homeowner calls for a $300 repair. It may qualify if all the conditions are met.','Small repair, customer calls, pay after.',lawRef('BPC','7159.10')],
  ['For the usual home improvement down-payment rule, calculate 10% of the contract and compare it with $1,000. Choose the smaller. Statutory bond exceptions exist.','On an $8,000 contract, 10% is $800, so the cap is $800.','Calculate both. Circle the smaller.',lawRef('BPC','7159')],
  ['The contractor license bond protects eligible claimants harmed by covered license-law violations. $25,000 is the bond amount, not the premium you pay to buy it.','An active contractor maintains the required $25,000 bond even on small jobs.','Bond amount ≠ purchase price.',lawRef('BPC','7071.6')],
  ['An actively licensed LLC needs an additional $100,000 worker bond covering specified unpaid wages and benefits. It does not replace the ordinary contractor bond.','An LLC maintains both its contractor bond and its LLC worker bond.','LLC = extra worker protection.',lawRef('BPC','7071.6.5')],
  ['Willfully diverting construction funds with the statutory failure to finish work or pay can be criminal. At $2,350 or less it is a misdemeanor; above that, felony punishment is possible, not automatic.','Wrongfully diverting $3,000 can cross the higher-penalty threshold.','Above $2,350 = felony exposure.',lawRef('PEN','484b')],
  ['Under the unlicensed-activity citation section, the civil penalty maximum is $15,000. Do not confuse this with the separate $30,000 tier for specified license-law violations. Criminal penalties are separate.','A citation under §7028.7 is not the same penalty as a criminal conviction.','Read the section, not just the dollar figure.',lawRef('BPC','7028.7')],
  ['Individuals, including sole proprietors, generally may seek up to $12,500 in small claims. Corporations and other business entities generally have a $6,250 limit. Other restrictions apply.','A sole proprietor with an $11,000 claim is within the ordinary individual limit.','Individual 12,500; entity 6,250.',lawRef('CCP','116.221')],
  ['CSLB may refer eligible disputes to mandatory arbitration when the contract price or demand is within the contractor-bond amount, currently $25,000. Additional eligibility conditions apply.','A qualifying $20,000 demand may fit; the dollar amount alone does not guarantee admission.','Mandatory: within the bond limit.',lawRef('BPC','7085')],
  ['For eligible cases with material damages above $25,000 and below $50,000, both parties must agree to CSLB voluntary arbitration. The endpoints are not included in this range.','A qualifying $35,000 dispute needs both parties to agree.','Voluntary = both say yes.',lawRef('BPC','7085')],
  ['For covered public works contracts over $25,000, the direct contractor provides an approved payment bond before work. State-entity contracts have separate statutory provisions.','A covered $40,000 city project requires the bond before starting.','Payment bond protects payment to others.',lawRef('CIV','9550')]
 ],
 [
  ['After CSLB sends the notice requiring the initial license fee, the applicant generally has 90 days from that notice to pay. Required bond and issuance documents also have a notice-based deadline.','Passing the exam is not the same as already holding an active license.','Pass → notice → complete issuance.',lawRef('BPC','7074')],
  ['When a qualifying individual leaves, notify CSLB in writing within 90 days and replace the qualifier within 90 days of departure. Failure can suspend the license or remove the classification. Extensions require approval.','Your qualifier leaves June 1: count from departure, not from when you report it.','Two duties, one departure date.',lawRef('BPC','7068.2')],
  ['Notify CSLB in writing on its form within 90 days when recorded information such as business name, address, or personnel changes. Insurance coverage must separately remain compliant.','Moving the business means updating CSLB, not just forwarding mail.','Changed record? Tell the Registrar.',lawRef('BPC','7083')],
  ['An immediate family member may request continuance of an individual license after the holder dies. CSLB must receive the written request within 90 days. Approval and conditions are required.','A family member applies to finish existing projects; continuance is not automatic.','90 days to request, not permanent inheritance.',lawRef('BPC','7076')],
  ['On private work without a valid recorded completion or cessation notice, the ordinary lien-recording deadline is 90 days after project completion. This is not a universal rule for every stop-payment notice.','No completion notice does not mean unlimited time to record a lien.','No notice: completion starts the clock.',lawRef('CIV','8414')],
  ['Recording a lien and suing to enforce it are separate steps. Generally, file the enforcement action within 90 days after recording, or the lien expires. A statutory credit-extension exception exists.','Recording today starts a new enforcement deadline; it does not file a lawsuit.','Record first. Enforce separately.',lawRef('CIV','8460')],
  ['Report an unsatisfied final judgment imposed on the licensee to CSLB in writing within 90 days. Failure can trigger suspension. Payment, an accord, or an additional bond may be required.','An unpaid final judgment cannot simply wait until the next license renewal.','Unsatisfied = still unpaid.',lawRef('BPC','7071.17')]
 ],
 [
  ['A preliminary notice tells the required recipients that you are supplying work or materials and may claim payment rights. It is not a lien. Generally, serve within 20 days of first furnishing; a late notice protects only the preceding 20 days and later work.','First delivery starts your notice clock, even before the first invoice.','Preliminary = early heads-up.',lawRef('CIV','8204')],
  ['An owner may record a valid notice of completion on or within 15 days after completion. It can shorten lien-recording periods, subject to applicable notice requirements.','Finishing work and recording the owner’s completion notice are different events.','15 = owner’s recording window.',lawRef('CIV','8182')],
  ['Cessation means work has stopped. An owner may record this notice after at least 30 continuous days without labor, with the stoppage continuing through recording.','A weekend shutdown is not a 30-day continuous cessation.','Cessation = stopped continuously.',lawRef('CIV','8188')],
  ['A claimant other than the direct contractor generally records after it stops furnishing work and before the earlier of 90 days after project completion or 30 days after a valid completion/cessation notice is recorded.','A subcontractor does not get the prime contractor’s 60-day notice window.','Sub: 30 after notice; check earlier limit.',lawRef('CIV','8414')],
  ['A direct contractor generally records after completing its contract and before the earlier of 90 days after project completion or 60 days after a valid completion/cessation notice is recorded.','The prime contracts directly with the owner, so its notice window differs from a sub’s.','Prime: 60 after notice; check earlier limit.',lawRef('CIV','8412')],
  ['Without a valid completion or cessation notice, the usual private-work lien deadline is 90 days after project completion. Your own last work date and legal project completion are not necessarily the same.','A sub finishes early, but must distinguish its finish date from completion of the project.','90 from project completion, not the invoice.',lawRef('CIV','8414')],
  ['An owner who did not contract for the improvement may give a notice of nonresponsibility. To be effective, it must be both posted and recorded within 10 days after learning of the work. It is not a blanket escape from every lien.','A landlord learns of tenant-ordered work and promptly checks whether this protection applies.','Know → post AND record → 10 days.',lawRef('CIV','8444')]
 ],
 [
  ['Generally, a discharged employee must receive earned wages and accrued unused vacation immediately at termination. Narrow industry exceptions exist.','Do not ordinarily wait until Friday payroll for someone fired Tuesday.','Employer ends it → pay now.',PAY_REF],
  ['An employee without a definite-term written contract who quits with less than 72 hours’ notice generally receives final wages within 72 hours after quitting.','No advance notice means a 72-hour final-pay window, not three business days.','No notice → 72 hours.',PAY_REF],
  ['For an employee without a definite-term written contract, at least 72 hours’ advance notice generally makes final wages due when the employee quits as announced.','A worker gives sufficient notice and leaves on that date: pay at departure.','Notice already given → pay at exit.',PAY_REF],
  ['The employer completes Form I-9 Section 2 within three business days after the employee’s first day of paid work. For employment lasting less than three business days, complete it on day one.','For a Monday start, ordinarily finish Section 2 by Thursday.','I-9: employer checks work eligibility.', ['USCIS: completing Section 2','https://www.uscis.gov/i-9-central/completing-form-i-9/completing-section-2-employer-review-and-attestation']],
  ['Report a newly hired employee to California EDD within 20 calendar days of starting work. Rehires after at least 60 consecutive days of separation also count.','Put new-hire reporting on the checklist when the person starts, not after probation.','New hire → EDD → 20 calendar days.', ['EDD new-hire reporting','https://edd.ca.gov/en/payroll_taxes/new_hire_reporting/']],
  ['Construction supervisors hold toolbox or tailgate safety meetings with their crews at least every 10 working days. Discuss the hazards of the work.','A short crew discussion about today’s ladder risks is a tailgate meeting.','Crew talks: 10 working days.',dirRef('1509')],
  ['General construction rules require periodic supervisory safety meetings but do not specify a universal monthly interval. A separate tunnel-safety rule does require monthly supervisory meetings.','Do not apply a tunnel-specific monthly rule to every construction workplace.','General: periodic. Tunnel: monthly.',dirRef('1509')],
  ['Report qualifying serious work-related injury, illness, or death to Cal/OSHA immediately: as soon as practicable, generally no later than eight hours after the employer knows or should know. Limited exceptional circumstances allow 24 hours.','Notifying your insurer does not replace the immediate Cal/OSHA report.','Two reports; serious injury cannot wait.',dirRef('342')],
  ['Report a work injury or illness involving lost time beyond the injury date or treatment beyond first aid to the insurer within five days after knowledge. This is separate from immediate serious-incident reporting.','An injury causing a later missed shift may trigger the insurer report.','Insurer: five days; serious incident: immediate.',lawRef('LAB','6409.1')],
  ['Keep required Cal/OSHA injury logs and incident records for five years after the covered calendar year. Exposure and medical records are different: some require 30 years, or employment plus 30 years.','Do not discard asbestos-related medical records using the five-year injury-log rule.','Logs ≠ exposure/medical files.', ['Cal/OSHA record retention §14300.33','https://www.dir.ca.gov/t8/14300_33.html'],dirRef('3204')]
 ],
 [
  ['Generally, pass the required qualifying examinations within 18 months after CSLB accepts the application, or it becomes void. Do not count from your first test attempt.','An accepted application starts the window even if you schedule the exam later.','18 months starts at acceptance.',lawRef('BPC','7074')],
  ['A qualifying individual who passed the examination for the same classification within the preceding five years generally need not retake it for a new application. Other licensing requirements still apply.','An expired application and a reusable exam result are different things.','Score validity is not an active license.',lawRef('BPC','7065')],
  ['An active contractor license ordinarily renews every two years. Renew before expiry and keep the other active-license requirements satisfied.','A valid bond does not by itself renew an expired license.','Active = two.',lawRef('BPC','7140')],
  ['An inactive license has a four-year renewal period. Inactive status does not authorize contracting; reactivate before doing work requiring a license.','Keeping an inactive number is not permission to bid as an active contractor.','Inactive = four, no contracting.',lawRef('BPC','7076.5')],
  ['An expired license generally can be renewed within five years if the applicable requirements and fees are met. Do not assume late renewal authorizes work done while expired.','Three years expired may be within the renewal window, but it is not currently active.','Renewable ≠ usable today.',lawRef('BPC','7141')],
  ['Keep records of contractor transactions for at least five years after the project or operation is completed. Other legal or insurance reasons can require longer retention.','Save the contract, changes, invoices, and payment records together.','Completion starts the five-year minimum.',lawRef('BPC','7111')],
  ['A patent defect is reasonably apparent, such as visibly faulty work. The ordinary CSLB written-complaint period is four years after the alleged act or omission. This is not every civil lawsuit’s deadline.','An obviously crooked installation illustrates a readily observable problem.','Patent = apparent → four.',lawRef('BPC','7091')],
  ['A qualifying latent structural defect is hidden and involves specified structural failure or risk. CSLB’s complaint window can be ten years. Not every hidden cosmetic problem gets this period.','Concealed faulty support work is different from a hidden paint blemish.','Hidden + structural → check ten-year rule.',lawRef('BPC','7091')],
  ['A licensee or applicant generally has 15 working days after service of a citation to contest it. Without timely action, it can become final.','Read the service date immediately; do not wait for renewal paperwork.','Citation → 15 WORKING days.',lawRef('BPC','7099.3')],
  ['When CSLB sends an agreement to arbitrate under this procedure, return it within 30 calendar days from the date CSLB mails it.','The mailing date, not the day you finally open the envelope, starts this period.','Mailed agreement → 30 calendar days.',lawRef('BPC','7085.3')]
 ],
 [
  ['Markup is the added profit-and-overhead amount expressed as a fraction of cost. Convert the percentage to a decimal before multiplying.','Cost $100 with 20% markup: $100 × 1.20 = $120.','Markup builds UP from cost.'],
  ['Margin expresses profit as a fraction of the selling price, not cost. For a target margin below 100%, divide cost by one minus the decimal margin.','Cost $100 at 20% margin: $100 ÷ 0.80 = $125.','Margin lives in the selling price.'],
  ['Gross profit is sales revenue minus direct job costs, before subtracting overhead. It is not all available to spend.','Revenue $1,000 − direct costs $700 = gross profit $300.','Gross comes before overhead.'],
  ['In this simplified job model, net profit is gross profit minus overhead. A full business income statement may also include interest, taxes, and other items.','Gross $300 − overhead $200 = net $100.','Net is what remains after the next costs.'],
  ['The current ratio compares short-term assets with short-term obligations. Divide assets by liabilities; a zero denominator cannot produce an ordinary ratio.','Current assets $60,000 ÷ liabilities $30,000 = 2 to 1.','Ratio DIVIDES.'],
  ['Working capital is the dollar difference between current assets and current liabilities. It indicates a short-term financial cushion, not necessarily cash in the bank.','Assets $60,000 − liabilities $30,000 = $30,000 working capital.','Working capital SUBTRACTS.'],
  ['In this simplified model, each sales dollar contributes the gross-margin fraction toward fixed overhead. Divide overhead by that decimal fraction to find break-even sales.','Overhead $8,000 ÷ margin 0.25 = $32,000 sales.','Use 0.25, not 25.'],
  ['Straight-line depreciation spreads an asset’s depreciable cost evenly over its useful life. Salvage is the estimated value left at the end. Tax deductions may use different rules.','($12,000 cost − $2,000 salvage) ÷ 5 years = $2,000 per year.','Subtract what remains, then spread the rest.'],
  ['Labor burden adds employer costs beyond wages, such as payroll taxes, insurance, and benefits. Use the burden percentage supplied in the problem; it is not one universal legal rate.','$30 wage × 1.25 for 25% burden = $37.50 hourly labor cost.','Wage is only part of worker cost.'],
  ['For covered nonexempt employees under the ordinary California rule, hours over eight through twelve in a workday earn 1.5 times regular rate; hours over twelve earn double. Weekly and seventh-day rules and exceptions also matter.','A standard 13-hour day: 8 regular + 4 at 1.5× + 1 at 2×.','8 → time-and-a-half; 12 → double.', ['California overtime rules','https://www.dir.ca.gov/dlse/faq_overtime.htm']],
  ['The usual employee and employer FICA shares are each 6.2% Social Security plus 1.45% Medicare. Social Security has an annual wage cap; Additional Medicare withholding applies to some employee wages and is not employer-matched.','$100 of wages below the cap generally means $7.65 withheld and $7.65 employer share.','6.2 + 1.45 = 7.65.', ['IRS Social Security and Medicare rates','https://www.irs.gov/taxtopics/tc751']],
  ['Use the usual home improvement cap: compare $1,000 with 10% of the full contract and choose the smaller. Statutory bond exceptions exist.','A $20,000 contract: 10% is $2,000, so use the smaller $1,000.','Smaller wins.',lawRef('BPC','7159')]
 ],
 [
  ['Ordinarily notify 811 at least two working days before excavation, excluding the day of notification. Also wait for required operator responses and any required onsite meeting; a ticket alone is not clearance.','A Monday call does not count Monday as one of the two working days.','Notify, wait, confirm, dig safely.',lawRef('GOV','4216.2')],
  ['The ordinary advance-notice window is no more than 14 calendar days before starting. This is different from the ticket’s 28-day validity.','Do not use a notice filed months earlier as your start authorization.','14 = advance notice, not ticket life.',lawRef('GOV','4216.2')],
  ['A ticket is valid for 28 days from issuance. Renew by the end of day 28 if work continues. If it expires, stop excavation and follow the new-ticket requirements.','A long project needs ticket renewal, not just the original ticket number.','28 = ticket life.',lawRef('GOV','4216.2')],
  ['The approximate-location zone includes the facility width plus 24 inches on each side of its outside edges. Determine its exact location safely with hand tools or an allowed alternative before powered excavation as required.','A wide pipe needs its width plus the allowance on both sides, not 24 inches from its center.','Edges, not centerline.',lawRef('GOV','4216')],
  ['White markings identify the proposed excavation area. They show where you intend to dig, not where an existing utility has been located.','Outline your planned trench in white before requesting utility marks.','White = where I plan to work.', ['USA North 811 color-code guidance','https://usanorth811.org/']],
  ['Utility colors identify types of underground lines: red electric, yellow gas/oil/steam, blue potable water, and green sewer/drain. They are location warnings, not safe digging depths.','Blue marks suggest water infrastructure; still confirm the location before digging.','Red power, yellow fuel, blue water, green drain.', ['USA North 811 color-code guidance','https://usanorth811.org/']],
  ['Ordinary civil penalty ceilings are $10,000 for negligence and $50,000 for knowing/willful violations. Certain willful pipeline damage releasing hazardous contents can reach $100,000. Other liability can apply too.','Do not treat $50,000 as the absolute maximum for every underground-utility incident.','Careless 10; willful 50; special release 100.',lawRef('GOV','4216.6')],
  ['Stop excavation and disturbance around discovered human remains and notify the county coroner. Do not move the remains yourself. Further requirements apply if they are Native American remains.','Finding suspected remains means stopping, not moving them aside to finish the trench.','Stop. Protect the area. Coroner.',lawRef('HSC','7050.5')]
 ]
];

reviseQuestion('n13',{q:'CSLB’s reciprocity program may help an eligible out-of-state contractor obtain:',opts:['An automatic California license','A trade-examination waiver for an eligible classification','Permission to skip all California licensing rules','A license with no application'],why:'Reciprocity is a possible trade-exam waiver, not automatic licensure. The current CSLB page lists Arizona, Louisiana, Mississippi, Nevada, and North Carolina, with classification and experience requirements. Check CSLB’s current list rather than memorizing an old three-state list.'},[['CSLB reciprocity requirements','https://www.cslb.ca.gov/Contractors/Applicants/Reciprocity/Reciprocity_Requirements.aspx']]);
reviseQuestion('n15',{why:'No more than three firms in a one-year period. Additional firms must meet one of the statutory connections: common ownership of at least 20%, a qualifying subsidiary/joint venture relationship, or specified overlapping management. Personal 20% ownership is not the only route.'},[lawRef('BPC','7068.1')]);
reviseQuestion('n19',{opts:['They never collect a deposit','The project is below $1,000, needs no permit or employees, and the ad states they are unlicensed','The work is residential','They subcontract everything'],why:'The minor-work exemption now uses less than $1,000 for the entire project, requires no building permit and no employees, and cannot be used to split a larger job. Advertising must disclose unlicensed status; being below the dollar amount alone is not enough.'},[lawRef('BPC','7048')]);
reviseQuestion('n40',{why:'Crew toolbox/tailgate meetings must occur at least every 10 working days. General construction supervisory safety meetings are periodic, not universally monthly; monthly is a separate tunnel-safety requirement.'});
reviseQuestion('n41',{why:SHEET_HELP[3][7][0]});
reviseQuestion('n42',{q:'After learning of a work injury requiring treatment beyond first aid or lost time beyond the injury date, the employer must report it to the insurer within:',why:SHEET_HELP[3][8][0]});
reviseQuestion('n43',{why:'Ordinarily give at least two working days’ notice, excluding the notification date, and no more than 14 calendar days in advance. Required operator responses and onsite meetings must also be complete. Do not assume a Thursday call alone clears a Monday start.'});
reviseQuestion('n45',{q:'Under the asbestos standard, employee exposure-monitoring records generally must be retained for at least:',why:'Exposure-monitoring records generally remain for at least 30 years. Employee medical records generally remain for employment duration plus 30 years. Ordinary injury logs use a different five-year rule.'},[dirRef('1529'),dirRef('3204')]);
reviseQuestion('n48',{},[lawRef('BPC','7099.2'),lawRef('BPC','7028.7')]);
reviseQuestion('n50',{opts:['Fine if you sub it out','A misdemeanor advertising violation, with a $700–$1,000 statutory fine','Only a problem if someone hires you','Legal under $1,000'],why:'BPC 7027.1 prohibits advertising work outside the classification held, subject to its general-contractor provision. It specifies a $700–$1,000 fine in addition to other applicable punishment. The ad itself can violate the rule.'},[lawRef('BPC','7027.1')]);
reviseQuestion('n54',{q:'A knowing and willful 811-law violation, without the special hazardous-pipeline-release circumstances, carries a civil penalty ceiling of:',why:SHEET_HELP[6][6][0]});
reviseQuestion('n67',{q:'For an otherwise eligible CSLB mandatory-arbitration case, the relevant contract-price or demand threshold is:',why:SHEET_HELP[0][9][0]});
reviseQuestion('n79',{q:'For wages subject to both ordinary Social Security and Medicare taxes, before additional Medicare withholding, the usual employer FICA rate is:',why:SHEET_HELP[5][10][0]});
reviseQuestion('m7',{q:'An employee earns $2,000 of wages below the Social Security wage cap, with no Additional Medicare Tax due. Ordinary employee FICA withholding is:',why:'$2,000 × (6.2% Social Security + 1.45% Medicare) = $153. The employer generally matches this $153. Wage-cap and Additional Medicare rules can change other cases.'});
reviseQuestion('n80',{q:'A covered nonexempt installer works 13 hours under the ordinary California daily-overtime rule. The 13th hour is paid at:',why:'Hours over 12 in a workday are double time under the ordinary rule. Hours over eight through twelve are time-and-a-half. Alternative schedules and exemptions can change the analysis.'});
reviseQuestion('n81',{q:'In 2026, which statement about a no-employee contractor’s workers’ compensation requirement is correct?',opts:['Every active licensee is already required to have coverage with no exceptions','No licensed contractor needs coverage','A qualifying no-employee licensee may file an exemption, but specified classifications still require coverage','Only corporations need coverage'],why:'In 2026 a qualifying no-employee contractor may claim the statutory exemption, except C-8, C-20, C-22, C-39, and D-49 classifications. The broader coverage change is scheduled for January 1, 2028. A D-28 holder with employees needs coverage; do not confuse a future effective date with today’s rule.'},[lawRef('BPC','7125')]);
reviseQuestion('n86',{why:SHEET_HELP[6][3][0]});
reviseQuestion('l1',{q:'Which list includes CSLB’s general and specialty license categories, including residential remodeling?',opts:['Residential, commercial, industrial','A, B, B-2 Residential Remodeling, and C specialty classifications','Master, journeyman, apprentice','Prime, sub, supplier'],why:'A is General Engineering; B is General Building; B-2 is Residential Remodeling; C covers specialties, including C-61 Limited Specialty and D-28. B-2 is distinct and has its own scope limits.'},[lawRef('BPC','7055'),lawRef('BPC','7057.5')]);
reviseQuestion('l2',{q:'For the usual multi-trade B General Building route, excluding its framing/carpentry and other statutory exceptions, the project requires:',opts:['Any single trade','At least two unrelated trades other than framing or carpentry','Only painting','A permit over $50,000'],why:'BPC 7057 has important exceptions: B contractors may take framing/carpentry projects; qualifying prime contracts can also use an appropriate specialty classification or properly licensed subcontractor. A blanket statement that a B contractor can never take a single-trade prime contract is incorrect.'},[lawRef('BPC','7057')]);
reviseQuestion('e5',{opts:['15 minutes after 3 hours','At least 30 minutes beginning no later than the end of the fifth hour','60 minutes after 6 hours','No meal period is required'],why:'Under the ordinary rule, an eight-hour employee receives a duty-free meal period of at least 30 minutes beginning no later than the end of hour five. A second meal is ordinarily due by the end of hour ten when working more than ten hours; statutory exceptions and waivers can apply.'},[['California meal-period rules','https://www.dir.ca.gov/dlse/FAQ_MealPeriods.htm']]);
reviseQuestion('s6',{q:'For residential-type framing work on top plates, joists, rafters, or similar members covered by Cal/OSHA §1716.2, fall protection is required at:',opts:['4 feet','7.5 feet','6 feet or more','15 feet'],why:'The current residential-type framing rule uses 6 feet or more. Fall-protection requirements depend on the task and equipment; do not apply one blanket height to every ladder, roof, scaffold, or lift.'},[dirRef('1716.2')]);

reviseQuestion('n5',{q:'An applicant generally must pass the required CSLB qualifying examination(s) within what time after the application is accepted?',why:'18 months after acceptance under BPC 7074. For C-61/D-28, no separate trade exam is required; Law & Business is the qualifying exam unless a waiver applies.'},[lawRef('BPC','7074'),lawRef('BPC','7065.01')]);
reviseQuestion('n6',{q:'After CSLB sends the notice requiring the initial license fee and issuance documents, the ordinary completion window is:',why:SHEET_HELP[1][0][0]});
reviseQuestion('n7',{q:'A qualifying individual who passed the same classification’s examination within the preceding ___ generally need not retake it on a new application.',why:SHEET_HELP[4][1][0]});
reviseQuestion('n8',{why:'The ordinary active-license contractor bond is $25,000 under BPC 7071.6. An LLC also needs the separate $100,000 worker-protection bond. A bond is a licensing requirement, not the fee you pay the surety.'});
reviseQuestion('n9',{why:'When a disciplinary bond is required, the Registrar sets it from $25,000 up to ten times the ordinary bond. It remains for at least two years of active licensure in good standing, or longer as ordered, in addition to other required bonds.'});
reviseQuestion('n10',{why:'The LLC worker bond is an additional $100,000, protecting specified employee wages and benefits. LLC liability insurance is a separate requirement under BPC 7071.19.'});
reviseQuestion('n11',{why:'Active licenses ordinarily renew every two years; inactive licenses every four. An inactive license cannot authorize contracting. Bond, qualifier, and insurance requirements differ during inactive status.'},[lawRef('BPC','7140'),lawRef('BPC','7076.5')]);
reviseQuestion('n14',{why:'An RME must be a bona fide permanent employee, working at least 32 hours weekly or 80% of the business’s operating hours, whichever is less. The qualifier must actually exercise the required supervision and control.'});
reviseQuestion('n16',{q:'For a D-28 contractor’s commercially registered construction vehicle, business name and license number characters must generally be at least:',why:'BPC 7029.6 requires clearly visible letters at least 72-point type or 3/4 inch in height and width. C-36, C-45 and C-57 have a separate rule requiring name, address and license number on both sides in 1-1/2-inch lettering.'},[lawRef('BPC','7029.6'),lawRef('BPC','7029.5')]);
reviseQuestion('n17',{why:'D-28 is the C-61 limited specialty for installing, modifying or repairing doors, gates and their activating devices, including garage doors. It does not grant a general license for unrelated electrical or framing projects.'});
reviseQuestion('n18',{why:'An active joint venture license has the ordinary two-year renewal period. Each member must have a current active contractor license; the venture needs its own license and required bond.'});
reviseQuestion('n20',{q:'Under Health & Safety Code 17972, during which overnight period may an inspector not enter a dwelling without owner or occupant consent?',opts:['Midnight–6 a.m.','6 p.m.–8 a.m.','9 a.m.–5 p.m.','No overnight restriction'],why:'The protected overnight period is 6 p.m. to 8 a.m. The same section separately requires a court order to enter an unoccupied dwelling. This rule is not blanket permission to enter any property during the day.'});
reviseQuestion('n21',{why:'CSLB permits reassignment when the licensed individual formed the corporation, retains at least 51% ownership, and submits the required application and fees. Reassignment is not automatic. Once reassigned, that number belongs to the corporation and cannot return to a sole-owner license.'});
reviseQuestion('n22',{q:'A 68-year-old buyer signs an ordinary, nonemergency home solicitation contract covered by the senior cancellation rule. After receiving the required signed notice copy, her cancellation period is:',why:'A buyer age 65 or older generally gets five business days, through midnight on the fifth day under the applicable notice rule. Other buyers ordinarily get three; disaster-repair and qualifying service/emergency contracts have different rules.'});
reviseQuestion('n23',{why:'The required home-solicitation cancellation notice promises return of payments within 10 days after the seller receives cancellation. If delivered goods are made available, the notice separately gives the seller 20 days after cancellation to collect them; the buyer has specified return/cooperation duties.'});
reviseQuestion('n24',{q:'Under BPC 7108.5, with no different written agreement or good-faith dispute, a prime receives a progress payment on the 1st. Subs must receive their respective shares by the:',why:'The ordinary deadline is seven days after receipt, so the 8th. A written agreement can change it; a good-faith dispute permits withholding up to 150% of the disputed amount. Wrongful nonpayment can trigger discipline and 2% monthly penalties.'});
reviseQuestion('n26',{why:SHEET_HELP[1][1][0]});
reviseQuestion('n27',{q:'CSLB mails an Agreement to Arbitrate. Under BPC 7085.3, return it within how many calendar days from mailing?',why:SHEET_HELP[4][9][0]});
reviseQuestion('n28',{why:SHEET_HELP[4][7][0]});
reviseQuestion('n29',{why:SHEET_HELP[4][5][0]});
reviseQuestion('n30',{why:SHEET_HELP[2][0][0]});
reviseQuestion('n31',{why:SHEET_HELP[2][1][0]});
reviseQuestion('n32',{why:SHEET_HELP[2][2][0]});
reviseQuestion('n33',{q:'For an otherwise timely private-work subcontractor’s lien, a valid notice of completion ordinarily shortens the recording window to how many days after the notice is recorded?',why:SHEET_HELP[2][3][0]});
reviseQuestion('n34',{q:'For an otherwise timely private-work direct contractor’s lien, a valid notice of completion ordinarily shortens the recording window to how many days after recording?',why:SHEET_HELP[2][4][0]});
reviseQuestion('n35',{q:'Without an applicable extension of credit, a private-work lien foreclosure lawsuit must ordinarily begin within how many days after recording the lien?',why:SHEET_HELP[1][5][0]});
reviseQuestion('n36',{q:'An owner eligible to give a notice of nonresponsibility must both post and record it within how many days after learning of the work?',why:SHEET_HELP[2][6][0]});
reviseQuestion('n39',{q:'For a new hire whose employment lasts at least three business days, the employer must finish I-9 Section 2 within how many business days after the first day of paid work?',why:SHEET_HELP[3][3][0]});
reviseQuestion('n47',{q:'For a second unlicensed-contracting conviction, absent the statutory unusual-case exception, the penalty includes:',why:'BPC 7028(c) uses 20% of the contract price or aggregate payments, or $5,000, whichever is greater, plus at least 90 days in county jail. The court may depart from the ordinary punishment in unusual cases in the interests of justice and must state its reasons.'});
reviseQuestion('n49',{opts:['A warning letter','Up to $10,000, possible county jail or state prison, or both fine and imprisonment','$500 civil fine','License probation only'],why:'BPC 7027.3 addresses intentional fraudulent use of an incorrect license number. It permits a fine up to $10,000, county jail up to one year or state prison, or both fine and imprisonment. One year is not a universal maximum for every sentencing route.'});
reviseQuestion('n52',{q:'An employer’s willful Cal/OSHA violation causes death or qualifying permanent/prolonged impairment. LAB 6425 allows:',opts:['Only a warning','Only civil damages','Criminal fines and possible county jail or state prison','No penalty unless the employee complains'],why:'For an initial conviction, statutory routes include county jail up to one year and/or a fine up to $100,000, or state prison for 16 months, two or three years and/or up to $250,000. A corporation or LLC can face a fine up to $1.5 million. These are ceilings, not automatic minimum fines.'});
reviseQuestion('n55',{q:'Under Labor Code 1288, the civil penalty range for a Class A child-labor violation is:',opts:['$100–$500','$5,000–$10,000 per violation','$1,000 for every kind of violation','No civil penalty'],why:'Class A covers specified serious child-labor violations and has a $5,000–$10,000 civil range per violation. Class B ordinarily has a $500–$1,000 range. Do not memorize the old app’s universal first/second/third-offense dollar ladder.'});
reviseQuestion('n56',{q:'An owner is induced to sign a home-improvement contract by a contractor’s knowingly false or fraudulent representation. Under BPC 7160 the owner may sue for:',why:'BPC 7160 permits $500 plus reasonable attorney fees and damages caused by the false or fraudulent representations. The elements include knowing deception that induced the person to contract; a mere unsuccessful prediction is not automatically enough.'});
reviseQuestion('n57',{why:'Civil Code 1550 requires capable parties, consent, a lawful object and sufficient consideration. Notarization is not one of those four general elements; particular transactions may have separate formalities.'});
reviseQuestion('n58',{why:'Civil Code 1689 permits the affected party to rescind when consent was obtained through qualifying fraud, duress or other listed grounds. Voidable means subject to cancellation; it does not mean every contract involving an unlicensed contractor can be ignored by both parties.'});
reviseQuestion('n61',{q:'Under the ordinary home-improvement payment rule, excluding the permitted down payment and statutory bond exceptions, progress payments must not exceed:',why:'BPC 7159 ties scheduled progress payments to the value of work performed and materials delivered. A schedule cannot authorize ordinary advance payment for unfinished work. The permitted down payment and specified bond exceptions are separate.'});
reviseQuestion('n63',{q:'A hired salesperson who solicits or negotiates home-improvement contracts and has no registration exemption must:',why:'The home-improvement salesperson must register with CSLB. BPC 7152 identifies the role and exemptions, including specified owners and qualifying personnel; not every person who discusses a project must register.'},[lawRef('BPC','7152'),lawRef('BPC','7153')]);
reviseQuestion('n64',{q:'Absent an exception, a prior oral promise that contradicts a final integrated written agreement generally:',opts:['Automatically overrides the writing','Cannot be used to contradict the agreed written terms','Controls if one witness heard it','Cancels the entire contract'],why:'CCP 1856 generally bars contradiction of final written terms by prior or contemporaneous oral agreements. Fraud, mistake, illegality, interpretation and other exceptions remain; an integration clause does not erase every legal claim about oral statements.'});
reviseQuestion('n65',{q:'For covered residential work of four or fewer units, BPC 7191 requires the arbitration notice in a printed contract to use:',opts:['Regular type anywhere','At least 10-point bold Roman or 8-point bold red type, with assent indicated as required','A separate notarized page','Only the contract’s first paragraph'],why:'The arbitration provision must be clearly titled, include the prescribed notice and indicate assent in the provided space. Printed notice uses at least 10-point bold Roman or 8-point bold red; a typed contract uses capitals. Noncompliance prevents enforcement against a person other than the licensee.'});
reviseQuestion('n69',{q:'Your garage-door corporation is sued in an ordinary civil action outside small claims. Its nonlawyer owner:',opts:['May act as its lawyer','Must arrange representation by a licensed attorney','Must settle immediately','Can automatically move it to small claims'],why:'A corporation is legally separate from its owner and ordinarily must appear through an attorney in a civil action. Small claims has specific representative rules. Do not confuse representing yourself as an individual with representing a separate company.'});
reviseQuestion('n70',{q:'A contractor was unlicensed during part of work requiring a license, and no statutory exception applies. In a suit for the contract balance:',why:'BPC 7031 ordinarily bars recovery unless properly licensed throughout performance. The statute has a narrow substantial-compliance exception for previously licensed contractors meeting its conditions; the question assumes that exception does not apply.'});
reviseQuestion('n71',{q:'A contractor whose license was suspended or revoked twice or more in the last eight years must, before contracting on a residence of four units or fewer:',why:'BPC 7030.1 requires the written disclosure for two or more suspensions or revocations within eight years. The trigger is not simply any two complaints, citations or disciplinary contacts.'});
reviseQuestion('n72',{why:'A preliminary notice helps preserve later lien or stop-payment-notice rights when the applicable law requires it. It is not a lawsuit or an immediate payment demand. Late notice may preserve a limited period of work; requirements vary with claimant and project.'});
reviseQuestion('n73',{why:'A private-work mechanics lien reaches the improvement and the relevant interest in the real property under Civil Code 8440. A stop payment notice instead reaches construction funds. Recording a lien does not itself produce payment or a sale.'});
reviseQuestion('n74',{q:'Which construction-payment remedy can an eligible unpaid subcontractor use against funds held by a public entity?',why:'A properly served public-work stop payment notice can require withholding construction funds. It does not lien the courthouse or other public property. A payment-bond claim is a separate potential remedy, not merely a last-resort backup.'});
reviseQuestion('n76',{q:'For an ordinary written home-improvement contract governed by BPC 7159, the mechanics-lien warning belongs:',opts:['Only in commercial advertising','In the contract supplied to the owner','Only at the county recorder','Only in subcontractor invoices'],why:'The prescribed warning explains that eligible unpaid workers, subs or suppliers can have lien rights even after the owner has paid the direct contractor. Include the statutory warning required by the applicable contract provisions.'});
reviseQuestion('n77',{why:'A lien foreclosure is a civil action in superior court, not a small-claims money award. The ordinary deadline is 90 days after lien recording unless an applicable extension applies; recording and lawsuit requirements are separate.'});
reviseQuestion('n78',{why:'SDI is ordinarily withheld from employee wages. California UI and ETT are employer contributions; federal FUTA is employer-paid. Workers’ compensation is insurance, not an employee payroll-tax deduction.'});
reviseQuestion('n82',{q:'At a calendar quarter’s end, FUTA must be deposited when accumulated undeposited liability, including earlier quarters, exceeds:',why:'The threshold is $500 including amounts carried forward. If the total is $500 or less, carry it into the next quarter. At year end, $500 or less may be paid with Form 940; larger accumulated amounts must be deposited under the IRS schedule.'});
reviseQuestion('n83',{q:'Under California’s ordinary rule for covered nonexempt employees, regular wages are paid at least:',why:'Labor Code 204 ordinarily requires designated paydays twice each calendar month. Particular workers and permitted pay schedules have exceptions. Final wages follow separate, faster termination or quitting rules.'});
reviseQuestion('n84',{why:'A school-age 17-year-old generally needs a Permit to Employ and Work. Hours and allowed duties are restricted, and hazardous occupations have special prohibitions and limited exceptions. Parental permission alone is not a substitute.'});
reviseQuestion('n85',{q:'An employee submits a credible complaint that Cal/OSHA classifies as serious. Under LAB 6309, investigation must ordinarily occur as soon as possible, no later than:',why:'For the specified employee complaints, the outside limit is three working days for a serious violation and 14 calendar days for a nonserious violation. A serious complaint from a prosecutor or local law-enforcement agency has a separate 24-hour rule.'});
reviseQuestion('n88',{why:SHEET_HELP[6][7][0]});
reviseQuestion('n89',{q:'A business operating under an ACTIVE contractor license must have:',why:'An active license must have a qualifying individual for the classification. The permitted role depends on the entity and may include an owner, responsible managing employee, officer, member or manager. Inactive-license rules differ.'});
reviseQuestion('n90',{why:'A sole proprietorship does not create a separate legal entity shielding the owner from business liabilities. Personal liability is a central difference from a corporation or LLC; those structures also have exceptions to their liability protection.'});
reviseQuestion('n91',{why:'The corporation continues as a separate entity. Report personnel changes and replace a departing qualifying individual within the applicable 90-day period. Sole-owner death has different cancellation and continuance rules; 90 days is not a universal license-extension period.'});
reviseQuestion('n92',{q:'Which entity generally pays federal tax on corporate profit, followed by shareholder tax when that profit is distributed as dividends?',why:'A C corporation pays its own income tax; shareholders generally pay tax on dividends they receive. The second level concerns distributed dividends. Other entities have different elections and tax rules, so not every LLC has one fixed tax treatment.'});
reviseQuestion('n94',{why:'Under accrual accounting, revenue is generally recognized when earned and expenses when incurred, rather than simply when cash moves. Tax reporting has additional recognition rules and exceptions.'});
reviseQuestion('n97',{why:'Principal: the party whose obligation is bonded. Obligee: the protected party. Surety: the guarantor. The bond and indemnity agreement govern payment and recourse; a contractor commonly must reimburse the surety for a paid claim.'},[lawRef('CIV','2787'),SBA_BONDS]);
reviseQuestion('f1',{why:'Payroll-tax deposit schedules generally depend on tax liability during the IRS lookback period, with special rules such as the $100,000 next-day deposit rule. Employee headcount alone does not set the schedule.'},[IRS_PAY,['CSLB Law & Business sample question',EXAM_GUIDE]]);
reviseQuestion('f2',{why:'A shared sales-staff car supports the business rather than one construction job, so its depreciation is a general/administrative overhead cost. Costs attributable to specific production work can be classified differently.'});
reviseQuestion('f4',{why:'Retention is a withheld portion of payment released under the contract and applicable law. For covered private contracts entered on or after January 1, 2026, Civil Code 8811 caps retention at 5%. Exceptions include non-mixed-use residential projects of four stories or fewer and specified subcontractor bond failures.'});
reviseQuestion('f6',{q:'Which problem can leave a contractor unable to pay Friday’s payroll even when the business shows a profit?',opts:['Using an income statement','Insufficient available cash because collections lag behind bills','Tracking job costs','Preparing a cash budget'],why:'Earned revenue and available cash are different. Slow customer payments can leave wages due before money arrives. Track receivables, scheduled payments and the timing of cash needs.'});
reviseQuestion('e1',{q:'You hire an unlicensed installer to do work requiring a contractor license under your direction, and call that person a subcontractor. Under LAB 2750.5 the worker is:',why:'For work requiring a CSLB license, holding that license is a condition of independent-contractor status under Labor Code 2750.5. Calling a supervised unlicensed installer a subcontractor does not remove employee obligations; a license alone also does not prove independence.'});
reviseQuestion('e2',{why:'Covered employers with five or more employees provide two hours for California supervisors and one for nonsupervisors every two years. New hires or supervisors ordinarily train within six months; specified short-term/seasonal workers have an earlier 30-day or 100-hour deadline.'});
reviseQuestion('e3',{q:'When paying an ordinary hourly nonexempt employee, California employers must provide:',why:'Labor Code 226 requires an itemized wage statement with applicable gross/net wages, hours, rates, deductions, pay-period dates and employer/employee identifying information. Certain salaried-exempt employees need not have total hours shown.'});
reviseQuestion('e6',{why:'The ordinary rule is a paid ten-minute rest period for every four hours worked or major fraction. A workday under 3.5 hours ordinarily needs no rest period. Rest breaks are separate from meal periods; do not combine them to leave early.'});
reviseQuestion('e7',{why:'A willful failure to pay final wages when due can continue the employee’s daily wages as a penalty for up to 30 days. A good-faith dispute may prevent the penalty. The underlying duty to pay earned wages still applies.'});
reviseQuestion('e8',{why:'When the ABC test applies, the hiring business must prove all three conditions: freedom from control, work outside its usual business, and an independently established trade. Statutory exemptions can require a different test; an independent-contractor label or 1099 is not enough.'});
reviseQuestion('e9',{why:'Form W-4 gives the employer information used to determine federal income-tax withholding. It is not the I-9 work-authorization check, the California new-hire report, or the year-end W-2 wage statement.'});
reviseQuestion('i1',{q:'Which entity has the specific CSLB liability-insurance requirement in BPC 7071.19?',why:'An LLC licensee needs at least $1 million with five or fewer people on its personnel of record. Larger listed personnel counts increase required coverage up to $5 million. The count is not simply all employees; other businesses can have separate contractual or legal insurance obligations.'});
reviseQuestion('i2',{why:'Workers’ compensation generally replaces an employee’s civil claim against the employer for a covered workplace injury, without needing to prove employer negligence. Labor Code 3602 contains exceptions; benefits are subject to the system’s eligibility rules.'});
reviseQuestion('i3',{opts:['Conditional waivers are illegal','A conditional waiver depends on payment; an unconditional waiver can release stated rights even if unpaid','Unconditional waivers need notarization','There is no difference'],why:'Use the correct California statutory form and read its covered dates, amounts and exceptions. Conditional releases depend on the specified payment. An unconditional release can surrender the stated rights even without payment, so verify payment first.'});
reviseQuestion('i4',{why:'California provides conditional and unconditional releases for both progress and final payment. Choose by payment stage and whether payment has actually been received; read the form’s exceptions and scope.'});
reviseQuestion('i5',{why:'Commercial general liability commonly addresses covered third-party bodily injury and property damage. Employee injuries, owned tools and vehicles use different coverage. Whether a particular loss is paid depends on policy terms and exclusions.'});
reviseQuestion('i6',{opts:['A 25% discount','A 25% increase in the premium component adjusted by experience, before other factors','25 employees','A 25-month policy'],why:'An experience factor of 1.25 multiplies the applicable base amount by 125%. It reflects claims experience relative to comparable employers. Other rating factors affect the final premium, so the whole bill is not necessarily 25% above another company’s.'});
reviseQuestion('i7',{opts:['They pay your premium','The policy may cover their specified liability arising from your work, subject to its terms','You get access to their coverage','Nothing legally'],why:'Additional-insured coverage must be provided by the policy or an endorsement. Its scope depends on the actual wording. A certificate of insurance alone does not add or expand coverage; request the relevant endorsement too.'});
reviseQuestion('c1',{why:'For a home-improvement change, describe the added work, price and any schedule/payment changes in a written change order signed before that work begins. BPC 7159 requires written, signed contract changes; a handshake is inadequate documentation.'});
reviseQuestion('c2',{q:'Under the ordinary private-work retention deadlines, without a good-faith dispute or other exception, owner-to-prime payment is due within ___ of completion; prime-to-sub within ___ of receipt.',why:'Civil Code 8812 gives the ordinary 45-day owner deadline; 8814 gives the prime ten days after receiving retention to pass on the relevant share. Good-faith disputes and specified public-acceptance circumstances can change what must be released.'});
reviseQuestion('c3',{q:'Under BPC 7108.5, a prime wrongfully withholds a subcontractor’s progress payment past its applicable due date. The statutory penalty is:',why:'The penalty is 2% of the amount due per month. The prevailing party in a collection action can recover attorney fees and costs. The ordinary payment deadline is seven days after receipt unless a different written agreement applies; good-faith disputes have a limited withholding rule.'});
reviseQuestion('c4',{q:'An ordinary written home-improvement contract governed by BPC 7159 must state approximate:',why:'BPC 7159 requires approximate start and completion dates along with the other prescribed contract terms. Put relevant schedule changes in a signed written change order.'});
reviseQuestion('c5',{q:'For a home solicitation contract subject to Civil Code 1689.7(c), the completed Notice of Cancellation form must be supplied:',why:'Section 1689.7(c)(1) requires two copies of the completed cancellation form, attached to the contract and easily detachable. Subsection (g) preserves cancellation rights until required compliance. Qualifying home-improvement and service/repair contracts have specific exceptions, so this is not one universal form rule for every repair.'});
reviseQuestion('c6',{q:'The ordinary California limitation period for an action on a written contract, absent a special rule or tolling, is:',why:'CCP 337 generally provides four years for a written-contract action; CCP 339 generally provides two for an oral contract. When the clock begins and whether it pauses depend on the claim and facts.'},[lawRef('CCP','337'),lawRef('CCP','339')]);
reviseQuestion('c7',{q:'An owner unconditionally accepts a complete, still-open offer, and all other contract elements and required formalities are satisfied. Ordinarily:',why:'Acceptance must be absolute and unqualified. With consideration, capacity, lawful purpose and required formalities, acceptance can form the contract. A counteroffer is different; bidding mistakes and statutory written-contract requirements can change a particular case.'},[lawRef('CIV','1585'),lawRef('CIV','1550')]);
reviseQuestion('c8',{q:'A liquidated-damages clause for unexcused delay in a commercial construction contract:',why:'It states damages in advance, such as an amount per day of unexcused delay. Under Civil Code 1671(b), the commercial rule turns on reasonableness when the contract was made. Consumer and residential-rental contracts have different rules; an arbitrary punishment is not automatically enforceable.'});
reviseQuestion('c9',{why:'An oral agreement leaves scope, price and authorization harder to establish. For covered home-improvement work, use a signed written change order before the extra work starts, including any schedule and payment changes.'});
reviseQuestion('l4',{q:'Is paying the renewal fee alone enough to continue operating under an active CSLB license?',opts:['Yes, even with an expired bond','Yes, insurance never matters','No—maintain the required bond, insurance status and other active-license conditions','Only the business name matters'],why:'Renewal and permission to operate also depend on satisfying active-license requirements. Maintain required bonds, qualifying personnel and workers’ compensation coverage or a valid applicable exemption; LLCs have added requirements.'},[lawRef('BPC','7140'),lawRef('BPC','7071.6'),lawRef('BPC','7125')]);
reviseQuestion('l5',{q:'CSLB’s licensing criminal-history check uses:',why:'BPC 7069 provides for fingerprints and criminal-history information for covered applicants and licensing personnel. Eligibility is assessed under applicable licensing law; a prior conviction does not automatically disqualify every applicant.'});
reviseQuestion('l6',{q:'Regulated asbestos-abatement work involving 100 square feet or more, with no statutory exception, requires:',opts:['Nothing special','A C-22 classification or qualifying asbestos certification, plus required Cal/OSHA registration','Only a dust mask','A B license alone'],why:'The threshold includes exactly 100 square feet. BPC 7058.5 requires C-22 or the qualifier’s asbestos certification for covered work; Labor Code 6501.5 requires registration. Safety rules can apply below that threshold too.'});
reviseQuestion('p1',{q:'For covered California public works subject to prevailing-wage requirements, workers must receive at least:',why:'Use DIR’s applicable determination for the craft, location and relevant project date, including required employer payments and overtime. Prevailing-wage coverage generally begins above $1,000; union membership does not decide coverage.'},[lawRef('LAB','1771'),lawRef('LAB','1773')]);
reviseQuestion('p2',{q:'For public work subject to contractor-registration requirements, a contractor generally must:',opts:['Post a $100,000 cash deposit','Register with DIR before bidding or performing the covered work','Get a federal contractor license','Join a union'],why:'DIR registration is separate from the CSLB license. Labor Code 1725.5 exempts projects of $25,000 or less for construction/alteration/installation/repair and $15,000 or less for maintenance. These registration thresholds do not erase separate prevailing-wage duties.'});
reviseQuestion('p3',{q:'On public work subject to DIR electronic certified-payroll reporting, the contractor must:',why:'Submit the required payroll electronically to the Labor Commissioner at least monthly—at least once each 30 days during work and within 30 days after the last workday—or more often if the contract requires. Specified exemptions exist. Keep accurate records showing classification, hours, rates and pay.'});
reviseQuestion('p4',{q:'On covered public-work contracts of $30,000 or more using apprenticeable crafts, absent an applicable exception, contractors must:',why:'The ordinary minimum is one apprentice hour for every five journeyman hours in the craft. Dispatch requirements, program standards and statutory exceptions matter; document requests for apprentices rather than assuming none are available.'});
reviseQuestion('p5',{why:'Labor Code 1771 ordinarily applies prevailing wages to covered contracted public work over $1,000, including maintenance. Registration, payment bonds and apprenticeship have separate thresholds and exceptions.'});
reviseQuestion('p6',{why:'A bid bond supports the successful bidder’s obligation to enter the contract and furnish required bonds. Its amount and the surety’s remedy depend on the bond and procurement terms; it is different from a payment or performance bond.'});
reviseQuestion('p7',{q:'A contract expressly requires a performance bond equal to its full contract price. What percentage must that bond cover?',why:'Full contract price means 100%. A performance bond secures contract performance; a payment bond protects covered subcontractor and supplier payments. Do not treat this math example as a universal bond-amount rule for every public project.'});
reviseQuestion('p8',{why:'Labor Code 1815 generally requires at least time-and-a-half for public-work hours above eight per calendar day or forty per week, subject to statutory exceptions and applicable determinations. Use the craft’s correct prevailing overtime requirements.'});
reviseQuestion('s1',{q:'Which safety program must a California construction employer generally establish, implement and maintain?',why:'An effective Injury and Illness Prevention Program identifies responsibility, hazards, correction, training and communication. Construction employers follow the written-program requirements; limited documentation exceptions are not permission to have no prevention program.'},[lawRef('LAB','6401.7'),dirRef('1509')]);
reviseQuestion('s2',{q:'Construction employers must adopt which written set of operating safety rules, posted at the jobsite office or readily available through each supervisor?',why:'The Code of Safe Practices must fit the employer’s operations. Section 1509 permits conspicuous jobsite-office posting or provision to each supervisor, who must keep it readily available.'});
reviseQuestion('s3',{q:'Absent a permit exception, an excavation into which a person must descend requires a Cal/OSHA permit when its depth reaches:',why:'The permit threshold is five feet or deeper when someone must enter. Section 341 contains specific exceptions. Protective-system requirements are a separate safety question; having a permit alone does not make a trench safe.'});
reviseQuestion('s4',{why:'Shade must be present when outdoor work-area temperature exceeds 80°F; at or below 80°F, provide it or timely access on request. Supply sufficient drinking water, with replenishment allowed, and cooldown rests. Construction high-heat procedures begin at 95°F.'});
reviseQuestion('s5',{why:'Under hazard-communication rules, required SDS information must be readily accessible during each work shift. Workers also need appropriate labels and training; locking the only copy away from the crew defeats access.'});
reviseQuestion('s7',{q:'Before covered servicing of a garage-door opener where unexpected startup could injure someone, the worker must:',opts:['Rely on the remote being out of reach','Follow the required hazardous-energy isolation and lockout/tagout procedure','Only tell a coworker','Only wear gloves'],why:'Control hazardous electrical and stored mechanical energy under the applicable energy-control procedure, and verify isolation before covered work. Unplugging the motor does not remove spring tension or gravity hazards. Section 3314 has specific exceptions; this question assumes covered servicing.'});
reviseQuestion('s8',{why:'Form 300 records covered work-related injuries and illnesses. Employers subject to recordkeeping post the 300A summary February 1–April 30 and retain required records five years after the covered calendar year. Recordkeeping exemptions do not eliminate serious-incident reporting.'},[dirRef('14300.32'),dirRef('14300.33')]);
reviseQuestion('s9',{why:'A competent person can recognize existing and predictable hazards and has authority to take prompt corrective measures. Experience alone or a contractor license alone does not meet both parts of the definition.'});
reviseQuestion('m3',{q:'On an ordinary $40,000 home-improvement job, completed work and delivered materials equal 60% of contract value. Excluding the permitted down payment and bond exceptions, the progress-payment value limit is:',why:'60% × $40,000 = $24,000 for the completed work and delivered materials described. The ordinary BPC 7159 rule prevents progress payments getting ahead of that value; the question treats the permitted down payment separately.'});
reviseQuestion('m4',{q:'A covered private commercial contract signed in 2026 is $100,000. At the ordinary 5% retention cap, the maximum total retention is:',why:'$100,000 × 0.05 = $5,000. Civil Code 8811 applies the 5% cap to covered private contracts entered on or after January 1, 2026. Specified residential and subcontractor-bond exceptions exist.'});
reviseQuestion('m8',{why:'Markup is measured against cost: $12,000 × 1.25 = $15,000. Profit is $3,000, which is 20% of the selling price.'});
reviseQuestion('m9',{why:'Price = cost ÷ (1 − margin) = $12,000 ÷ 0.75 = $16,000. Check: $4,000 profit ÷ $16,000 price = 25%.'});
reviseQuestion('m11',{why:'$90,000 current assets − $60,000 current liabilities = $30,000 working capital. It is a dollar difference, not necessarily cash available today.'});
reviseQuestion('m13',{q:'In a simplified model with no other expenses or taxes: revenue $80,000, direct costs $50,000, overhead $20,000. Net profit is:',why:'$80,000 − $50,000 − $20,000 = $10,000. A full income statement can include other expenses, interest and taxes; the question explicitly excludes them.'});
reviseQuestion('m14',{why:'Straight-line book depreciation: ($35,000 cost − $5,000 salvage) ÷ five years = $6,000 per year. Tax depreciation may use different rules.'});
reviseQuestion('m15',{q:'Direct costs are $20,000. This estimate adds 15% of cost for overhead, then a 10% markup on that subtotal. The bid is:',why:'Overhead: $20,000 × 0.15 = $3,000. Subtotal: $23,000. Specified markup: $23,000 × 0.10 = $2,300. Bid: $25,300. This is a 10% markup on the subtotal, not a 10% margin on the final bid.'});
reviseQuestion('m17',{why:'The supplied burden is 30% of wages: $25 × 1.30 = $32.50 per hour. Use the problem’s burden assumption; there is no universal statutory burden percentage.'});
/* Math items cite their exact checked calculation, not an invented legal rule. */
