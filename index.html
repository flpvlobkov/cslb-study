/* ---- WEAKNESS TRACKING ----
   Current needs-work questions / distinct answered questions. A correct retry
   removes that question from needs work. Unanswered questions are excluded. */
function catStats(cat){
  var qs=BANK.filter(function(q){ return cat==='All'||q.cat===cat; });
  var right=0, weak=0;
  qs.forEach(function(q){
    if(S.weak[q.id]) weak++;
    else if(S.mastered[q.id]) right++;
  });
  var seen=right+weak;
  return {cat:cat,total:qs.length,seen:seen,right:right,weak:weak,
    acc:seen?Math.round(right/seen*100):null,
    needPct:seen?Math.round(weak/seen*100):null,
    weight:WEIGHTS[cat]||0};
}
function allStats(){ return CATS.filter(function(c){return c!=='All';}).map(catStats); }
function byPriority(a,b){
  var ar=a.seen?a.weak/a.seen:-1, br=b.seen?b.weak/b.seen:-1;
  return br-ar || b.weak-a.weak || b.weight-a.weight;
}
function weakestCategory(){ return allStats().filter(function(s){return s.weak>0;}).sort(byPriority)[0]||null; }
function statusInfo(s){
  if(!s.seen) return {key:'neutral',label:'Not started',color:'var(--steel)'};
  if(s.needPct===0) return {key:'clear',label:'0% needs work',color:'var(--green)'};
  if(s.needPct>=40) return {key:'danger',label:s.needPct+'% needs work',color:'var(--red)'};
  return {key:'warning',label:s.needPct+'% needs work',color:'#A86B09'};
}
function statusIcon(key){
  if(key==='clear') return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(key==='danger') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 20h18.4L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5m0 3h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if(key==='warning') return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6m0 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
}
function catPill(c,active,fn){
  var s=catStats(c), worst=weakestCategory();
  var info=statusInfo(s), label=info.label;
  var help=s.seen?s.weak+' of '+s.seen+' answered questions still need work; '+s.total+' total questions.':'No questions answered yet.';
  return '<button class="pill '+info.key+' '+(active?'on ':'')+(worst&&worst.cat===c?'weakest':'')+'" aria-pressed="'+active+'" title="'+help+'" onclick="'+fn+'(\''+c+'\')">'
    +'<span class="category-title-row"><span class="category-status-icon" style="color:'+info.color+'">'+statusIcon(info.key)+'</span><span class="category-name">'+(c==='All'?'All categories':c)+'</span></span>'
    +'<span class="category-rate '+info.key+'">'+label+'</span>'
    +'<span class="category-mini-bar"><span style="width:'+(s.seen?s.needPct:0)+'%;background:'+info.color+'"></span></span></button>';
}
function focusPicker(){
  var s=catStats(st.cat), info=statusInfo(s);
  return '<button class="focus-picker '+info.key+(st.focusOpen?' open':'')+'" onclick="toggleFocus()" aria-expanded="'+st.focusOpen+'">'
    +'<span class="focus-picker-icon">'+statusIcon(info.key)+'</span>'
    +'<span class="focus-picker-copy"><span class="focus-picker-label">Study focus</span><span class="focus-picker-value">'+(st.cat==='All'?'All categories':st.cat)+'</span><span class="focus-picker-rate">'+info.label+'</span></span>'
    +'<svg class="focus-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
}
function focusCard(){
  var worst=weakestCategory();
  if(!worst) return '';
  return '<button class="focus-card" onclick="jumpCat(\''+worst.cat+'\')">'
    +'<span><strong>Focus next: '+worst.cat+'</strong><small>Weakest area · '+worst.needPct+'% needs work · '+worst.weak+' of '+worst.seen+' answered</small></span>'
    +'<span class="focus-action">Practice missed →</span></button>';
}
function weakPanel(){
  var stats=allStats().sort(byPriority);
  return '<section style="margin:20px 0 12px"><h2 class="section-label">YOUR WEAK AREAS</h2>'
    +'<p class="progress-help">Red marks high needs work, yellow means you are improving, and green means the category is cleared. Correct a missed question to bring the percentage down.</p>'

      var info=statusInfo(s), label=info.label, col=info.color;

        +'<div class="wtop"><span class="wname">'+s.cat+'</span><span class="wpct" style="color:'+col+'">'+label+'</span></div>'
        +'<div class="wbar"><div style="width:'+(s.needPct||0)+'%;background:'+col+'"></div></div>'
        +'<div class="wsub"><span>'+s.weak+' need work / '+s.seen+' answered · '+s.total+' total</span><span>'+s.weight+'% of exam</span></div></button>';
    }).join('')+'</section>';
}

  var h='<div class="card"><div class="reading-label">Exam-style practice · choose the best answer</div><div class="q">'+mark(item.q,item)+'</div>';

    var cls='opt', mk='';

      if(n===item.ans){ cls+=' right'; mk='<span class="mk">\u2713</span>'; }

    var ok=picked===item.ans;
    h+='<div class="why '+(ok?'ok':'no')+'"><b>'+(ok?'Correct — ':'Answer: ')+'ABCD'[item.ans]+'. '+esc(item.opts[item.ans])+'</b><p class="plain-answer">'+mark(item.why,item)+'</p>'+(item.steps?'<ol class="math-steps">'+item.steps.map(function(step){return '<li>'+esc(step)+'</li>';}).join('')+'</ol>':'')+'<p class="memory-cue"><strong>Remember:</strong> '+esc(item.cue)+'</p>'+questionReferences(item)+'</div>';

function pickStudy(n){
  if(st.picked!==null) return;

function nextStudy(){
  var remaining=st.order.slice(st.idx+1);
  if(st.mode==='weak'){

    if(remaining.length){st.order=remaining;st.idx=0;st.picked=null;}
    else reorder();
  } else {st.picked=null;st.idx=(st.idx+1<st.order.length)?st.idx+1:0;}

/* ---- QUIZ (weighted to the real exam) ---- */
function recordAnswer(item,correct,source){
  if(correct){ delete S.weak[item.id]; S.mastered[item.id]=true; }
  else { S.weak[item.id]=(S.weak[item.id]||0)+1; delete S.mastered[item.id]; }
  var h=S.history[item.id]||{right:0,wrong:0};
  if(correct) h.right++; else h.wrong++;
  h.cat=item.cat; h.lastCorrect=correct; h.lastAnswered=Date.now(); h.lastSource=source;
  S.history[item.id]=h; save();
}
function saveQuizState(){
  S.activeQuiz=qz.qs?{cat:qz.cat,len:qz.len,ids:qz.qs.map(function(q){return q.id;}),i:qz.i,picked:qz.picked,right:qz.right,done:qz.done}:null;
  save();
}
function setQCat(c){ qz.cat=c; if(c!=='All'&&(qz.len===50||qz.len===115))qz.len=25; saveQuizState(); render(); }
function setQLen(n){ qz.len=n; saveQuizState(); render(); }
function startQuiz(){
  var picked=[];
  if(qz.cat==='All'){
    var total=0; for(var k in WEIGHTS) total+=WEIGHTS[k];
    var t=[]; for(var c in WEIGHTS){ var ex=(WEIGHTS[c]/total)*qz.len; t.push({c:c,n:Math.floor(ex),rem:ex-Math.floor(ex)}); }
    var got=0; t.forEach(function(x){got+=x.n;});
    t.sort(function(a,b){return b.rem-a.rem;});
    for(var i=0;i<qz.len-got;i++) t[i%t.length].n++;
    t.forEach(function(x){
      var pool=shuffle(BANK.filter(function(q){return q.cat===x.c;}));
      picked=picked.concat(pool.slice(0,Math.min(x.n,pool.length)));
    });
    picked=shuffle(picked).slice(0,qz.len);
  } else {
    picked=shuffle(BANK.filter(function(q){return q.cat===qz.cat;})).slice(0,qz.len);
  }
  qz.qs=picked; qz.i=0; qz.picked=null; qz.right=0; qz.done=false; saveQuizState(); render();
}
function pickQuiz(n){
  if(qz.picked!==null) return;
  qz.picked=n;
  var item=qz.qs[qz.i];
  var correct=n===item.ans; if(correct) qz.right++;
  recordAnswer(item,correct,'quiz'); saveQuizState(); keepPagePosition=true; render();
}
function nextQuiz(){
  if(qz.i+1<qz.qs.length){ qz.i++; qz.picked=null; }
  else {
    var pct=Math.round(qz.right/qz.qs.length*100);
    S.scores.push({pct:pct,cat:qz.cat,len:qz.qs.length,when:new Date().toLocaleDateString()});
    qz.done=true;
  }
  saveQuizState(); render();
}
function resetQuiz(){ qz.qs=null; qz.picked=null; qz.done=false; saveQuizState(); render(); }
function viewQuiz(){
  if(!qz.qs){
    var pills=CATS.map(function(c){ return catPill(c, qz.cat===c, 'setQCat'); }).join('');
    var recent='';
    if(S.scores.length){
      recent='<div style="margin-top:16px"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--steel);margin-bottom:6px">RECENT SCORES</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
        + S.scores.slice(-8).map(function(s){
            var bg=s.pct>=90?'#E6F4EC':(s.pct>=70?'#FDF3E0':'#FBEAEA');
            var fg=s.pct>=90?'var(--green)':(s.pct>=70?'#A87613':'var(--red)');

      + '<details style="font-size:13px;line-height:1.6;margin-bottom:14px"><summary>✓ Sources reviewed · September 14, 2026</summary><p>All 174 practice questions have been reviewed. The supplied 2025 Television Education textbook was compared with the official 2026 CSLB reference book and current California and federal agency sources. Each answer includes its specific reference or checked calculation.</p><p><b>For C-61/D-28:</b> Law &amp; Business is the relevant qualifying exam; C-61 has no separate trade exam. These are independent practice questions, not CSLB’s live test.</p><p><b>Corrections to remember:</b> the ordinary small-claims limits are $12,500 for individuals and $6,250 for entities; the broad no-employee workers’ compensation change is scheduled for 2028; covered new private contracts have a 5% retention cap; the regulated asbestos threshold includes exactly 100 square feet. Read each explanation for scope and exceptions.</p><p>Your saved results remain as earned. Updates do not retroactively regrade earlier work.</p><a class="help-source" href="'+LAW_BOOK+'" target="_blank" rel="noopener noreferrer">Official 2026 CSLB law book ↗</a><a class="help-source" href="'+EXAM_GUIDE+'" target="_blank" rel="noopener noreferrer">Official exam topics and weights ↗</a></details>'
      + '<div class="row" style="padding-bottom:12px"><button class="pill '+(qz.len===10?'on':'')+'" onclick="setQLen(10)">Quick 10</button>'

      + '<button class="btn" style="margin-top:0" onclick="startQuiz()">START QUIZ</button>'+recent+'</div>';
  }
  if(qz.done){
    var pct=Math.round(qz.right/qz.qs.length*100);
    var col=pct>=90?'var(--green)':(pct>=70?'var(--amber)':'var(--red)');

    return '<div class="card" style="text-align:center">'

    + '<div class="bar"><div style="width:'+(qz.i/qz.qs.length*100)+'%"></div></div>'
    + qCard(Q,qz.picked,'pickQuiz')
    + (qz.picked!==null?'<button class="btn dark" onclick="nextQuiz()">'+(qz.i+1<qz.qs.length?'NEXT QUESTION \u2192':'SEE MY SCORE')+'</button>':'');
}

    }
  }
  if(studyOrderExpanded)saveStudyState();
}

async function startApp(){
  load();readSyncKey();await syncFromCloudOnStart();restoreAppState();render();
  if(tab==='sheet'&&S.sheet.detail&&!S.learning.paused)scrollToSheetHelp();
}
startApp();
</script>
