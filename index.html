<script>
/* ==== DATA (injected) ==== */
const BANK = [
  // ===== LICENSING =====
  { id: "n1", cat: "Licensing", q: "A homeowner asks you to replace two garage door springs. Parts and labor total $1,150. To legally take this job you must:", opts: ["Have any active CSLB license", "Hold a license covering the work, since the total is $1,000 or more", "Only provide a written receipt", "Nothing — repairs are always exempt"], ans: 1, why: "The license line is $1,000 in COMBINED labor and materials. At or above it, you need a license in the right classification. Under $1,000 is 'minor work' — but you can't split one job into pieces to duck under it." },
  { id: "n2", cat: "Licensing", q: "How many members sit on the Contractors State License Board?", opts: ["7", "11", "15", "21"], ans: 2, why: "15 total: 8 public members (the majority), 5 contractors, 1 local building official, and 1 labor representative. Public members outnumber contractors on purpose — the Board exists to protect consumers." },
  { id: "n3", cat: "Licensing", q: "When protecting the public conflicts with any other interest, the CSLB must favor:", opts: ["Licensed contractors", "Protection of the public", "State revenue", "Insurance companies"], ans: 1, why: "Public protection is the Board's HIGHEST priority by law. On the exam, when two answers both seem right, pick the one that protects the consumer." },
  { id: "n4", cat: "Licensing", q: "Day-to-day enforcement of contractor license law — issuing licenses, investigating complaints, disciplining contractors — is handled by the:", opts: ["Governor", "Registrar of Contractors", "Attorney General", "County building department"], ans: 1, why: "The Registrar is the CSLB's executive officer and runs the operation. The Board sets policy; the Registrar enforces it." },
  { id: "n5", cat: "Licensing", q: "An applicant must pass BOTH exams (trade + Law & Business) within what time after the application is accepted?", opts: ["90 days", "12 months", "18 months", "5 years"], ans: 2, why: "18 months, unlimited attempts. Miss the window and the application is void. Don't confuse it with the 5 YEARS a passing score stays valid." },
  { id: "n6", cat: "Licensing", q: "After receiving your pass letter, you must pay the initial license fee and file your bond within:", opts: ["30 days", "60 days", "90 days", "1 year"], ans: 2, why: "90 days or the application goes void. Your passing SCORE still counts for 5 years, but this application dies — you'd reapply." },
  { id: "n7", cat: "Licensing", q: "A passing exam score remains valid for:", opts: ["1 year", "2 years", "5 years", "Forever"], ans: 2, why: "5 years. So if life gets in the way after passing, you can come back within 5 years without retesting." },
  { id: "n8", cat: "Licensing", q: "The standard contractor's bond required for every active license is:", opts: ["$10,000", "$15,000", "$25,000", "$100,000"], ans: 2, why: "$25,000, filed in favor of the State of California. A lapsed bond is the #1 cause of license suspension. The $100,000 figure is the EXTRA bond LLCs carry." },
  { id: "n9", cat: "Licensing", q: "After a license is revoked or suspended, the disciplinary bond required for reinstatement can be as high as:", opts: ["2× the standard bond", "5× the standard bond", "10× the standard bond", "There is no disciplinary bond"], ans: 2, why: "At least $25,000 and up to 10 times the standard bond amount. It stays on file for at least 2 years." },
  { id: "n10", cat: "Licensing", q: "In addition to the $25,000 license bond, an LLC contractor must also file:", opts: ["A $50,000 tax bond", "A $100,000 surety bond protecting workers' wages and benefits", "A $1 million cash deposit", "Nothing extra"], ans: 1, why: "LLCs carry an extra $100,000 bond covering unpaid employee wages/benefits — plus liability insurance ($1M minimum). It's the price of the liability shield." },
  { id: "n11", cat: "Licensing", q: "An ACTIVE license renews every ___ ; an INACTIVE license renews every ___ .", opts: ["1 year / 2 years", "2 years / 4 years", "2 years / 2 years", "4 years / 2 years"], ans: 1, why: "Active = 2 years. Inactive = 4 years. Inactive needs no bond, no workers' comp, no qualifier — but you cannot contract or advertise while inactive." },
  { id: "n12", cat: "Licensing", q: "An expired license can still be renewed (with a delinquency fee) for up to:", opts: ["1 year", "3 years", "5 years", "10 years"], ans: 2, why: "5 years from expiration. After that it's void and you start over with a new application. The delinquency fee is 50% of the renewal fee." },
  { id: "n13", cat: "Licensing", q: "California has license reciprocity agreements (possible TRADE exam waiver) with:", opts: ["Oregon, Washington, Idaho", "Arizona, Nevada, Utah", "Texas, Arizona, Oregon", "Nevada, Hawaii, Alaska"], ans: 1, why: "AZ, NV, UT — and only the trade exam can be waived. EVERYONE takes California's Law & Business exam. (That's the one you're studying for.)" },
  { id: "n14", cat: "Licensing", q: "A Responsible Managing Employee (RME) must work for the business at least:", opts: ["20 hours per week", "32 hours/week or 80% of business hours, whichever is less", "40 hours per week", "There is no minimum"], ans: 1, why: "32 hours a week OR 80% of the total weekly operating hours — whichever is LESS. An RME who doesn't actually work there is illegal 'license renting.'" },
  { id: "n15", cat: "Licensing", q: "One qualifying individual may act as the qualifier for at most how many firms in a one-year period?", opts: ["1", "2", "3", "Unlimited"], ans: 2, why: "3 firms max — and for any firm beyond the first, the qualifier must own at least 20% of it. This blocks people from selling their license across town." },
  { id: "n16", cat: "Licensing", q: "Business name and license number on your work truck must be in letters at least:", opts: ["1/2 inch", "3/4 inch", "1 inch", "2 inches"], ans: 1, why: "3/4 inch minimum for most contractors. Exception: C-36 plumbing, C-45 sign, and C-57 well drilling need name, ADDRESS and number at 1-1/2 inches on BOTH sides." },
  { id: "n17", cat: "Licensing", q: "The D-28 classification covers:", opts: ["Fencing", "Doors, gates and activating devices", "Framing", "Low-voltage electrical"], ans: 1, why: "D-28 (under the C-61 Limited Specialty class) = doors, gates, and their activating devices — your garage door lane. Working or ADVERTISING outside it is a violation." },
  { id: "n18", cat: "Licensing", q: "A joint venture license (two or more licensed firms bidding together) is issued for:", opts: ["1 year", "2 years, renewable", "5 years", "The length of one project only"], ans: 1, why: "2 years and renewable. It needs its own bond, but no new exam — every member firm is already licensed." },
  { id: "n19", cat: "Licensing", q: "An UNLICENSED person may legally advertise for construction work only if:", opts: ["They never collect a deposit", "The job is under $500 total AND the ad says they're not licensed", "The work is residential", "They subcontract everything"], ans: 1, why: "Both conditions: under $500 total (labor + materials) AND the ad must state they are not a licensed contractor. Everything else is misdemeanor unlicensed contracting." },
  { id: "n20", cat: "Licensing", q: "After a permit is issued, a building inspector may enter the jobsite (with owner/occupant consent) between:", opts: ["Any hour, any day", "8 a.m. and 6 p.m.", "9 a.m. and 5 p.m.", "Sunrise and sunset"], ans: 1, why: "8:00 a.m.–6:00 p.m. with consent. Outside those hours requires consent or a court order." },
  { id: "n21", cat: "Licensing", q: "A licensed sole owner incorporates and keeps 60% of the stock. The old license number:", opts: ["Is void forever", "May be reassigned to the corporation — permanently", "Transfers automatically", "Can return to the sole owner later"], ans: 1, why: "Reassignment is allowed at 51%+ ownership, but it's a ONE-WAY street — once the number goes corporate it can never go back to a sole-owner license." },
  // ===== DEADLINES =====
  { id: "n22", cat: "Contracts", q: "A 68-year-old buyer signs a home solicitation contract at her kitchen table. She may cancel within:", opts: ["24 hours", "3 business days", "5 business days", "10 business days"], ans: 2, why: "Buyers 65 and older get 5 business days; everyone else gets 3. The clock starts when they receive the required cancellation notice." },
  { id: "n23", cat: "Contracts", q: "A buyer validly cancels a home solicitation contract. The contractor must return the down payment within:", opts: ["3 days", "5 days", "10 days", "30 days"], ans: 2, why: "10 days. And the contractor must pick up any delivered materials within 20 days of the cancellation." },
  { id: "n24", cat: "Contracts", q: "A prime contractor receives a progress payment on the 1st. Subcontractors must be paid their share by the:", opts: ["3rd", "8th", "15th", "30th"], ans: 1, why: "Within 7 DAYS of receiving each progress payment (unless a written agreement says otherwise). Late payment risks a 2%-per-month penalty plus attorney fees." },
  { id: "n25", cat: "Licensing", q: "You want to appeal a citation issued by the Registrar. Your deadline is:", opts: ["5 working days", "10 working days", "15 working days", "30 calendar days"], ans: 2, why: "15 WORKING days from service of the citation. Miss it and the citation becomes final — pay the fine and comply." },
  { id: "n26", cat: "Licensing", q: "Your qualifying individual leaves the company. You must notify the Registrar and name a replacement within:", opts: ["30 days", "60 days", "90 days", "6 months"], ans: 2, why: "90 days, or the license (or that classification) is automatically suspended. 90 days is also the window for reporting name/address/personnel changes." },
  { id: "n27", cat: "Contracts", q: "The CSLB sends you an 'Agreement to Arbitrate' form. To keep arbitration moving you return it within:", opts: ["10 days", "15 days", "30 days", "60 days"], ans: 2, why: "30 days. After the hearing closes, the arbitrator also has 30 days to issue a decision. The CSLB pays the arbitrator and one expert witness." },
  { id: "n28", cat: "Licensing", q: "A complaint about a LATENT (hidden structural) defect may be filed with the CSLB within:", opts: ["2 years", "4 years", "10 years", "18 months"], ans: 2, why: "Latent = 10 years. PATENT (obvious, visible) defects = 4 years. Memory hook: hidden problems get more time because nobody could see them." },
  { id: "n29", cat: "Licensing", q: "How long must a contractor keep project records after completing a job?", opts: ["2 years", "3 years", "5 years", "7 years"], ans: 2, why: "5 years after completion. (Employee WAGE records: 3 years. Injury logs: 5 years. Asbestos records: 30 years.)" },
  { id: "n30", cat: "Ins & Liens", q: "To preserve full lien rights, a sub or supplier serves a preliminary notice within how many days of first furnishing labor/materials?", opts: ["10", "15", "20", "30"], ans: 2, why: "20 days — served on the owner, prime, and construction lender. Serve it late and it still works, but only covers work going back 20 days before service." },
  { id: "n31", cat: "Ins & Liens", q: "After a project finishes, the owner may record a Notice of Completion within:", opts: ["10 days", "15 days", "30 days", "60 days"], ans: 1, why: "15 days of completion. Recording it SHORTENS everyone's lien windows (subs 30 days, prime 60) — that's exactly why owners file it." },
  { id: "n32", cat: "Ins & Liens", q: "An owner may record a Notice of Cessation after work has stopped continuously for:", opts: ["15 days", "30 days", "60 days", "90 days"], ans: 1, why: "30 continuous days of no work. It triggers the same shortened lien deadlines as a notice of completion." },
  { id: "n33", cat: "Ins & Liens", q: "A Notice of Completion WAS recorded. A SUBCONTRACTOR must record a mechanics lien within:", opts: ["15 days", "30 days", "60 days", "90 days"], ans: 1, why: "Subs: 30 days. The PRIME gets 60. If NO notice was recorded, everyone gets 90 days from completion. Memorize the 30/60/90 ladder." },
  { id: "n34", cat: "Ins & Liens", q: "A Notice of Completion WAS recorded. The PRIME contractor must record a mechanics lien within:", opts: ["30 days", "60 days", "90 days", "120 days"], ans: 1, why: "Prime: 60 days when a notice was recorded. Subs get 30; everyone gets 90 if no notice exists." },
  { id: "n35", cat: "Ins & Liens", q: "After recording a mechanics lien, the lawsuit to foreclose it must be filed within:", opts: ["30 days", "60 days", "90 days", "1 year"], ans: 2, why: "90 days from recording (and record a lis pendens with the county). Miss it and the lien simply expires — all that leverage gone." },
  { id: "n36", cat: "Ins & Liens", q: "An owner discovers unauthorized work (e.g., a tenant hired a contractor). To avoid liens, the owner posts and records a Notice of Non-Responsibility within:", opts: ["5 days", "10 days", "15 days", "30 days"], ans: 1, why: "10 days of learning about the construction — BOTH posted on the property AND recorded with the county." },
  { id: "n37", cat: "Employment", q: "You fire an installer on Tuesday at noon. His final wages are due:", opts: ["Immediately at termination", "Within 72 hours", "Next regular payday", "Within 5 days"], ans: 0, why: "Fired = paid IMMEDIATELY. Quit with no notice = within 72 hours. Quit with 72-hour notice = on the last day. Waiting-time penalties run up to 30 days of wages." },
  { id: "n38", cat: "Employment", q: "A new hire must be reported to the EDD within:", opts: ["3 days", "10 days", "20 days", "30 days"], ans: 2, why: "20 days of the start-of-work date. Compare: the I-9 employer section is due within 3 business days." },
  { id: "n39", cat: "Employment", q: "The employer's section of a new employee's I-9 form must be completed within:", opts: ["1 business day", "3 business days", "10 business days", "20 days"], ans: 1, why: "3 business days of the employee starting work. It verifies identity and authorization to work in the U.S." },
  { id: "n40", cat: "Safety", q: "Tailgate (toolbox) safety meetings with field crews must be held at least every:", opts: ["5 working days", "10 working days", "15 working days", "30 days"], ans: 1, why: "Every 10 WORKING days. Supervisor/foreman safety meetings are MONTHLY. This exact number shows up on the exam constantly." },
  { id: "n41", cat: "Safety", q: "A serious injury on your jobsite must be reported to Cal/OSHA:", opts: ["Within 24 hours", "Within 3 days", "Within 8 hours of the next shift", "Immediately"], ans: 3, why: "Immediately — same for a death. Your insurance carrier gets written accident notice within 5 days; unemployment claims get a response within 10." },
  { id: "n42", cat: "Ins & Liens", q: "You must notify your insurance carrier of a jobsite accident within:", opts: ["24 hours", "5 days", "10 days", "30 days"], ans: 1, why: "5 days for accident notice to your insurer. (10 days to respond to an unemployment insurance claim — don't mix those two up.)" },
  { id: "n43", cat: "Safety", q: "Before digging post holes for a new gate, you must contact 811 (Underground Service Alert) at least:", opts: ["24 hours before", "2 working days before", "5 calendar days before", "14 working days before"], ans: 1, why: "At least 2 WORKING days, no more than 14 calendar days ahead. Weekends don't count as working days — call Thursday for a Monday dig." },
  { id: "n44", cat: "Safety", q: "An 811 locate ticket remains valid for:", opts: ["14 days", "21 days", "28 days", "90 days"], ans: 2, why: "28 calendar days. Job runs longer? Renew the ticket before it lapses — digging on an expired ticket is digging without one." },
  { id: "n45", cat: "Safety", q: "Asbestos exposure monitoring and medical records must be kept for:", opts: ["5 years", "10 years", "30 years", "The life of the company"], ans: 2, why: "30 years — asbestos diseases take decades to appear. Regular injury/illness logs: 5 years." },
  // ===== PENALTIES =====
  { id: "n46", cat: "Licensing", q: "A FIRST conviction for contracting without a license carries:", opts: ["Up to $1,000 fine only", "Up to $5,000 and/or 6 months in jail", "20% of the contract price", "$30,000 civil penalty, mandatory"], ans: 1, why: "First offense: misdemeanor, up to $5,000 and/or 6 months. It gets much worse the second time." },
  { id: "n47", cat: "Licensing", q: "A SECOND conviction for unlicensed contracting carries:", opts: ["The same as the first", "Up to $10,000 only", "20% of the contract price OR $5,000 (whichever is greater) PLUS at least 90 days in jail", "License denial only"], ans: 2, why: "The fine jumps to 20% of the contract price (or payments received) or $5,000, whichever is GREATER — and jail time of at least 90 days is mandatory." },
  { id: "n48", cat: "Licensing", q: "Under BPC 7099.2, the maximum civil penalty for specified licensed-contractor violations, including aiding unlicensed activity, is:", opts: ["$5,000", "$15,000", "$30,000", "$50,000"], ans: 2, why: "$30,000 for violations of BPC 7110, 7114, or 7118; the ordinary maximum under 7099.2 is $8,000. Do not confuse this with the separate unlicensed-activity citation under BPC 7028.7, capped at $15,000. These are civil citations, not criminal sentences." },
  { id: "n49", cat: "Licensing", q: "Deliberate, fraudulent use of another contractor's license number is punishable by:", opts: ["A warning letter", "Up to $10,000 and/or 1 year in jail", "$500 civil fine", "License probation only"], ans: 1, why: "Up to $10,000 and/or a year in jail. Exam instinct: the word 'FRAUD' in a question almost always signals possible jail time." },
  { id: "n50", cat: "Licensing", q: "Holding only a D-28, you run an ad saying 'We also do electrical panel upgrades.' This is:", opts: ["Fine if you sub it out", "A misdemeanor with a $100–$5,000 fine", "Only a problem if someone hires you", "Legal under $1,000"], ans: 1, why: "Advertising outside your classification is a misdemeanor ($100–$5,000) — the AD itself is the violation, no customer needed. Advertise only what your license covers." },
  { id: "n51", cat: "Contracts", q: "A contractor willfully diverts $3,000 of a customer's construction funds to a personal debt and willfully fails to finish the work or pay for supplied labor/materials. Under Penal Code 484b, this creates:", opts: ["A civil matter only", "Only misdemeanor exposure regardless of amount", "Potential felony punishment because the amount exceeds $2,350", "No violation if repaid within 30 days"], ans: 2, why: "Under Penal Code 484b, $2,350 or less is a misdemeanor; above $2,350, felony punishment is possible. The statute requires wrongful diversion and the specified willful failure to complete improvements or pay for construction inputs. A felony is not automatic merely because money moved." },
  { id: "n52", cat: "Safety", q: "A willful safety violation causes an employee's death. The employer faces:", opts: ["$10,000 max", "$25,000 and probation", "$100,000–$250,000 and/or 1–3 years in prison", "Civil liability only"], ans: 2, why: "$100,000–$250,000 and/or 1–3 years for a first offense; corporations/LLCs can be fined up to $1.5 million. The biggest penalties in the book protect human life." },
  { id: "n53", cat: "Licensing", q: "The delinquency fee for renewing a license late is:", opts: ["A flat $50", "25% of the renewal fee", "50% of the renewal fee", "Double the renewal fee"], ans: 2, why: "50% of the renewal fee, on top of the renewal itself. And remember — contracting with an EXPIRED license is unlicensed contracting." },
  { id: "n54", cat: "Safety", q: "Willfully digging WITHOUT notifying 811 first exposes you to a civil penalty of up to:", opts: ["$5,000", "$10,000", "$50,000", "$100,000"], ans: 2, why: "$50,000 for knowing/willful violations; $10,000 for negligent ones — plus repair costs and possible license discipline. Hitting a gas line can also get people killed." },
  { id: "n55", cat: "Employment", q: "Penalties for child labor violations run:", opts: ["$100 / $200 / $500", "$1,000 / $2,000 / $5,000 for 1st, 2nd, 3rd offenses", "$5,000 flat", "Jail only"], ans: 1, why: "$1,000 first, $2,000 second, $5,000 third. Minors also need work permits and can't run dangerous equipment." },
  { id: "n56", cat: "Contracts", q: "A contractor makes a false promise to land a home improvement contract. The owner may recover:", opts: ["Nothing without a lawsuit win", "$500 plus attorney fees plus actual damages", "Triple the contract price", "Only their deposit"], ans: 1, why: "A $500 penalty + attorney's fees + any actual damages. Violating home-improvement rules generally: $100–$5,000 civil, up to $5,000 and/or a year criminal." },
  // ===== CONTRACTS =====
  { id: "n57", cat: "Contracts", q: "Which is NOT one of the four essential elements of a valid contract?", opts: ["Mutual assent (offer + acceptance)", "Consideration", "Notarization", "Legal purpose"], ans: 2, why: "The four: mutual assent, consideration (something of value exchanged), capacity (legal ability to contract), legal purpose. Notarization is never required for validity." },
  { id: "n58", cat: "Contracts", q: "A contract signed under duress or induced by fraud is:", opts: ["Void", "Voidable by the injured party", "Automatically criminal", "Fully enforceable"], ans: 1, why: "VOIDABLE — valid on its face, but the wronged party can cancel. VOID contracts (illegal purpose, or signed by an unlicensed contractor) never legally existed and nobody can enforce them." },
  { id: "n59", cat: "Contracts", q: "A home improvement contract must be in WRITING whenever the price exceeds:", opts: ["$250", "$500", "$750", "$1,000"], ans: 1, why: "$500. Keep the three thresholds straight: $500 = written HIC required, $750 = service & repair ceiling, $1,000 = license required." },
  { id: "n60", cat: "Contracts", q: "The maximum down payment on a $12,000 home improvement contract is:", opts: ["$1,200", "$1,000", "$2,400", "Always 10%"], ans: 1, why: "The LESSER of $1,000 or 10%. Here 10% = $1,200, so the cap is $1,000. On a $6,000 job it would be $600. The exam loves flipping this to 'whichever is greater' — don't bite." },
  { id: "n61", cat: "Contracts", q: "On a home improvement job, each progress payment may not exceed:", opts: ["25% of the contract", "The value of work performed and materials delivered", "Whatever the schedule says", "50% at the halfway point"], ans: 1, why: "You can never be paid ahead of the work (except the legal down payment). The payment schedule in the contract must reflect actual work and materials." },
  { id: "n62", cat: "Contracts", q: "A compliant SERVICE AND REPAIR contract requires that:", opts: ["The contractor initiated the sales contact", "The price is $750 or less and the BUYER initiated contact", "A 10% deposit was collected", "The job spans multiple visits"], ans: 1, why: "S&R: buyer calls YOU, $750 or less, generally one visit. Done correctly, the normal 3-day cancellation right doesn't apply once work is done and goods delivered — which is why the rules are strict." },
  { id: "n63", cat: "Contracts", q: "A person who solicits and negotiates home improvement contracts for your company must:", opts: ["Hold their own contractor's license", "Register with the CSLB as a Home Improvement Salesperson", "Just be a W-2 employee", "Carry a $25,000 bond"], ans: 1, why: "Home Improvement Salespersons (HIS) register with the CSLB. Using an unregistered salesperson is a cause for discipline against YOUR license." },
  { id: "n64", cat: "Contracts", q: "Your contract contains a 'complete agreement' (integration) clause. A verbal promise you made that never got written in is:", opts: ["Still binding", "Not enforceable — only the written terms count", "Binding if there were witnesses", "Binding up to $500"], ans: 1, why: "The written document IS the deal. This cuts both ways: get every change order in writing, because customers' verbal promises don't bind them either." },
  { id: "n65", cat: "Contracts", q: "In a printed residential contract, an arbitration clause must appear in at least:", opts: ["Regular type anywhere", "10-point bold Roman type (or 8-point red), and both parties initial it", "A separate notarized page", "The first paragraph"], ans: 1, why: "10-pt bold (or contrasting red at 8-pt); typed contracts use CAPITAL LETTERS — and both parties initial the clause. Buried arbitration clauses are unenforceable." },
  { id: "n66", cat: "Contracts", q: "Handwritten changes on a pre-printed contract form conflict with the printed text. Which controls?", opts: ["The printed text", "The handwritten/typed changes", "Neither — the contract is void", "Whichever favors the contractor"], ans: 1, why: "Handwriting and typed insertions beat pre-printed boilerplate — they show what the parties actually negotiated." },
  { id: "n67", cat: "Contracts", q: "CSLB MANDATORY arbitration applies when the alleged financial harm is:", opts: ["$10,000 or less", "$25,000 or less", "$25,000–$50,000", "Any amount"], ans: 1, why: "Mandatory: ≤ $25,000 (contractor must participate; license must be in good standing, no prior discipline). Voluntary: $25,000–$50,000 with BOTH parties agreeing." },
  { id: "n68", cat: "Contracts", q: "The ordinary California small claims limit for a sole proprietor suing a customer is:", opts: ["$5,000", "$6,250", "$12,500", "$25,000"], ans: 2, why: "The ordinary limit is $12,500 for individuals, including sole proprietors, and $6,250 for corporations and other business entities. Additional restrictions and exceptions apply, including the usual two-claims-over-$2,500 annual limit. Source: California Code of Civil Procedure 116.220–116.231." },
  { id: "n69", cat: "Contracts", q: "Your garage door LLC gets sued in superior court. The company:", opts: ["May be represented by you personally", "Must appear through a licensed attorney", "Must settle", "Can move it to small claims"], ans: 1, why: "Corporations and LLCs must have an attorney in civil court. Sole owners and partnerships may represent themselves. (In small claims, nobody gets an attorney.)" },
  { id: "n70", cat: "Contracts", q: "A contractor whose license was suspended for part of a job sues the owner for the unpaid balance. The court will:", opts: ["Award the balance", "Dismiss — you must be licensed at ALL times during performance to sue for compensation", "Award half", "Send it to the CSLB"], ans: 1, why: "No license = no lawsuit for pay, and the owner can even claw back money already paid. 'Substantial compliance' is a narrow exception — don't count on it." },
  { id: "n71", cat: "Contracts", q: "A contractor disciplined twice within the last 8 years must, before contracting on a 1–4 unit residence:", opts: ["Post a larger bond", "Disclose those suspensions/revocations to the owner", "Get CSLB pre-approval per job", "Nothing special"], ans: 1, why: "Two disciplinary actions in 8 years triggers a written disclosure duty to residential customers before contracting." },
  // ===== LIENS =====
  { id: "n72", cat: "Ins & Liens", q: "The purpose of a PRELIMINARY notice is to:", opts: ["Start a lawsuit", "Preserve your right to later record a lien or stop notice", "Demand immediate payment", "Terminate the contract"], ans: 1, why: "It's not a threat — it's a required heads-up to the owner, prime, and lender that you're on the job. No prelim (when required) = no lien rights later." },
  { id: "n73", cat: "Ins & Liens", q: "A mechanics lien attaches to:", opts: ["The owner's bank account", "The improved real property itself", "The prime contractor's bond", "Construction funds"], ans: 1, why: "The PROPERTY. It's enforced by foreclosure — forcing a sale to pay the debt. That's why it's the most powerful private-work collection tool. (Funds are what a STOP NOTICE reaches.)" },
  { id: "n74", cat: "Public Works", q: "On a PUBLIC works project, an unpaid subcontractor's primary remedy is:", opts: ["A mechanics lien on the courthouse", "A stop payment notice", "Small claims court", "Repossessing installed materials"], ans: 1, why: "You cannot lien public property. A stop payment notice freezes unpaid construction FUNDS held by the public entity; the payment bond (required over $25,000) is the backup." },
  { id: "n75", cat: "Public Works", q: "A payment bond is required on public works contracts over:", opts: ["$10,000", "$25,000", "$50,000", "$100,000"], ans: 1, why: "$25,000. The bond guarantees subs and suppliers get paid even if the prime goes under — the public-works substitute for lien rights." },
  { id: "n76", cat: "Ins & Liens", q: "The 'Mechanics Lien Warning' must be given to:", opts: ["Only commercial clients", "The owner, as part of every home improvement contract", "The county recorder", "Subcontractors only"], ans: 1, why: "It's mandatory HIC content — it warns owners that unpaid subs/suppliers can lien the home even if the owner paid the prime in full. Omitting it is a disciplinable violation." },
  { id: "n77", cat: "Ins & Liens", q: "Foreclosing a mechanics lien requires filing in:", opts: ["Small claims court", "Superior court", "Federal court", "CSLB arbitration"], ans: 1, why: "Superior court only — small claims can award money but cannot foreclose a lien. File within 90 days of recording the lien." },
  // ===== EMPLOYMENT & SAFETY =====
  { id: "n78", cat: "Employment", q: "Which payroll tax is paid by the EMPLOYEE only?", opts: ["FUTA", "SUI", "SDI", "Workers' compensation"], ans: 2, why: "SDI (State Disability) is withheld from the employee. Employer-only: FUTA, SUI/ETT, workers' comp. Shared: FICA at 7.65% each side (6.2% Social Security + 1.45% Medicare)." },
  { id: "n79", cat: "Employment", q: "The FICA tax rate paid by the employer (matching the employee) is:", opts: ["5.2%", "6.2%", "7.65%", "15.3%"], ans: 2, why: "7.65% each — 6.2% Social Security + 1.45% Medicare. The full 15.3% only applies to self-employed people paying both halves." },
  { id: "n80", cat: "Employment", q: "An installer works a 13-hour day. Hours 12 to 13 are paid at:", opts: ["Straight time", "Time and a half", "Double time", "Comp time"], ans: 2, why: "California daily OT: 1.5× after 8 hours (and over 40/week, and first 8 on a 7th straight day); 2× after 12 hours in a day (and after 8 on that 7th day)." },
  { id: "n81", cat: "Ins & Liens", q: "Under current law, which licensed contractors must carry workers' compensation coverage?", opts: ["Only those with 5+ employees", "Only roofers", "ALL active licensees, even with zero employees", "Only primes on public works"], ans: 2, why: "As of January 1, 2026, the no-employee exemption is gone — every active licensee needs workers' comp or an approved self-insurance certificate. This affects YOUR application, so verify before you file." },
  { id: "n82", cat: "Employment", q: "FUTA (federal unemployment) tax must be deposited quarterly when the quarter's liability exceeds:", opts: ["$100", "$500", "$1,000", "$7,000"], ans: 1, why: "Over $500 in a quarter → deposit quarterly. $500 or less can ride along and be paid with the annual return." },
  { id: "n83", cat: "Employment", q: "Regular employees must be paid at least:", opts: ["Weekly", "Twice per calendar month", "Monthly", "Whenever cash flow allows"], ans: 1, why: "At least twice a month on designated paydays. (Final paychecks have their own faster rules — immediately if fired.)" },
  { id: "n84", cat: "Employment", q: "Hiring a 17-year-old helper who is still in school generally requires:", opts: ["Nothing special", "A work permit, with limits on hours and hazardous tasks", "Parental signature only", "A CSLB waiver"], ans: 1, why: "Minors need work permits, have capped hours on school days, and are barred from hazardous work like operating power equipment. Violations: $1,000/$2,000/$5,000." },
  { id: "n85", cat: "Employment", q: "Cal/OSHA must investigate a SERIOUS workplace complaint within:", opts: ["24 hours", "3 working days", "14 days", "30 days"], ans: 1, why: "Serious complaints: 3 working days. Non-serious: 14 days. Employers appeal citations within 15 working days." },
  { id: "n86", cat: "Safety", q: "Inside the 24-inch 'tolerance zone' around a marked underground gas line you must:", opts: ["Use a mini-excavator slowly", "Use hand tools until the line is exposed", "Pour a concrete cap", "Notify the fire department"], ans: 1, why: "Hand-dig within 24 inches on EACH side of the mark until the utility is exposed and protected. Yellow = gas, red = electric, blue = water, green = sewer, orange = communications; white marks YOUR dig area." },
  { id: "n87", cat: "Safety", q: "Utility marking colors: YELLOW paint on the ground means:", opts: ["Water", "Gas or oil", "Electric", "Communications"], ans: 1, why: "Yellow = gas/oil/petroleum. Red = electric, blue = water, green = sewer, orange = communications/TV, white = your proposed excavation." },
  { id: "n88", cat: "Safety", q: "Your crew unearths human remains while trenching for a gate footing. You must:", opts: ["Rebury and continue", "Move them aside carefully", "Stop work immediately and notify the County Coroner", "Call the CSLB"], ans: 2, why: "Stop immediately; the Coroner has 2 working days to examine. If the remains are Native American, the Coroner alerts the Native American Heritage Commission within 24 hours." },
  // ===== BUSINESS & MONEY =====
  { id: "n89", cat: "Licensing", q: "Every business entity holding a contractor's license — sole owner, partnership, corporation, or LLC — must have:", opts: ["At least two owners", "A qualifying individual (QI)", "A payroll service", "An attorney on retainer"], ans: 1, why: "No license exists without a qualifier — the person whose experience and exam back the license (sole owner, RMO, or RME)." },
  { id: "n90", cat: "Licensing", q: "The biggest legal drawback of operating as a sole proprietorship is:", opts: ["Double taxation", "Unlimited personal liability", "Annual franchise fees", "Required board meetings"], ans: 1, why: "Business debts and judgments reach your PERSONAL assets — house, truck, savings. Simplest structure, least protection. Corporations/LLCs create a liability shield (that's what you pay for)." },
  { id: "n91", cat: "Licensing", q: "The president of a licensed corporation dies. The corporate license:", opts: ["Is void immediately", "Continues — the corporation is a separate legal entity", "Transfers to the family", "Converts to sole ownership"], ans: 1, why: "A corporation exists independently of its people, so the entity and its license continue (replace the qualifier within 90 days if needed). A SOLE OWNER's license generally cancels at death, subject to a 90-day continuance." },
  { id: "n92", cat: "Licensing", q: "Which entity's profits are taxed TWICE — once at the company level and again as shareholder dividends?", opts: ["Sole proprietorship", "Partnership", "C corporation", "S corporation"], ans: 2, why: "C corps face double taxation. Sole props, partnerships, S corps and most LLCs 'pass through' — profits are taxed once, on the owners' returns." },
  { id: "n93", cat: "Finances", q: "The basic accounting equation is:", opts: ["Assets = Revenue − Expenses", "Assets = Liabilities + Owner's Equity", "Profit = Assets − Liabilities", "Equity = Assets + Liabilities"], ans: 1, why: "Assets = Liabilities + Owner's Equity. It's the skeleton of every balance sheet: what you HAVE equals what you OWE plus what you OWN." },
  { id: "n94", cat: "Finances", q: "Under ACCRUAL accounting, income is recorded when:", opts: ["Cash hits the bank", "It is EARNED, even if not yet collected", "Taxes are filed", "The job is bid"], ans: 1, why: "Accrual = record when earned/incurred; cash = record when money moves. Accrual gives contractors a truer picture because of receivables and retention." },
  { id: "n95", cat: "Finances", q: "Current assets $50,000, current liabilities $25,000. Current ratio?", opts: ["0.5 to 1", "1 to 1", "2 to 1", "4 to 1"], ans: 2, why: "50,000 ÷ 25,000 = 2:1 — the classic healthy benchmark. At 1:1 you can barely cover short-term bills; below it you're in trouble." },
  { id: "n96", cat: "Finances", q: "Gross profit equals:", opts: ["Revenue minus ALL expenses", "Revenue minus direct job costs", "Revenue minus taxes", "Cash on hand"], ans: 1, why: "Gross = revenue − direct costs (labor, materials, equipment, subs). NET profit further subtracts overhead. Bidding off gross profit while forgetting overhead is how contractors go broke." },
  { id: "n97", cat: "Contracts", q: "The three parties to a surety bond are:", opts: ["Buyer, seller, broker", "Principal, obligee, surety", "Owner, lender, insurer", "Contractor, sub, supplier"], ans: 1, why: "Principal = you (the contractor). Obligee = who's protected (owner/state). Surety = the bonding company. Key: a bond is NOT insurance — if the surety pays a claim, it collects the money back from YOU." },
  { id: "n98", cat: "Contracts", q: "Which bond guarantees that subs and suppliers on a project get paid?", opts: ["Bid bond", "Performance bond", "Payment bond", "License bond"], ans: 2, why: "Payment bond = payment to subs/suppliers. Performance bond = job gets completed per contract. Bid bond = you'll sign the contract if awarded." },
  { id: "n99", cat: "Finances", q: "In an estimate, which of these is OVERHEAD rather than a direct cost?", opts: ["Springs and track for the job", "Installer wages on the job", "Office rent and bookkeeping", "The subcontracted concrete pad"], ans: 2, why: "Direct costs trace to one job (labor, materials, equipment, subs). Overhead — rent, office staff, insurance, advertising — spreads across ALL jobs. Price = direct + share of overhead + profit." },
  { id: "n100", cat: "Finances", q: "Job costs are $8,000 and you want a 20% MARGIN on the selling price. You should bid:", opts: ["$9,600", "$10,000", "$8,800", "$12,000"], ans: 1, why: "Margin is a % of PRICE: price = cost ÷ (1 − 0.20) = $10,000. A 20% MARKUP (a % of COST) would only be $9,600. Mixing these up quietly shrinks your profit on every job." },
  { id: "n101", cat: "Finances", q: "The main purpose of JOB COSTING is to:", opts: ["Satisfy the IRS", "Compare actual costs to your estimate so future bids improve", "Calculate sales tax", "Impress lenders"], ans: 1, why: "Track real labor/material/equipment costs per job against the bid. It catches losing jobs early and makes every future estimate sharper." },
  // ===== NEW: FINANCES =====
  { id: "f1", cat: "Finances", q: "What determines how often an employer's payroll tax deposits are made to the IRS?", opts: ["The number of employees", "The amount of payroll liability", "How long the company has existed", "The ratio of salaried to hourly workers"], ans: 1, why: "Deposit frequency is set by how much payroll TAX you owe (the lookback period) — bigger liability, more frequent deposits. This exact question appears in the official candidate bulletin's samples." },
  { id: "f2", cat: "Finances", q: "A construction company buys a car for general use by the sales staff. Its depreciation is charged to:", opts: ["Direct job costs", "General and administrative (overhead) costs", "Project management expenses", "Company profits"], ans: 1, why: "The car isn't tied to any one job, so it's OVERHEAD (G&A) — spread across all jobs. Also straight from the bulletin's sample questions. If it were a job-site-only machine, it could be a direct cost." },
  { id: "f3", cat: "Finances", q: "Working capital equals:", opts: ["Total assets minus total debt", "Current assets minus current liabilities", "Cash in the bank", "Revenue minus overhead"], ans: 1, why: "Working capital = current assets − current liabilities: the cushion you have to pay near-term bills. Related: current RATIO divides the same two numbers." },
  { id: "f4", cat: "Finances", q: "'Retention' (retainage) on a construction contract is:", opts: ["A tax withheld by the state", "A percentage of each payment held back until the job is done right", "The contractor's profit margin", "A late-payment penalty"], ans: 1, why: "Typically 5–10% withheld from each progress payment as the owner's insurance that the work gets finished and corrected. Plan cash flow around not seeing that money until after completion." },
  { id: "f5", cat: "Finances", q: "Which financial statement shows income and expenses over a PERIOD of time?", opts: ["Balance sheet", "Income (profit & loss) statement", "Lien release", "Depreciation schedule"], ans: 1, why: "Income/P&L statement = a movie (a period). Balance sheet = a snapshot (one date) showing assets, liabilities, and equity." },
  { id: "f6", cat: "Finances", q: "The most common financial reason construction companies fail is:", opts: ["Paying too much in taxes", "Poor cash management and underbidding", "Buying too much equipment", "High insurance premiums"], ans: 1, why: "Running out of CASH — from underbidding, ignoring overhead, and slow receivables — kills more contractors than anything else. Profit on paper doesn't pay Friday's payroll." },
  // ===== NEW: EMPLOYMENT =====
  { id: "e1", cat: "Employment", q: "You pay an UNLICENSED worker to help install doors and call him a subcontractor. Legally he is:", opts: ["An independent contractor", "Your employee — with payroll taxes, workers' comp, and wage rules applying", "A joint venturer", "A day laborer with no status"], ans: 1, why: "An unlicensed 'sub' is your EMPLOYEE by law. That means withholding, workers' comp, overtime — all of it. Only a validly licensed contractor can be a true subcontractor." },
  { id: "e2", cat: "Employment", q: "California sexual harassment prevention training is required for employers with:", opts: ["50+ employees only", "5 or more employees — 2 hrs for supervisors, 1 hr for others, every 2 years", "Union shops only", "It's optional"], ans: 1, why: "5+ employees triggers it: 2 hours for supervisors, 1 hour for everyone else, repeated every two years (and within 6 months of hire/promotion)." },
  { id: "e3", cat: "Employment", q: "With every paycheck, California employers must provide:", opts: ["Nothing extra", "An itemized wage statement (hours, rates, deductions, dates)", "A copy of the timecard only", "A benefits summary"], ans: 1, why: "Itemized pay stubs are mandatory — gross wages, hours, rates, all deductions, pay period dates, employer name/address. Missing stubs carry per-employee penalties." },
  { id: "e4", cat: "Employment", q: "Required state and federal labor law notices (minimum wage, safety, workers' comp, etc.) must be:", opts: ["Kept in the office file", "Posted where employees can see them", "Mailed to each employee annually", "Available on request only"], ans: 1, why: "Posting requirements are real: workplace posters where workers can read them — including the workers' comp 'notice to employees' and Cal/OSHA posters at the jobsite." },
  // ===== NEW: INS & LIENS =====
  { id: "i1", cat: "Ins & Liens", q: "Which license entity is REQUIRED by law to carry general liability insurance?", opts: ["Sole ownerships", "Partnerships", "LLCs — at least $1 million", "All contractors"], ans: 2, why: "Only LLCs must carry liability insurance by law: $1 million minimum (scaling up to $5 million with more members/employees). For everyone else it's smart but optional." },
  { id: "i2", cat: "Ins & Liens", q: "Workers' compensation is called the 'exclusive remedy' because:", opts: ["Only one insurer can sell it", "An injured employee gets comp benefits instead of suing the employer, regardless of fault", "It excludes part-time workers", "It only covers exclusive contracts"], ans: 1, why: "No-fault trade-off: the worker gets medical care and wage benefits without proving fault, and in exchange generally cannot sue the employer for the injury." },
  { id: "i3", cat: "Ins & Liens", q: "The difference between a CONDITIONAL and UNCONDITIONAL lien waiver:", opts: ["Conditional waivers are illegal", "A conditional waiver only takes effect once the payment actually clears; unconditional is effective immediately when signed", "Unconditional waivers need notarization", "There is no difference"], ans: 1, why: "Never sign an UNCONDITIONAL waiver before the check clears — you'd be giving up lien rights for money you might never receive. Conditional = 'effective IF paid.'" },
  // ===== NEW: CONTRACTS =====
  { id: "c1", cat: "Contracts", q: "Mid-job, the homeowner asks you to add a side gate. The safest way to handle it is:", opts: ["A handshake and do the work", "A written, signed change order stating the work and new price", "Add it to the final invoice", "A text message is enough"], ans: 1, why: "Change orders IN WRITING, signed before the extra work starts. With a 'complete agreement' clause, verbal extras may be unenforceable — you could do the work and never get paid for it." },
  { id: "c2", cat: "Contracts", q: "On a private job, the owner must release RETENTION to the prime within ___ of completion, and the prime must pay subs their share within ___ of receiving it.", opts: ["10 days / 5 days", "45 days / 10 days", "90 days / 30 days", "30 days / 30 days"], ans: 1, why: "45 days owner→prime, then 10 days prime→subs. Wrongful withholding: 2%-per-month penalty plus attorney's fees." },
  { id: "c3", cat: "Contracts", q: "A prime is late paying a sub's progress payment with no good-faith dispute. The penalty is:", opts: ["Nothing — it's a private matter", "2% per month on the amount due, plus attorney's fees", "A flat $100", "License revocation automatically"], ans: 1, why: "2% per month plus attorney's fees to the prevailing party — and willful violation is also a disciplinable offense. Pay your subs within 7 days of receiving each progress payment." },
  // ===== NEW: PUBLIC WORKS =====
  { id: "p1", cat: "Public Works", q: "Workers on California public works projects must be paid:", opts: ["Federal minimum wage", "The prevailing wage rate set by the Director of Industrial Relations (DIR)", "Whatever the bid assumed", "Union scale only if unionized"], ans: 1, why: "Prevailing wage — per-craft rates published by the DIR — applies to public works over $1,000. Bid using the DIR's published rates or your labor number will sink you." },
  { id: "p2", cat: "Public Works", q: "To bid or work on public works projects, a contractor must first:", opts: ["Post a $100,000 cash deposit", "Register with the DIR (annual public works registration)", "Get a federal license", "Join a union"], ans: 1, why: "Annual DIR registration is required BEFORE bidding or performing public work — separate from your CSLB license. Unregistered contractors can be kicked off jobs and fined." },
  { id: "p3", cat: "Public Works", q: "On public works, certified payroll records (CPRs) must be:", opts: ["Kept privately for 1 year", "Submitted to the Labor Commissioner (electronically), showing each worker's hours and wages", "Given only to the surety", "Optional under $100,000"], ans: 1, why: "CPRs prove prevailing wage compliance and go to the Labor Commissioner's eCPR system. Falsifying them is a crime, not just a violation." },
  { id: "p4", cat: "Public Works", q: "On public works contracts of $30,000 or more, contractors generally must:", opts: ["Hire only journeymen", "Employ registered apprentices at a ratio of at least 1 apprentice hour per 5 journeyman hours", "Pay double time on Fridays", "Subcontract 50% of the work"], ans: 1, why: "The 1:5 apprentice-to-journeyman hour ratio (per craft) applies at $30,000+. Request dispatch from an approved apprenticeship program and keep proof." },
  { id: "p5", cat: "Public Works", q: "Prevailing wage requirements generally apply to public works projects over:", opts: ["$500", "$1,000", "$25,000", "$100,000"], ans: 1, why: "Prevailing wage applies to public works over $1,000 — that's the number to remember. (Separate thresholds you'll also see: payment bonds over $25,000, and apprentice ratios at $30,000.)" },
  // ===== NEW: SAFETY =====
  { id: "s1", cat: "Safety", q: "EVERY California employer must have which written safety document?", opts: ["An OSHA 300 log only", "An Injury and Illness Prevention Program (IIPP)", "A union safety agreement", "A first-aid certificate"], ans: 1, why: "The IIPP is mandatory for every employer: named responsible person, hazard identification, correction procedures, training, and communication. It's Cal/OSHA's most-cited violation." },
  { id: "s2", cat: "Safety", q: "Construction employers must also adopt and post at the jobsite a:", opts: ["Profit-sharing plan", "Code of Safe Practices", "Blueprint set", "Diversity statement"], ans: 1, why: "The Code of Safe Practices — general and job-specific safety rules — must be posted at each jobsite office or readily available, and it feeds your 10-working-day tailgate meetings." },
  { id: "s3", cat: "Safety", q: "A Cal/OSHA permit is required before workers enter an excavation or trench that is:", opts: ["Any depth", "3 feet or deeper", "5 feet or deeper", "10 feet or deeper"], ans: 2, why: "5 feet or deeper (that a person enters) requires a Cal/OSHA permit — plus shoring/sloping protection. Same permit rule applies to buildings 3+ stories. Trench collapses kill fast; this is heavily tested." },
  { id: "s4", cat: "Safety", q: "Under California's heat illness rules, outdoor workers must have shade available when the temperature exceeds:", opts: ["70°F", "80°F", "90°F", "100°F"], ans: 1, why: "Shade at 80°F+, fresh water (a quart per hour) at ALL times, cool-down rest breaks on request, and high-heat procedures at 95°F. Summer install jobs make this real for garage door crews." },
  { id: "s5", cat: "Safety", q: "Safety Data Sheets (SDS) for hazardous products used on the job must be:", opts: ["Locked in the office safe", "Readily accessible to employees during their shifts", "Filed with the CSLB", "Memorized by the foreman"], ans: 1, why: "Hazard Communication: label containers, train workers, and keep SDSs where crews can actually reach them — lubricants, solvents, and paints on a door job all count." },

  /* ============ MATH / CALCULATION QUESTIONS ============
     The real exam gives you an on-screen calculator. These are the
     computation types that show up. Work the steps, don't eyeball it. */
  { id: "m1", cat: "Contracts", q: "A home improvement contract totals $8,000. The maximum legal down payment is:", opts: ["$800", "$1,000", "$1,600", "$2,000"], ans: 0, why: "The rule applies to EVERY home improvement contract: the LESSER of $1,000 or 10%. Here 10% of $8,000 = $800, which is less than $1,000, so $800 is the cap. Below a $10,000 contract the 10% figure is always the smaller one." },
  { id: "m2", cat: "Contracts", q: "A home improvement contract totals $20,000. The maximum legal down payment is:", opts: ["$1,000", "$2,000", "$2,500", "$5,000"], ans: 0, why: "The rule applies to EVERY home improvement contract: the LESSER of $1,000 or 10%. Here 10% = $2,000, so the $1,000 figure is smaller and becomes the cap. $10,000 is just the crossover point — below it the 10% figure is smaller, above it the flat $1,000 is." },
  { id: "m3", cat: "Contracts", q: "You're 60% complete on a $40,000 contract. The most you may have collected in progress payments so far is:", opts: ["$20,000", "$24,000", "$28,000", "$40,000"], ans: 1, why: "Payments can't exceed the value of work performed plus materials delivered. 60% × $40,000 = $24,000. Getting ahead of the work is a violation, even if the customer offers." },
  { id: "m4", cat: "Contracts", q: "An owner holds 10% retention on a $50,000 contract. The amount withheld is:", opts: ["$500", "$2,500", "$5,000", "$10,000"], ans: 2, why: "10% × $50,000 = $5,000, held until the job is accepted. Plan cash flow around not seeing that money until 45 days after completion (then 10 days to pass shares to subs)." },
  { id: "m5", cat: "Employment", q: "An installer earns $28/hour and works 10 hours in one day. His gross pay for that day is:", opts: ["$280", "$294", "$308", "$420"], ans: 2, why: "First 8 hrs at straight time: 8 × $28 = $224. Hours 9–10 at 1.5×: 2 × $42 = $84. Total $308. California pays daily OT after 8 — not just weekly after 40." },
  { id: "m6", cat: "Employment", q: "A worker earning $30/hour puts in 13 hours in one day. Gross pay for that day:", opts: ["$390", "$450", "$480", "$585"], ans: 2, why: "Hrs 1–8 straight: 8 × $30 = $240. Hrs 9–12 at 1.5× ($45): 4 × $45 = $180. Hr 13 at 2× ($60) = $60. Total $480. Remember: 1.5× after 8, 2× after 12." },
  { id: "m7", cat: "Employment", q: "An employee's gross pay is $2,000. The FICA amount withheld from HIS check is:", opts: ["$124", "$153", "$290", "$306"], ans: 1, why: "FICA = 7.65% (6.2% Social Security + 1.45% Medicare). $2,000 × .0765 = $153. The employer matches another $153, so $306 total goes to the government." },
  { id: "m8", cat: "Finances", q: "Your direct job costs are $12,000 and you apply a 25% MARKUP. Your price is:", opts: ["$15,000", "$16,000", "$14,400", "$9,000"], ans: 0, why: "Markup is a percentage OF COST: $12,000 × 1.25 = $15,000. Your actual margin on that price is only 20% ($3,000 ÷ $15,000) — markup always sounds bigger than it is." },
  { id: "m9", cat: "Finances", q: "Your direct job costs are $12,000 and you want a 25% MARGIN. Your price is:", opts: ["$15,000", "$16,000", "$14,400", "$18,000"], ans: 1, why: "Margin is a percentage OF PRICE: price = cost ÷ (1 − margin) = $12,000 ÷ 0.75 = $16,000. Same 25%, $1,000 more in your pocket. This markup/margin trap is the most common bidding mistake in construction." },
  { id: "m10", cat: "Finances", q: "Current assets are $90,000 and current liabilities are $60,000. The current ratio is:", opts: ["0.67 to 1", "1.5 to 1", "2 to 1", "3 to 1"], ans: 1, why: "$90,000 ÷ $60,000 = 1.5:1. Below the healthy 2:1 benchmark but still solvent. Under 1:1 means you can't cover short-term debts with short-term assets." },
  { id: "m11", cat: "Finances", q: "Current assets are $90,000 and current liabilities are $60,000. Working capital is:", opts: ["$30,000", "$60,000", "$90,000", "$150,000"], ans: 0, why: "Working capital = current assets − current liabilities = $30,000. That's the cash cushion for payroll and materials. RATIO divides those numbers; WORKING CAPITAL subtracts them." },
  { id: "m12", cat: "Finances", q: "Revenue $80,000, direct job costs $50,000, overhead $20,000. Your GROSS profit is:", opts: ["$10,000", "$20,000", "$30,000", "$60,000"], ans: 2, why: "Gross profit = revenue − DIRECT costs = $80,000 − $50,000 = $30,000. Overhead is not subtracted yet — that step gives you NET profit." },
  { id: "m13", cat: "Finances", q: "Revenue $80,000, direct job costs $50,000, overhead $20,000. Your NET profit is:", opts: ["$10,000", "$20,000", "$30,000", "$50,000"], ans: 0, why: "Net = revenue − direct − overhead = $10,000. Contractors who bid off the $30,000 gross number and forget the $20,000 of overhead think they made three times what they actually made." },
  { id: "m14", cat: "Finances", q: "You buy a $35,000 truck with a 5-year life and $5,000 salvage value. Annual straight-line depreciation is:", opts: ["$5,000", "$6,000", "$7,000", "$8,000"], ans: 1, why: "(Cost − salvage) ÷ life = ($35,000 − $5,000) ÷ 5 = $6,000/year. Straight-line spreads it evenly; don't forget to subtract salvage first." },
  { id: "m15", cat: "Finances", q: "Direct costs are $20,000. You add 15% for overhead, then 10% profit on the total. Your bid is:", opts: ["$23,000", "$25,300", "$25,000", "$24,500"], ans: 1, why: "Overhead: $20,000 × .15 = $3,000 → subtotal $23,000. Profit: $23,000 × .10 = $2,300. Bid = $25,300. Always layer overhead FIRST, then profit on the total." },
  { id: "m16", cat: "Finances", q: "Your monthly overhead is $8,000 and your gross margin is 25%. Monthly revenue needed to break even:", opts: ["$10,000", "$24,000", "$32,000", "$40,000"], ans: 2, why: "Break-even = overhead ÷ gross margin = $8,000 ÷ 0.25 = $32,000. Every dollar of revenue only contributes 25 cents toward overhead, so you need four times the overhead in sales." },
  { id: "m17", cat: "Finances", q: "You pay an installer $25/hour and your labor burden (taxes, comp, benefits) runs 30%. Your true hourly cost is:", opts: ["$27.50", "$30.00", "$32.50", "$35.00"], ans: 2, why: "$25 × 1.30 = $32.50. Bidding at the raw wage instead of the burdened rate silently eats your profit on every single hour worked." },
  { id: "m18", cat: "Finances", q: "You bid a job at $60,000 and your direct costs came in at $52,000. Your gross profit percentage is:", opts: ["8%", "13.3%", "15.4%", "18%"], ans: 1, why: "Gross profit $8,000 ÷ revenue $60,000 = 13.3%. Note it's divided by the SELLING PRICE. Dividing by cost ($8,000 ÷ $52,000 = 15.4%) gives you markup, not margin." },

  /* ============ MORE CONTRACTS ============ */
  { id: "c4", cat: "Contracts", q: "Every home improvement contract must include approximate:", opts: ["Weather contingencies", "Start and completion dates", "Subcontractor names", "Material brand names"], ans: 1, why: "Approximate start and completion dates are required content — along with the contractor's name/address/license number, total price, payment schedule, and the required notices." },
  { id: "c5", cat: "Contracts", q: "The 3-day 'Notice of Cancellation' must be given to the buyer:", opts: ["Verbally at signing", "In duplicate, attached to the contract", "Within 10 days of signing", "Only if requested"], ans: 1, why: "Two copies of the cancellation notice go to the buyer with the contract. If you don't provide it, the buyer's cancellation clock never starts — they can cancel much later." },
  { id: "c6", cat: "Contracts", q: "The statute of limitations to sue on a WRITTEN contract in California is:", opts: ["1 year", "2 years", "4 years", "10 years"], ans: 2, why: "Written contracts: 4 years. ORAL contracts: only 2 years. Another reason to get everything in writing — you double your time to collect." },
  { id: "c7", cat: "Contracts", q: "A contractor submits a bid and the owner accepts it before it's withdrawn. Legally:", opts: ["Nothing binding happens yet", "A contract is formed — the bid was an offer and acceptance completed it", "Only a letter of intent exists", "The contractor may re-price freely"], ans: 1, why: "Bid = offer. Acceptance = contract (assuming consideration, capacity, legal purpose). That's why a bidding mistake is so costly — withdraw a bad bid BEFORE it's accepted." },
  { id: "c8", cat: "Contracts", q: "A 'liquidated damages' clause in a construction contract:", opts: ["Is always unenforceable", "Sets an agreed dollar amount per day of unexcused delay", "Waives the owner's right to sue", "Applies only to public works"], ans: 1, why: "It pre-sets damages (e.g., $500/day late) so nobody has to prove actual loss. It must be a reasonable estimate — a penalty designed to punish rather than compensate can be struck down." },
  { id: "c9", cat: "Contracts", q: "Which is the LEAST reliable way to protect yourself on extra work?", opts: ["A signed written change order", "An email confirmation the owner replies to", "A verbal agreement at the jobsite", "A revised contract addendum"], ans: 2, why: "Verbal agreements on extras are how contractors go unpaid — especially with an integration clause in the contract. Written change order, signed, BEFORE the work starts." },

  /* ============ MORE EMPLOYMENT ============ */
  { id: "e5", cat: "Employment", q: "An employee working an 8-hour shift is entitled to an unpaid meal period of:", opts: ["15 minutes after 3 hours", "30 minutes after 5 hours", "60 minutes after 6 hours", "No meal period is required"], ans: 1, why: "A 30-minute unpaid meal period once the shift passes 5 hours (a second one after 10 hours). Miss it and you owe an extra hour of pay as a premium." },
  { id: "e6", cat: "Employment", q: "Paid rest breaks must be provided at the rate of:", opts: ["10 minutes per 4 hours worked", "5 minutes per hour", "15 minutes per 8 hours", "Only at the employer's discretion"], ans: 0, why: "10 minutes PAID per 4 hours worked (or major fraction). Meal periods are 30 minutes and UNPAID — the exam likes to swap those two." },
  { id: "e7", cat: "Employment", q: "An employer who willfully fails to pay a terminated employee's final wages faces a waiting time penalty of:", opts: ["$100 flat", "Up to 30 days of that employee's wages", "Triple damages", "License revocation"], ans: 1, why: "Up to 30 days of daily wages just for being late. On a $200/day installer that's $6,000 — for a paycheck you already owed. Pay fired employees IMMEDIATELY." },
  { id: "e8", cat: "Employment", q: "Under California's ABC test, a worker is presumed to be an EMPLOYEE unless the hiring business proves all three of:", opts: ["The worker has a business card, tools, and a truck", "Freedom from control, work outside the usual course of business, and an independently established trade", "The worker signs a waiver, is paid by check, and files a 1099", "The worker is over 18, insured, and part-time"], ans: 1, why: "The ABC test is strict — all three prongs, or they're an employee. Prong B is the killer: an installer doing door installs for a door company is inside your usual course of business." },
  { id: "e9", cat: "Employment", q: "The purpose of Form W-4 is to:", opts: ["Report a new hire to the EDD", "Tell the employer how much income tax to withhold", "Verify work authorization", "Report annual wages to the employee"], ans: 1, why: "W-4 = withholding instructions from the employee. I-9 = work authorization (3 business days). DE 34 = new hire report to EDD (20 days). W-2 = year-end wage statement." },

  /* ============ MORE LICENSING ============ */
  { id: "l1", cat: "Licensing", q: "The three license classifications issued by CSLB are:", opts: ["Residential, commercial, industrial", "A (General Engineering), B (General Building), and C (Specialty)", "Master, journeyman, apprentice", "Prime, sub, supplier"], ans: 1, why: "Class 'A' General Engineering, Class 'B' General Building, and 'C' Specialty classifications (including C-61 Limited Specialty, where your D-28 lives)." },
  { id: "l2", cat: "Licensing", q: "A 'B' General Building contractor may take a project only if it involves:", opts: ["Any single trade", "At least two unrelated trades", "Only framing", "A permit over $50,000"], ans: 1, why: "Two or more UNRELATED trades — otherwise the job belongs to the appropriate C specialty contractor. A 'B' can't take a doors-only job that a D-28 should do." },
  { id: "l3", cat: "Licensing", q: "Your license number must appear:", opts: ["Only on contracts", "In ALL advertising, on contracts, bids, and proposals", "Only on vehicles", "Only when the customer asks"], ans: 1, why: "Business cards, websites, truck lettering, flyers, bids, contracts — everywhere you solicit work. Advertising without it is a citable violation." },
  { id: "l4", cat: "Licensing", q: "California requires licensed contractors to complete continuing education for renewal:", opts: ["8 hours annually", "16 hours every 2 years", "No continuing education is required", "Only for A and B classes"], ans: 2, why: "CSLB requires NO continuing education — unlike many states. Renewal means paying the fee and keeping your bond and workers' comp current." },
  { id: "l5", cat: "Licensing", q: "All license applicants must submit to:", opts: ["A credit check", "Fingerprinting and a criminal background check", "A physical exam", "An IRS audit"], ans: 1, why: "Fingerprints go through DOJ and FBI. A conviction substantially related to contracting can mean denial — disclose honestly, since concealment is worse than the conviction." },
  { id: "l6", cat: "Licensing", q: "Work involving more than 100 square feet of asbestos-containing material requires:", opts: ["Nothing special", "Asbestos certification and Cal/OSHA registration", "Only a dust mask", "A B license"], ans: 1, why: "Over 100 sq ft triggers asbestos certification (an exam with CSLB) plus Cal/OSHA registration. Older garage door jobs can disturb asbestos siding or drywall — know when to stop and call a certified abatement contractor." },

  /* ============ MORE INSURANCE & LIENS ============ */
  { id: "i4", cat: "Ins & Liens", q: "There are four statutory lien waiver forms. They are divided by:", opts: ["Residential vs commercial", "Conditional vs unconditional, and progress vs final payment", "Prime vs subcontractor", "Public vs private", ], ans: 1, why: "Conditional/Unconditional × Progress/Final = four forms. Use CONDITIONAL until the check clears, then unconditional. Signing the wrong one gives away rights for money you haven't got." },
  { id: "i5", cat: "Ins & Liens", q: "General liability insurance primarily covers:", opts: ["Your employees' work injuries", "Third-party bodily injury and property damage you cause", "Your own tools being stolen", "Your vehicles"], ans: 1, why: "GL = damage you do to OTHERS (a door falls on the customer's car). Workers' comp = your EMPLOYEES' injuries. Inland marine/tool floater = your tools. Commercial auto = your vehicles." },
  { id: "i6", cat: "Ins & Liens", q: "An 'experience modification rate' (EMR) of 1.25 on your workers' comp policy means:", opts: ["You get a 25% discount", "You pay 25% more than average due to claims history", "You have 25 employees", "Your policy expires in 25 months"], ans: 1, why: "1.0 is average. Above 1.0 = worse-than-average claims and higher premiums; below 1.0 earns a discount. A good safety program pays you back directly here." },
  { id: "i7", cat: "Ins & Liens", q: "A general contractor asks to be named 'additional insured' on your policy. This means:", opts: ["They pay your premium", "Your policy also protects them for liability arising from your work", "You get access to their coverage", "Nothing legally"], ans: 1, why: "Standard on commercial jobs — your GL extends to cover the GC for claims arising from YOUR work. Expect to provide a certificate of insurance proving it before you start." },

  /* ============ MORE PUBLIC WORKS ============ */
  { id: "p6", cat: "Public Works", q: "A bid bond on a public works project typically guarantees:", opts: ["That subs get paid", "That the winning bidder will sign the contract and provide required bonds", "That the job finishes on time", "The owner's financing"], ans: 1, why: "Usually 10% of the bid. If you win and walk away, the surety pays the difference to the next bidder — and then comes after you." },
  { id: "p7", cat: "Public Works", q: "A performance bond on public works generally guarantees completion in the amount of:", opts: ["10% of the contract", "50% of the contract", "100% of the contract", "$25,000 flat"], ans: 2, why: "100% of the contract price — the surety finishes the job if you can't. Payment bonds (subs and suppliers) are also typically 100% and required over $25,000." },
  { id: "p8", cat: "Public Works", q: "On public works, overtime is generally owed after how many hours per day?", opts: ["6", "8", "10", "12"], ans: 1, why: "8 hours a day / 40 a week on public works, at the prevailing OT rate. Prevailing wage isn't just the base rate — it includes fringe benefits and the correct OT multipliers." },

  /* ============ MORE SAFETY ============ */
  { id: "s6", cat: "Safety", q: "In California construction, fall protection is generally required when working at heights of:", opts: ["4 feet", "6 feet", "7.5 feet", "15 feet"], ans: 2, why: "7.5 feet in California construction (federal OSHA says 6). Guardrails, personal fall arrest, or safety nets — relevant any time you're on a ladder or lift setting a high door or opener." },
  { id: "s7", cat: "Safety", q: "Before servicing a garage door opener, the correct safety procedure is to:", opts: ["Work quickly", "Lock out and tag out the power source", "Tell a coworker", "Wear gloves only"], ans: 1, why: "Lockout/tagout: de-energize, lock the disconnect, tag it with your name. An opener that cycles while your hands are in the mechanism causes amputations. This applies directly to your trade." },
  { id: "s8", cat: "Safety", q: "The Cal/OSHA Form 300 is:", opts: ["A permit application", "The log of work-related injuries and illnesses", "A prevailing wage report", "A workers' comp claim form"], ans: 1, why: "The injury/illness log. Post the 300A summary February 1 – April 30 each year, and keep the records for 5 years." },
  { id: "s9", cat: "Safety", q: "A 'competent person' on a jobsite is someone who:", opts: ["Has 10 years of experience", "Can identify hazards AND has authority to correct them immediately", "Holds a contractor's license", "Passed a written safety test"], ans: 1, why: "Both halves matter: recognition of hazards PLUS authority to fix them on the spot. Required for trenching, scaffolding, and fall protection oversight." },
  { id: "s10", cat: "Safety", q: "Employers must report a serious injury to Cal/OSHA immediately by:", opts: ["Mailing Form 300", "Phone or the online reporting portal", "Telling the workers' comp carrier only", "Posting a notice on site"], ans: 1, why: "Immediate report by phone or Cal/OSHA's online system for any serious injury, illness, or death — 'immediately' means as soon as practically possible, not end of shift. Failure to report carries its own penalty." },
];
