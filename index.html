/* Plain-English definitions. Written to be understood cold, with no other
   legal knowledge assumed. Longer terms are listed first so "mechanics lien"
   matches before "lien". */
const GLOSSARY = [
  // --- liens & property ---
  {t:"mechanics lien", d:"A legal claim you file against someone's PROPERTY when they don't pay you. It sticks to the house or building. The owner usually can't sell or refinance until it's paid off."},
  {t:"stop payment notice", d:"A demand that freezes the MONEY still sitting with the owner or the bank, instead of going after the property. This is what you use on government jobs, where you can't lien the property."},
  {t:"preliminary notice", d:"A letter you send at the START of a job telling the owner and lender you're working there. It's not a complaint. But if you skip it, you lose the right to file a lien later."},
  {t:"notice of completion", d:"A paper the OWNER files with the county saying the job is finished. Filing it shortens how long everyone has to file a lien."},
  {t:"notice of cessation", d:"A paper the owner files when work has STOPPED for 30 days straight. Same effect as a notice of completion: it starts the lien clock."},
  {t:"notice of non-responsibility", d:"A sign the owner posts and records saying 'I didn't order this work, don't lien me.' Used when a tenant hires a contractor without the owner's OK."},
  {t:"foreclose", d:"To force the sale of the property to collect what you're owed. Filing a lien is step one; foreclosing is actually going to court to make them sell it."},
  {t:"lis pendens", d:"Latin for 'lawsuit pending.' A notice you record at the county so anyone looking at the property can see there's a court case over it."},
  {t:"lien waiver", d:"A form you sign giving up your lien rights, usually in exchange for payment. CONDITIONAL means 'only if the check actually clears.' UNCONDITIONAL means 'I give up my rights right now.' Never sign unconditional before the money is in the bank."},
  {t:"real property", d:"Land and anything permanently attached to it — the dirt, the house, the garage. As opposed to things you can pick up and carry away."},

  // --- contracts ---
  {t:"mutual assent", d:"Both sides agreed to the same deal. One side offered, the other accepted. Also called 'a meeting of the minds.'"},
  {t:"consideration", d:"Each side gives up something of value. You give labor and materials; they give money. A promise with nothing given in return isn't a contract."},
  {t:"capacity", d:"Being legally allowed to sign a contract — an adult, of sound mind, not intoxicated. A contract signed by a child generally can't be enforced against them."},
  {t:"void", d:"The contract NEVER legally existed. Nobody can enforce it. Example: a contract for illegal work, or one signed by an unlicensed contractor."},
  {t:"voidable", d:"The contract is real, but the person who got wronged (through fraud, threats, or a serious mistake) can cancel it if they want to. Their choice."},
  {t:"duress", d:"Being forced or threatened into signing. A contract signed under duress can be cancelled by the person who was threatened."},
  {t:"integration clause", d:"A line in the contract saying 'this document is the whole deal.' Anything you promised out loud but didn't write down doesn't count anymore."},
  {t:"complete agreement", d:"Same as an integration clause — the written contract is the entire agreement, and verbal side-promises don't count."},
  {t:"change order", d:"A written add-on to the contract when the customer wants something extra or different. Get it signed BEFORE you do the extra work, or you may never get paid for it."},
  {t:"liquidated damages", d:"A dollar amount agreed to IN ADVANCE that you owe for each day you're late. Saves everyone from arguing later about what the delay actually cost."},
  {t:"home solicitation", d:"A sale where YOU came to THEM — knocked on the door, cold-called, or met at a home show. These give the buyer extra cancellation rights because they didn't go looking for you."},
  {t:"service and repair contract", d:"A small job ($750 or less) where the CUSTOMER called you, and it's normally done in one visit. It has its own simpler set of rules."},
  {t:"progress payment", d:"A partial payment made as the work moves along, instead of one lump sum at the end."},
  {t:"retention", d:"Money the owner holds back from each payment — usually 5-10% — until the whole job is done and accepted. Also called retainage. Budget for not seeing it for a while."},
  {t:"statute of limitations", d:"The deadline for filing a lawsuit. Miss it and you lose the right to sue at all, even if you were completely in the right."},
  {t:"substantial compliance", d:"A narrow legal excuse where a contractor whose license had a technical problem may still be allowed to collect payment. Hard to win — don't plan around it."},

  // --- licensing ---
  {t:"Registrar", d:"The person who runs the day-to-day operations of the CSLB — issues licenses, investigates complaints, and disciplines contractors. The Board sets policy; the Registrar enforces it."},
  {t:"qualifying individual", d:"The person whose experience and exam scores the license is built on. Every license needs one. Could be you as the owner, or an employee/officer who qualifies on the company's behalf."},
  {t:"RMO", d:"Responsible Managing Officer — an officer of a corporation who serves as the license's qualifying individual."},
  {t:"RME", d:"Responsible Managing Employee — an employee (not an owner) who qualifies the license. Must actually work there at least 32 hours a week or 80% of business hours."},
  {t:"disassociation", d:"When the qualifying individual leaves the business. You have 90 days to notify the CSLB and name a replacement, or the license gets suspended."},
  {t:"joint venture", d:"Two or more licensed companies teaming up to bid one project together, under a shared license."},
  {t:"reciprocity", d:"A licensing arrangement that may allow a trade-examination waiver for an eligible contractor and classification. It does not automatically grant a California license. Check CSLB’s current program and requirements; an old list of states may be outdated."},
  {t:"citation", d:"An official written violation from the CSLB with a fine attached. Not a criminal charge, but you must pay it or appeal within 15 working days."},
  {t:"delinquency fee", d:"The late penalty for renewing your license after it expired — 50% of the renewal fee on top of the renewal itself."},
  {t:"diversion of funds", d:"Taking money a customer paid for THEIR job and spending it on something else. Over $2,350 this is a felony."},
  {t:"patent defect", d:"A problem you can SEE — obvious on inspection. Cracked stucco, a crooked door. Complaint window: 4 years."},
  {t:"latent defect", d:"A HIDDEN problem, usually structural, that shows up later. Bad framing behind a wall. Complaint window: 10 years, because nobody could have spotted it."},

  // --- bonds & insurance ---
  {t:"surety", d:"The bonding company that guarantees you'll do what you promised. Important: if they pay out a claim, they come after YOU for the money. A bond is a guarantee, not insurance."},
  {t:"principal", d:"On a bond, that's you — the contractor whose performance is being guaranteed."},
  {t:"obligee", d:"On a bond, the party being protected — usually the property owner or the State of California."},
  {t:"bid bond", d:"Guarantees that if you win the bid, you'll actually sign the contract. Usually about 10% of your bid."},
  {t:"performance bond", d:"Guarantees the job gets finished per the contract. If you can't finish, the bonding company pays to have it completed."},
  {t:"payment bond", d:"Guarantees your subs and material suppliers get paid. Required on public jobs over $25,000."},
  {t:"disciplinary bond", d:"An extra, larger bond the CSLB makes you post to get your license back after discipline. Can run up to 10 times the normal bond."},
  {t:"additional insured", d:"When a general contractor asks to be added to YOUR insurance policy, so your coverage also protects them for problems caused by your work."},
  {t:"exclusive remedy", d:"The trade-off in workers' comp: an injured employee gets medical care and wage benefits automatically without proving anyone was at fault, and in exchange they generally can't sue you over the injury."},
  {t:"experience modification rate", d:"A number that adjusts your workers' comp premium based on your claims history. 1.0 is average. Above 1.0 you pay more; below 1.0 you get a discount."},
  {t:"general liability", d:"Insurance for damage YOU cause to other people or their property — a door falls on a customer's car. Different from workers' comp, which covers your own employees' injuries."},

  // --- money & accounting ---
  {t:"assets", d:"Everything the business owns that has value — cash, trucks, tools, money customers owe you."},
  {t:"liabilities", d:"Everything the business owes — loans, unpaid bills, taxes due."},
  {t:"owner's equity", d:"What's actually yours after debts are subtracted. Assets minus liabilities."},
  {t:"current assets", d:"Assets you could turn into cash within a year — cash on hand, money customers owe you, materials in the shop."},
  {t:"current liabilities", d:"Bills coming due within a year — this month's payroll, the credit card, the next loan payment."},
  {t:"working capital", d:"Current assets MINUS current liabilities. The cushion of money you have to cover near-term bills."},
  {t:"current ratio", d:"Current assets DIVIDED BY current liabilities. 2 to 1 is considered healthy. Below 1 to 1 means you can't cover your short-term bills."},
  {t:"direct costs", d:"Costs you can point at one specific job — the springs, the track, the installer's hours on that job."},
  {t:"overhead", d:"Costs of being in business that aren't tied to any one job — rent, phone, insurance, advertising, the bookkeeper. Spread across all your jobs."},
  {t:"gross profit", d:"Revenue minus DIRECT costs only. It looks bigger than your real profit because overhead hasn't been subtracted yet."},
  {t:"net profit", d:"What's actually left after subtracting BOTH direct costs and overhead. This is the real number."},
  {t:"markup", d:"A percentage added on top of your COST. Cost $100 plus 25% markup = $125 price."},
  {t:"margin", d:"Profit measured as a percentage of the PRICE. That same $125 price with $100 cost is only a 20% margin. Markup and margin are different numbers — this trips up a lot of contractors."},
  {t:"labor burden", d:"The real cost of an employee beyond their wage — payroll taxes, workers' comp, benefits. Often adds 25-35% on top of the hourly rate."},
  {t:"break-even", d:"The amount of revenue you need just to cover costs — no profit, no loss."},
  {t:"job costing", d:"Tracking what a job ACTUALLY cost versus what you estimated, so your next bid is more accurate."},
  {t:"depreciation", d:"Spreading the cost of something expensive and long-lasting, like a truck, across the years you'll use it, instead of counting it all in one year."},
  {t:"salvage value", d:"What you expect the truck or equipment to still be worth at the end of its useful life."},
  {t:"accrual", d:"An accounting method where you record income when you EARN it and expenses when you INCUR them, even if no money has moved yet."},
  {t:"cash basis", d:"An accounting method where you only record things when money actually changes hands."},
  {t:"double taxation", d:"When a C corporation pays tax on its profits, and then shareholders pay tax AGAIN on the dividends they receive from those same profits."},

  // --- employment & payroll ---
  {t:"FICA", d:"Social Security and Medicare tax. 7.65% comes out of the employee's check and the employer pays a matching 7.65%."},
  {t:"FUTA", d:"Federal unemployment tax. Paid by the EMPLOYER only — never withheld from the worker."},
  {t:"SUI", d:"State Unemployment Insurance. Employer pays this one too."},
  {t:"SDI", d:"State Disability Insurance. Withheld from the EMPLOYEE's paycheck."},
  {t:"PIT", d:"Personal Income Tax withheld from the employee's paycheck and sent to the state."},
  {t:"I-9", d:"The federal form proving a new hire is legally allowed to work in the U.S. Employer's part must be done within 3 business days of their start."},
  {t:"W-4", d:"The form where the employee tells you how much income tax to withhold from their pay."},
  {t:"ABC test", d:"California's strict three-part test for whether someone is truly an independent contractor. You must pass all three parts or they're legally your employee, with all the taxes and comp that come with it."},
  {t:"waiting time penalty", d:"A penalty of up to 30 days of that worker's wages for being late with a final paycheck. Expensive — pay fired employees immediately."},
  {t:"prevailing wage", d:"The minimum hourly rate (plus benefits) set by the state for each trade on government jobs. Higher than normal market rates. Applies to public works over $1,000."},
  {t:"certified payroll", d:"Payroll records you must submit on government jobs proving you paid everyone the correct prevailing wage."},

  // --- safety ---
  {t:"IIPP", d:"Injury and Illness Prevention Program — the written safety plan every California employer must have. Names who's in charge of safety, how hazards get spotted and fixed, and how workers are trained."},
  {t:"Code of Safe Practices", d:"A written list of safety rules for your type of work, posted or kept available at the jobsite."},
  {t:"tailgate meeting", d:"A short safety talk with the crew at the jobsite. Required at least every 10 working days. Also called a toolbox talk."},
  {t:"competent person", d:"Someone who can both SPOT a hazard and has the AUTHORITY to fix it on the spot. Both halves are required."},
  {t:"lockout tagout", d:"Shutting off the power to equipment, locking the switch so it can't be turned back on, and tagging it with your name — before you put your hands in the machinery."},
  {t:"tolerance zone", d:"The 24 inches on each side of a marked underground utility line. Inside that zone you dig by hand only, until you can see the pipe or cable."},
  {t:"SDS", d:"Safety Data Sheet — the document explaining the hazards of a chemical product and what to do if someone is exposed. Must be where workers can actually get to it."},
  {t:"Cal/OSHA", d:"California's workplace safety agency. Sets the safety rules, inspects jobsites, and issues citations."},

  // --- general legal ---
  {t:"misdemeanor", d:"A less serious crime. Typically punishable by a fine and up to a year in county jail."},
  {t:"felony", d:"A serious crime, with bigger fines and the possibility of prison rather than county jail."},
  {t:"civil penalty", d:"A fine, not a criminal charge. No jail, no criminal record — but you still have to pay."},
  {t:"arbitration", d:"Settling a dispute in front of a neutral decision-maker instead of going to court. Faster and cheaper than a lawsuit."},
  {t:"prime contractor", d:"The contractor who signed the contract directly with the property owner. Everyone else on the job works under them as subcontractors. WATCH OUT: the law now officially calls this a DIRECT CONTRACTOR, and older books say ORIGINAL CONTRACTOR. Three names, one job."},
  {t:"direct contractor", d:"The current legal term for the contractor who has the contract directly with the owner. Same thing older materials call the PRIME contractor or ORIGINAL contractor. On liens, this is the one who gets 60 days when a notice of completion was filed."},
  {t:"public works", d:"Construction paid for with government money — schools, roads, city buildings. Comes with extra rules: prevailing wage, certified payroll, DIR registration."},
  {t:"DIR", d:"California's Department of Industrial Relations. Sets prevailing wage rates and requires contractors to register before doing public works."},
  {t:"Notice of Cancellation", d:"The form you must hand the buyer WITH the contract, in TWO copies, spelling out their right to cancel within 3 business days (5 if they are 65 or older). Leave it out and the buyer's cancellation clock never starts, so they can cancel much later."},
  {t:"Mechanics Lien Warning", d:"A warning that must appear in every home improvement contract. It tells the owner that if you or your suppliers go unpaid, a lien can be put on their home EVEN IF the owner already paid you in full. Skipping it is grounds for discipline."},
  {t:"Agreement to Arbitrate", d:"The form the CSLB mails to both sides when a complaint is headed to arbitration. Send it back within 30 days so a hearing can be scheduled."},
  {t:"CSLB", d:"Contractors State License Board. The California agency that issues contractor licenses, investigates complaints, and disciplines contractors. Its number one job is protecting the public."},
  {t:"the Board", d:"Another way of saying the CSLB. Fifteen members: 8 from the public, 5 contractors, 1 local building official, 1 labor representative. The Board sets policy; the Registrar carries it out."},
  {t:"EDD", d:"Employment Development Department. California's payroll tax and unemployment agency. Every new hire must be reported to them within 20 days."},
  {t:"HIC", d:"Home Improvement Contract. Must be in writing for any home improvement job over $500, and must contain specific notices like the Mechanics Lien Warning."},
  {t:"LLC", d:"Limited Liability Company. A business structure that keeps business debts away from your personal assets. Contractor LLCs in California need an extra $100,000 worker bond and at least $1 million in liability insurance, and must use an attorney in civil court."},
  {t:"IRS", d:"Internal Revenue Service, the federal tax agency. Your payroll tax deposits go to them, and how OFTEN you deposit depends on how much you owe."},
  {t:"Labor Commissioner", d:"The California official who enforces wage laws and collects certified payroll records on public works jobs."},
  {t:"Limited Specialty", d:"The C-61 license class. It covers trades that do not fit the other categories and is split into 'D' subcategories. Yours is D-28, doors and gates."},
  {t:"General Building", d:"The Class 'B' license. A 'B' can only take a project that involves at least TWO unrelated trades, otherwise the job belongs to the matching specialty contractor."},
  {t:"General Engineering", d:"The Class 'A' license. Covers fixed works like roads, bridges, pipelines, and other heavy engineering projects."},
  {t:"Underground Service Alert", d:"The free 811 service you call before digging. They send utilities out to paint-mark their buried lines. Call at least 2 working days ahead, and no more than 14 calendar days."},
  {t:"fraud", d:"Lying on purpose to get money or an advantage. On this exam, the word 'fraud' in a question almost always signals CRIMINAL penalties and possible jail, not just a fine."},
  {t:"sole proprietorship", d:"A business owned by one person with no legal wall between the business and the owner. Cheapest and simplest to set up, but business debts can reach your personal house, truck, and savings."},
  {t:"subcontractor", d:"A contractor hired by the prime (direct) contractor rather than by the owner. They must hold a valid license. If they do not, the law treats them as YOUR employee, with payroll taxes and workers' comp owed."},
  {t:"journeyman", d:"A fully trained, experienced worker in a trade. On public works, apprentice hours are measured against journeyman hours at roughly 1 apprentice hour per 5 journeyman hours."},
  {t:"apprentice", d:"A worker enrolled in a state-approved training program who learns the trade while getting paid. Required on public works contracts of $30,000 or more."},
  {t:"Social Security", d:"The federal retirement program funded by payroll tax. It is the 6.2% half of FICA; Medicare is the other 1.45%."},
  {t:"ETT", d:"Employment Training Tax. A small California payroll tax paid by the EMPLOYER, never withheld from the worker."},
  {t:"good faith", d:"Acting honestly and fairly, without trying to cheat anyone. A 'good faith dispute' means you genuinely believe you owe less, which is different from just refusing to pay."},
  {t:"willful", d:"On purpose, knowing what you were doing. Willful violations carry much bigger penalties than careless or accidental ones."},
  {t:"negligent", d:"Careless. You did not mean to cause harm, but you failed to take reasonable care. Penalties are lower than for willful violations."},
];

'integration clause':['Words saying the written contract is the final agreement. Earlier spoken promises usually cannot contradict it, but exceptions exist.','Put a promised extra service into the written contract.'],
'complete agreement':['The final agreement between the parties, usually written in the contract.','The contract lists the price, door model, work and schedule the parties agreed on.'],
'change order':['A written change to the agreed work, price or schedule.','The customer adds a side gate, so you write and sign the change before starting it.'],
'liquidated damages':['An amount agreed in advance for a stated contract failure. The amount still has to meet the legal rules.','A commercial contract sets an amount per day for an unexcused delay.'],
'home solicitation':['A sale made away from the seller’s usual business location, such as at a customer’s home. Special cancellation rules may apply.','You agree on a garage-door job at the homeowner’s kitchen table.'],
'service and repair contract':['A special kind of small repair agreement: $750 or less, with the customer contacting you and other required conditions met.','A customer calls about a small repair. You check the special rules before using this contract.'],
'progress payment':['A payment made as parts of a job are completed.','The customer pays an agreed amount after a listed stage of work is done.'],
'retention':['Money held back from a payment until the required release conditions are met. The allowed amount depends on the job and law.','On a covered $100,000 private contract with a 5% cap, total retention cannot exceed $5,000.'],
'statute of limitations':['The legal deadline for starting a lawsuit. Different claims can have different clocks.','A normal written-contract claim usually has a four-year period, subject to other rules.'],
'substantial compliance':['A narrow exception that may help a previously licensed contractor with certain license problems. It is not permission to work unlicensed.','A court checks whether the contractor meets every condition of this exception.'],
'Registrar':['The official who runs CSLB’s day-to-day licensing and enforcement work.','The Registrar handles the agency’s daily operations.'],
'qualifying individual':['The person who qualifies the business’s active license and provides the required supervision.','A qualified owner or employee may fill this role, depending on the business type.'],
'RMO':['Responsible Managing Officer: a company officer who serves as the license qualifier.','An officer of a corporation is its qualifying person.'],
'RME':['Responsible Managing Employee: a real employee who qualifies the license and does the required work and supervision.','The RME must actually work there—not just lend the business a name.'],
'disassociation':['When a person leaves their role with the licensed business. For a qualifier, that starts important notice and replacement deadlines.','Your qualifying employee quits, so you need to notify CSLB and arrange a replacement.'],
'joint venture':['Businesses teaming up under a joint venture arrangement. Contractor joint ventures need the required license.','Two licensed companies team up to bid a project together.'],
'reciprocity':['An agreement that may let an eligible out-of-state contractor skip California’s trade exam. It does not grant a license automatically.','A contractor applies for the available exam waiver and still meets California’s other rules.'],
'citation':['An official notice of a violation. It can include a fine and an order to fix the problem.','CSLB issues a citation, and you must respond within the applicable deadline.'],
'delinquency fee':['An extra charge for paying or renewing late.','The CSLB late-renewal fee is half of the renewal fee.'],
'diversion of funds':['Wrongfully using construction money for another purpose, with the other failures required by the law.','A contractor spends job money on a personal debt and deliberately fails to finish or pay for the job.'],
'patent defect':['A defect that is reasonably obvious, rather than hidden.','A visibly crooked installation is an example of an apparent problem.'],
'latent defect':['A hidden defect that was not reasonably obvious. The longer CSLB period applies to qualifying structural defects.','Bad structural support hidden inside a wall may not be visible at first.'],
'surety':['The company or person backing someone else’s promise or debt.','A bonding company backs a contractor’s stated obligations.'],
'principal':['On a bond, the party whose promise or duty is being backed.','For a contractor’s bond, the contractor is the principal.'],
'obligee':['On a bond, the party protected by the promise.','An owner can be the protected party on a contractor’s performance bond.'],
'bid bond':['A bond backing the bidder’s promise to follow through if awarded the job.','The winning bidder must sign the contract and provide required bonds.'],
'performance bond':['A bond backing the contractor’s promise to perform the contract.','If the contractor fails, the bond’s terms describe what the surety must do.'],
'payment bond':['A bond protecting payment to eligible subcontractors, workers or suppliers.','A supplier may have a claim when covered project materials are not paid for.'],
'disciplinary bond':['An extra bond required because of a contractor’s license discipline.','CSLB requires additional protection before allowing the contractor to operate again.'],
'additional insured':['Another person or company given some protection under your insurance policy. The policy or added coverage must actually include them.','A general contractor asks for coverage for certain claims arising from your work.'],
'exclusive remedy':['Usually the required way to seek recovery for a particular harm, instead of using another route. Exceptions can apply.','For a covered work injury, an employee usually uses workers’ comp instead of suing the employer.'],
'experience modification rate':['A factor that adjusts workers’ comp pricing based on claims experience compared with similar businesses.','A factor of 1.25 increases the amount it applies to by 25%; other pricing factors still matter.'],
'general liability':['Insurance for certain injuries to other people or damage to their property. What is covered depends on the policy.','Damage to a customer’s property may involve general liability coverage.'],
'assets':['Things the business has that carry value.','Cash, equipment and money customers owe the business are assets.'],
'liabilities':['Debts or other amounts the business owes.','An unpaid supplier bill is a liability.'],
"owner's equity":['The owner’s share after subtracting the business’s debts from its assets.','Assets of $100 minus debts of $60 leave $40 of equity.'],
'current assets':['Cash and other assets expected to turn into cash or be used up in the short term, usually within a year.','Cash and customer invoices due soon are common examples.'],
'current liabilities':['Bills and debts expected to be paid in the short term, usually within a year.','A supplier bill due next month is a current liability.'],
'working capital':['Current assets minus current liabilities. It is a measure of the short-term cushion, not just bank cash.','$90,000 − $60,000 = $30,000 working capital.'],
'current ratio':['Current assets divided by current liabilities. It compares short-term resources with short-term debts.','$90,000 ÷ $60,000 = 1.5 to 1.'],
'direct costs':['Costs you can connect to one specific job.','The door, track and installer hours for that installation are direct costs.'],
'overhead':['Costs of running the business that are not tied to just one job.','Office rent and bookkeeping are overhead.'],
'gross profit':['Sales money minus direct job costs, before overhead and other expenses.','A $3,000 sale minus $1,800 direct costs leaves $1,200 gross profit.'],
'net profit':['What remains after the expenses included in the calculation. A full business calculation includes more than just job costs.','In a simple example: $1,200 gross profit − $800 overhead = $400 net profit.'],
'markup':['An amount added as a percentage of cost.','$100 cost plus 25% markup gives a $125 price.'],
'margin':['Profit shown as a percentage of the selling price.','$25 profit on a $125 price is a 20% margin.'],
'labor burden':['Employer costs added on top of the worker’s wage.','Payroll taxes, workers’ comp and benefits add to the true labor cost.'],
'break-even':['The point where income covers the costs, with no profit or loss in the calculation.','You make enough from sales to cover the job costs and overhead.'],
'job costing':['Tracking what each job actually costs.','Compare the installer hours and materials used with your original estimate.'],
'depreciation':['Spreading an asset’s cost over time as it is used. Book and tax methods can differ.','Instead of treating a work truck as one year’s cost, a calculation spreads its cost over several years.'],
'salvage value':['The estimated value left at the end of an asset’s useful life.','You expect a truck to be worth $5,000 when you finish using it.'],
'accrual':['Accounting that normally records income when earned and costs when incurred, even before cash changes hands.','You finish the work and record income before the customer pays the invoice.'],
'cash basis':['Accounting that normally follows when money is received or paid.','You record the customer payment when you receive it.'],
'double taxation':['The same business profit facing tax at two levels.','A C corporation pays tax, then shareholders generally pay tax on dividends from that profit.'],
'FICA':['The payroll taxes for Social Security and Medicare. The usual combined rate is 7.65% per side, with wage-limit and extra-Medicare rules.','Below the limits, the employee pays 7.65% and the employer pays its share too.'],
'FUTA':['Federal unemployment tax, normally paid by the employer.','It helps fund unemployment benefits; it does not normally come out of the employee’s check.'],
'SUI':['State unemployment insurance, funded through employer contributions in California.','The business pays California unemployment contributions.'],
'SDI':['California State Disability Insurance, normally paid through employee wage deductions.','An SDI amount is withheld from the worker’s paycheck.'],
'PIT':['California personal income tax withheld from an employee’s wages.','The employer holds back the required amount and sends it to the state.'],
'I-9':['The form used to check a new employee’s identity and permission to work in the United States.','The employer checks the required documents and completes its section on time.'],
'W-4':['The employee’s form that helps set federal income-tax withholding.','The employer uses the completed W-4 when calculating payroll.'],
'ABC test':['A three-part test used in many worker-classification cases. All three parts must be met when this test applies.','Check control, whether the work is outside the hiring business, and the worker’s own independent trade.'],
'waiting time penalty':['Extra wages that may be owed for willfully paying final wages late, up to 30 days.','An employer deliberately holds back final pay and may owe more than the unpaid check.'],
'prevailing wage':['The required pay rate for the relevant trade and location on covered public jobs, including required benefits.','A city project uses the applicable DIR pay determination.'],
'certified payroll':['Pay records formally confirmed as accurate and reported as required.','Records show who worked, their trade, hours and pay on a public job.'],
'IIPP':['Injury and Illness Prevention Program: the employer’s plan and system for keeping work safe.','It explains who handles safety, how hazards are fixed and how workers are trained.'],
'Code of Safe Practices':['Written safety rules for the employer’s kind of work.','The rules explain safe practices the crew should follow on the job.'],
'tailgate meeting':['A short crew safety talk, also called a toolbox meeting.','Before work, the supervisor discusses ladder or trench hazards with the crew.'],
'competent person':['Someone who can identify hazards and has authority to get them corrected promptly.','The person can spot an unsafe condition and order the needed correction.'],
'lockout tagout':['The required steps to isolate dangerous energy and prevent unexpected machine startup during covered work.','Turning off an opener does not remove door weight or spring tension; stored energy must be controlled too.'],
'tolerance zone':['The utility’s width plus 24 inches on each side of its outside edges. Special digging precautions apply.','Measure from the pipe’s edges, not just a thin paint line at its center.'],
'SDS':['Safety Data Sheet: information about a chemical’s hazards, handling and emergency response.','The crew can check the SDS for a solvent being used at work.'],
'Cal/OSHA':['California’s workplace-safety program. It sets and enforces workplace safety requirements.','A serious work injury needs a report directly to Cal/OSHA.'],
'misdemeanor':['A category of crime that can carry a fine or county-jail time.','A first unlicensed-contracting conviction can be a misdemeanor.'],
'felony':['A more serious category of crime that can carry substantial punishment, including imprisonment.','Certain deliberate construction-fund misuse can create felony risk.'],
'civil penalty':['A fine under civil or administrative rules, rather than a criminal sentence.','A citation may require a civil payment even without a criminal conviction.'],
'arbitration':['Having a neutral person decide a dispute outside a normal court trial.','An arbitrator hears both sides of a construction-payment dispute.'],
'prime contractor':['The contractor with the direct contract with the owner. Often called the direct contractor.','The homeowner hires your company, and your company hires a concrete subcontractor.'],
'direct contractor':['The contractor hired directly by the property owner.','Your company signs the garage-door contract with the homeowner.'],
'public works':['Construction and related work covered by public-project laws, often paid with government funds.','Work on a city building can come with public-works pay and reporting rules.'],
'DIR':['California Department of Industrial Relations. It handles areas including workplace rules and public-works requirements.','DIR publishes prevailing-wage rates and handles required public-works registration.'],
'Notice of Cancellation':['The form telling the customer how to cancel the contract when a cancellation right applies.','For the separate-form rule in this question, give TWO copies with the contract, easy to remove.'],
'Mechanics Lien Warning':['A notice explaining that unpaid eligible workers, subs or suppliers may claim against the home.','The owner could face a lien even after paying the main contractor.'],
'Agreement to Arbitrate':['A form agreeing to use arbitration to decide the dispute.','Return CSLB’s mailed form within its 30-calendar-day deadline.'],
'CSLB':['Contractors State License Board: California’s contractor-licensing agency.','It issues licenses and handles contractor complaints and enforcement.'],
'the Board':['The Contractors State License Board, with 15 members and public protection as its main priority.','The Registrar runs the Board’s day-to-day work.'],
'EDD':['Employment Development Department: California’s agency for unemployment and several payroll-tax programs.','Report a new hire to EDD within 20 calendar days.'],
'HIC':['Home Improvement Contract: the agreement for work improving a home.','A normal home-improvement job over $500 needs a written contract under the applicable rules.'],
'LLC':['Limited Liability Company: a business legally separate from its owners. Personal-liability protection has exceptions.','A contractor LLC needs its special worker bond and liability insurance as well as other license requirements.'],
'IRS':['Internal Revenue Service: the federal tax agency.','Employers send required federal payroll-tax deposits to the IRS.'],
'Labor Commissioner':['The California official whose office enforces wage and labor requirements.','The office handles wage claims and required public-works payroll reports.'],
'Limited Specialty':['The C-61 license group for specified specialty work. It is divided into D categories.','D-28 covers doors, gates and their operating devices.'],
'General Building':['The B license classification. Its usual multiple-trade route needs two unrelated trades, with other allowed routes and exceptions.','Do not assume every one-trade job is automatically allowed or automatically forbidden for a B contractor.'],
'General Engineering':['The A license classification for certain large fixed works needing engineering knowledge.','Roads, bridges and pipelines are common examples.'],
'Underground Service Alert':['The 811 notification service used before digging so underground utilities can be identified.','Contact 811 before digging gate-post holes, then meet the required waiting and response rules.'],
'fraud':['Intentional deception that meets the applicable legal requirements.','A contractor knowingly lies to persuade a customer to sign.'],
'sole proprietorship':['A business owned by one person without a separate legal entity between owner and business.','Business debts can be the owner’s personal responsibility.'],
'subcontractor':['A contractor hired by another contractor to do part of the job. Proper licensing and worker-classification rules still apply.','Your company hires a licensed concrete contractor for the gate footing.'],
'journeyman':['A worker trained and experienced enough to perform the trade’s work competently.','Apprentice-hour rules compare apprentice hours with journeyman hours in the craft.'],
'apprentice':['A worker registered in an approved program to learn a trade while working.','A registered apprentice works under the program’s training and supervision rules.'],
'Social Security':['A federal benefit program funded in part by payroll taxes.','The normal Social Security payroll-tax rate is 6.2% per side up to the annual wage limit.'],
'ETT':['California Employment Training Tax, paid by the employer.','It is an employer cost, not an employee wage deduction.'],
'good faith':['Acting honestly rather than inventing a reason to avoid a duty.','A real disagreement about the amount owed is different from simply refusing to pay.'],
'willful':['Done on purpose, as defined by the particular rule. It is different from a simple accident.','An employer deliberately refuses to pay wages known to be due.'],
'negligent':['Failing to use the care that the situation reasonably requires.','A person overlooks a hazard they should reasonably have checked.']
