function lawRef(code,section){return ['California '+code+' § '+section,'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode='+code+'&sectionNum='+section];}
function dirRef(section){return ['Cal/OSHA § '+section,'https://www.dir.ca.gov/title8/'+section.replace('.','_')+'.html'];}
var PAY_REF=['California final-pay rules','https://www.dir.ca.gov/dlse/FAQ_Paydays.htm'];
var SHEET_HELP=[
 [
  ['Add labor and materials for the whole project. The minor-work exemption requires a total below $1,000, no required building permit, and no employees. A smaller job can still require a license.','A $700 job needing a permit is not exempt just because it is below $1,000.','Total + permit + employees. Check all three.',lawRef('BPC','7048')],
  ['A home improvement contract (HIC) over $500 must meet written-contract requirements. This is a different threshold from the license exemption. Special qualifying service-and-repair rules also exist.','A $900 home improvement is above the written-contract threshold.','$500 = writing, not licensing.',lawRef('BPC','7159')],
  ['This special service-and-repair contract is limited to $750. The customer must initiate the call, work must address that problem, and no payment is due until completion.','A homeowner calls for a $300 repair. It may qualify if all the conditions are met.','Small repair, customer calls, pay after.',lawRef('BPC','7159.10')],
  ['For the usual home improvement down-payment rule, calculate 10% of the contract and compare it with $1,000. Choose the smaller. Statutory bond exceptions exist.','On an $8,000 contract, 10% is $800, so the cap is $800.','Calculate both. Circle the smaller.',lawRef('BPC','7159')],
  ['The contractor license bond protects eligible claimants harmed by covered license-law violations. $25,000 is the bond amount, not the premium you pay to buy it.','An active contractor maintains the required $25,000 bond even on small jobs.','Bond amount ≠ purchase price.',lawRef('BPC','7071.6')],
  ['An actively licensed LLC needs an additional $100,000 worker bond covering specified unpaid wages and benefits. It does not replace the ordinary contractor bond.','An LLC maintains both its contractor bond and its LLC worker bond.','LLC = extra worker protection.',lawRef('BPC','7071.6.5')],
  ['Willfully diverting construction funds with the statutory failure to finish work or pay can be criminal. At $2,350 or less it is a misdemeanor; above that, felony punishment is possible, not automatic.','Wrongfully diverting $3,000 can cross the higher-penalty threshold.','Above $2,350 = felony exposure.',lawRef('PEN','484b')],
  ['Under the unlicensed-activity citation section, the civil penalty maximum is $15,000. Do not confuse this with the separate $30,000 tier for specified license-law violations. Criminal penalties are separate.','A citation under §7028.7 is not the same penalty as a criminal conviction.','Read the section, not just the dollar figure.',lawRef('BPC','7028.7')],
  ['Individuals, including sole proprietors, generally may seek up to $12,500 in small claims. Corporations and other business entities generally have a $6,250 limit. Other restrictions apply.','A sole proprietor with an $11,000 claim is within the ordinary individual limit.','Individual 12,500; entity 6,250.',lawRef('CCP','116.221')],
  ['CSLB may refer eligible disputes to mandatory arbitration when the contract price or demand is within the contractor-bond amount, currently $25,000. Additional eligibility conditions apply.','A qualifying $20,000 demand may fit; the dollar amount alone does not guarantee admission.','Mandatory: within the bond limit.',lawRef('BPC','7085')],
  ['For eligible cases with material damages above $25,000 and below $50,000, both parties must agree to CSLB voluntary arbitration. The endpoints are not included in this range.','A qualifying $35,000 dispute needs both parties to agree.','Voluntary = both say yes.',lawRef('BPC','7085')],
  ['For covered public works contracts over $25,000, the direct contractor provides an approved payment bond before work. State-entity contracts have separate statutory provisions.','A covered $40,000 city project requires the bond before starting.','Payment bond protects payment to others.',lawRef('CIV','9550')]
 ],
 [
  ['After CSLB sends the notice requiring the initial license fee, the applicant generally has 90 days from that notice to pay. Required bond and issuance documents also have a notice-based deadline.','Passing the exam is not the same as already holding an active license.','Pass → notice → complete issuance.',lawRef('BPC','7074')],
  ['When a qualifying individual leaves, notify CSLB in writing within 90 days and replace the qualifier within 90 days of departure. Failure can suspend the license or remove the classification. Extensions require approval.','Your qualifier leaves June 1: count from departure, not from when you report it.','Two duties, one departure date.',lawRef('BPC','7068.2')],
  ['Notify CSLB in writing on its form within 90 days when recorded information such as business name, address, or personnel changes. Insurance coverage must separately remain compliant.','Moving the business means updating CSLB, not just forwarding mail.','Changed record? Tell the Registrar.',lawRef('BPC','7083')],
  ['An immediate family member may request continuance of an individual license after the holder dies. CSLB must receive the written request within 90 days. Approval and conditions are required.','A family member applies to finish existing projects; continuance is not automatic.','90 days to request, not permanent inheritance.',lawRef('BPC','7076')],
  ['On private work without a valid recorded completion or cessation notice, the ordinary lien-recording deadline is 90 days after project completion. This is not a universal rule for every stop-payment notice.','No completion notice does not mean unlimited time to record a lien.','No notice: completion starts the clock.',lawRef('CIV','8414')],
  ['Recording a lien and suing to enforce it are separate steps. Generally, file the enforcement action within 90 days after recording, or the lien expires. A statutory credit-extension exception exists.','Recording today starts a new enforcement deadline; it does not file a lawsuit.','Record first. Enforce separately.',lawRef('CIV','8460')],
  ['Report an unsatisfied final judgment imposed on the licensee to CSLB in writing within 90 days. Failure can trigger suspension. Payment, an accord, or an additional bond may be required.','An unpaid final judgment cannot simply wait until the next license renewal.','Unsatisfied = still unpaid.',lawRef('BPC','7071.17')]
 ],
 [
  ['A preliminary notice tells the required recipients that you are supplying work or materials and may claim payment rights. It is not a lien. Generally, serve within 20 days of first furnishing; a late notice protects only the preceding 20 days and later work.','First delivery starts your notice clock, even before the first invoice.','Preliminary = early heads-up.',lawRef('CIV','8204')],
  ['An owner may record a valid notice of completion on or within 15 days after completion. It can shorten lien-recording periods, subject to applicable notice requirements.','Finishing work and recording the owner’s completion notice are different events.','15 = owner’s recording window.',lawRef('CIV','8182')],
  ['Cessation means work has stopped. An owner may record this notice after at least 30 continuous days without labor, with the stoppage continuing through recording.','A weekend shutdown is not a 30-day continuous cessation.','Cessation = stopped continuously.',lawRef('CIV','8188')],
  ['A claimant other than the direct contractor generally records after it stops furnishing work and before the earlier of 90 days after project completion or 30 days after a valid completion/cessation notice is recorded.','A subcontractor does not get the prime contractor’s 60-day notice window.','Sub: 30 after notice; check earlier limit.',lawRef('CIV','8414')],
  ['A direct contractor generally records after completing its contract and before the earlier of 90 days after project completion or 60 days after a valid completion/cessation notice is recorded.','The prime contracts directly with the owner, so its notice window differs from a sub’s.','Prime: 60 after notice; check earlier limit.',lawRef('CIV','8412')],
  ['Without a valid completion or cessation notice, the usual private-work lien deadline is 90 days after project completion. Your own last work date and legal project completion are not necessarily the same.','A sub finishes early, but must distinguish its finish date from completion of the project.','90 from project completion, not the invoice.',lawRef('CIV','8414')],
  ['An owner who did not contract for the improvement may give a notice of nonresponsibility. To be effective, it must be both posted and recorded within 10 days after learning of the work. It is not a blanket escape from every lien.','A landlord learns of tenant-ordered work and promptly checks whether this protection applies.','Know → post AND record → 10 days.',lawRef('CIV','8444')]
 ],
 [
  ['Generally, a discharged employee must receive earned wages and accrued unused vacation immediately at termination. Narrow industry exceptions exist.','Do not ordinarily wait until Friday payroll for someone fired Tuesday.','Employer ends it → pay now.',PAY_REF],
  ['An employee without a definite-term written contract who quits with less than 72 hours’ notice generally receives final wages within 72 hours after quitting.','No advance notice means a 72-hour final-pay window, not three business days.','No notice → 72 hours.',PAY_REF],
  ['For an employee without a definite-term written contract, at least 72 hours’ advance notice generally makes final wages due when the employee quits as announced.','A worker gives sufficient notice and leaves on that date: pay at departure.','Notice already given → pay at exit.',PAY_REF],
  ['The employer completes Form I-9 Section 2 within three business days after the employee’s first day of paid work. For employment lasting less than three business days, complete it on day one.','For a Monday start, ordinarily finish Section 2 by Thursday.','I-9: employer checks work eligibility.', ['USCIS: completing Section 2','https://www.uscis.gov/i-9-central/completing-form-i-9/completing-section-2-employer-review-and-attestation']],
  ['Report a newly hired employee to California EDD within 20 calendar days of starting work. Rehires after at least 60 consecutive days of separation also count.','Put new-hire reporting on the checklist when the person starts, not after probation.','New hire → EDD → 20 calendar days.', ['EDD new-hire reporting','https://edd.ca.gov/en/payroll_taxes/new_hire_reporting/']],
  ['Construction supervisors hold toolbox or tailgate safety meetings with their crews at least every 10 working days. Discuss the hazards of the work.','A short crew discussion about today’s ladder risks is a tailgate meeting.','Crew talks: 10 working days.',dirRef('1509')],
  ['General construction rules require periodic supervisory safety meetings but do not specify a universal monthly interval. A separate tunnel-safety rule does require monthly supervisory meetings.','Do not apply a tunnel-specific monthly rule to every construction workplace.','General: periodic. Tunnel: monthly.',dirRef('1509')],
  ['Report qualifying serious work-related injury, illness, or death to Cal/OSHA immediately: as soon as practicable, generally no later than eight hours after the employer knows or should know. Limited exceptional circumstances allow 24 hours.','Notifying your insurer does not replace the immediate Cal/OSHA report.','Two reports; serious injury cannot wait.',dirRef('342')],
  ['Report a work injury or illness involving lost time beyond the injury date or treatment beyond first aid to the insurer within five days after knowledge. This is separate from immediate serious-incident reporting.','An injury causing a later missed shift may trigger the insurer report.','Insurer: five days; serious incident: immediate.',lawRef('LAB','6409.1')],
  ['Keep required Cal/OSHA injury logs and incident records for five years after the covered calendar year. Exposure and medical records are different: some require 30 years, or employment plus 30 years.','Do not discard asbestos-related medical records using the five-year injury-log rule.','Logs ≠ exposure/medical files.', ['Cal/OSHA record retention §14300.33','https://www.dir.ca.gov/t8/14300_33.html'],dirRef('3204')]
 ],
 [
  ['Generally, pass the required qualifying examinations within 18 months after CSLB accepts the application, or it becomes void. Do not count from your first test attempt.','An accepted application starts the window even if you schedule the exam later.','18 months starts at acceptance.',lawRef('BPC','7074')],
  ['A qualifying individual who passed the examination for the same classification within the preceding five years generally need not retake it for a new application. Other licensing requirements still apply.','An expired application and a reusable exam result are different things.','Score validity is not an active license.',lawRef('BPC','7065')],
  ['An active contractor license ordinarily renews every two years. Renew before expiry and keep the other active-license requirements satisfied.','A valid bond does not by itself renew an expired license.','Active = two.',lawRef('BPC','7140')],
  ['An inactive license has a four-year renewal period. Inactive status does not authorize contracting; reactivate before doing work requiring a license.','Keeping an inactive number is not permission to bid as an active contractor.','Inactive = four, no contracting.',lawRef('BPC','7076.5')],
  ['An expired license generally can be renewed within five years if the applicable requirements and fees are met. Do not assume late renewal authorizes work done while expired.','Three years expired may be within the renewal window, but it is not currently active.','Renewable ≠ usable today.',lawRef('BPC','7141')],
  ['Keep records of contractor transactions for at least five years after the project or operation is completed. Other legal or insurance reasons can require longer retention.','Save the contract, changes, invoices, and payment records together.','Completion starts the five-year minimum.',lawRef('BPC','7111')],
  ['A patent defect is reasonably apparent, such as visibly faulty work. The ordinary CSLB written-complaint period is four years after the alleged act or omission. This is not every civil lawsuit’s deadline.','An obviously crooked installation illustrates a readily observable problem.','Patent = apparent → four.',lawRef('BPC','7091')],
  ['A qualifying latent structural defect is hidden and involves specified structural failure or risk. CSLB’s complaint window can be ten years. Not every hidden cosmetic problem gets this period.','Concealed faulty support work is different from a hidden paint blemish.','Hidden + structural → check ten-year rule.',lawRef('BPC','7091')],
  ['A licensee or applicant generally has 15 working days after service of a citation to contest it. Without timely action, it can become final.','Read the service date immediately; do not wait for renewal paperwork.','Citation → 15 WORKING days.',lawRef('BPC','7099.3')],
  ['When CSLB sends an agreement to arbitrate under this procedure, return it within 30 calendar days from the date CSLB mails it.','The mailing date, not the day you finally open the envelope, starts this period.','Mailed agreement → 30 calendar days.',lawRef('BPC','7085.3')]
 ],
 [
  ['Markup is the added profit-and-overhead amount expressed as a fraction of cost. Convert the percentage to a decimal before multiplying.','Cost $100 with 20% markup: $100 × 1.20 = $120.','Markup builds UP from cost.'],
  ['Margin expresses profit as a fraction of the selling price, not cost. For a target margin below 100%, divide cost by one minus the decimal margin.','Cost $100 at 20% margin: $100 ÷ 0.80 = $125.','Margin lives in the selling price.'],
  ['Gross profit is sales revenue minus direct job costs, before subtracting overhead. It is not all available to spend.','Revenue $1,000 − direct costs $700 = gross profit $300.','Gross comes before overhead.'],
  ['In this simplified job model, net profit is gross profit minus overhead. A full business income statement may also include interest, taxes, and other items.','Gross $300 − overhead $200 = net $100.','Net is what remains after the next costs.'],
  ['The current ratio compares short-term assets with short-term obligations. Divide assets by liabilities; a zero denominator cannot produce an ordinary ratio.','Current assets $60,000 ÷ liabilities $30,000 = 2 to 1.','Ratio DIVIDES.'],
  ['Working capital is the dollar difference between current assets and current liabilities. It indicates a short-term financial cushion, not necessarily cash in the bank.','Assets $60,000 − liabilities $30,000 = $30,000 working capital.','Working capital SUBTRACTS.'],
  ['In this simplified model, each sales dollar contributes the gross-margin fraction toward fixed overhead. Divide overhead by that decimal fraction to find break-even sales.','Overhead $8,000 ÷ margin 0.25 = $32,000 sales.','Use 0.25, not 25.'],
  ['Straight-line depreciation spreads an asset’s depreciable cost evenly over its useful life. Salvage is the estimated value left at the end. Tax deductions may use different rules.','($12,000 cost − $2,000 salvage) ÷ 5 years = $2,000 per year.','Subtract what remains, then spread the rest.'],
  ['Labor burden adds employer costs beyond wages, such as payroll taxes, insurance, and benefits. Use the burden percentage supplied in the problem; it is not one universal legal rate.','$30 wage × 1.25 for 25% burden = $37.50 hourly labor cost.','Wage is only part of worker cost.'],
  ['For covered nonexempt employees under the ordinary California rule, hours over eight through twelve in a workday earn 1.5 times regular rate; hours over twelve earn double. Weekly and seventh-day rules and exceptions also matter.','A standard 13-hour day: 8 regular + 4 at 1.5× + 1 at 2×.','8 → time-and-a-half; 12 → double.', ['California overtime rules','https://www.dir.ca.gov/dlse/faq_overtime.htm']],
  ['The usual employee and employer FICA shares are each 6.2% Social Security plus 1.45% Medicare. Social Security has an annual wage cap; Additional Medicare withholding applies to some employee wages and is not employer-matched.','$100 of wages below the cap generally means $7.65 withheld and $7.65 employer share.','6.2 + 1.45 = 7.65.', ['IRS Social Security and Medicare rates','https://www.irs.gov/taxtopics/tc751']],
  ['Use the usual home improvement cap: compare $1,000 with 10% of the full contract and choose the smaller. Statutory bond exceptions exist.','A $20,000 contract: 10% is $2,000, so use the smaller $1,000.','Smaller wins.',lawRef('BPC','7159')]
 ],
 [
  ['Ordinarily notify 811 at least two working days before excavation, excluding the day of notification. Also wait for required operator responses and any required onsite meeting; a ticket alone is not clearance.','A Monday call does not count Monday as one of the two working days.','Notify, wait, confirm, dig safely.',lawRef('GOV','4216.2')],
  ['The ordinary advance-notice window is no more than 14 calendar days before starting. This is different from the ticket’s 28-day validity.','Do not use a notice filed months earlier as your start authorization.','14 = advance notice, not ticket life.',lawRef('GOV','4216.2')],
  ['A ticket is valid for 28 days from issuance. Renew by the end of day 28 if work continues. If it expires, stop excavation and follow the new-ticket requirements.','A long project needs ticket renewal, not just the original ticket number.','28 = ticket life.',lawRef('GOV','4216.2')],
  ['The approximate-location zone includes the facility width plus 24 inches on each side of its outside edges. Determine its exact location safely with hand tools or an allowed alternative before powered excavation as required.','A wide pipe needs its width plus the allowance on both sides, not 24 inches from its center.','Edges, not centerline.',lawRef('GOV','4216')],
  ['White markings identify the proposed excavation area. They show where you intend to dig, not where an existing utility has been located.','Outline your planned trench in white before requesting utility marks.','White = where I plan to work.', ['USA North 811 color-code guidance','https://usanorth811.org/']],
  ['Utility colors identify types of underground lines: red electric, yellow gas/oil/steam, blue potable water, and green sewer/drain. They are location warnings, not safe digging depths.','Blue marks suggest water infrastructure; still confirm the location before digging.','Red power, yellow fuel, blue water, green drain.', ['USA North 811 color-code guidance','https://usanorth811.org/']],
  ['Ordinary civil penalty ceilings are $10,000 for negligence and $50,000 for knowing/willful violations. Certain willful pipeline damage releasing hazardous contents can reach $100,000. Other liability can apply too.','Do not treat $50,000 as the absolute maximum for every underground-utility incident.','Careless 10; willful 50; special release 100.',lawRef('GOV','4216.6')],
  ['Stop excavation and disturbance around discovered human remains and notify the county coroner. Do not move the remains yourself. Further requirements apply if they are Native American remains.','Finding suspected remains means stopping, not moving them aside to finish the trench.','Stop. Protect the area. Coroner.',lawRef('HSC','7050.5')]
 ]

reviseQuestion('n13',{q:'CSLB’s reciprocity program may help an eligible out-of-state contractor obtain:',opts:['An automatic California license','A trade-examination waiver for an eligible classification','Permission to skip all California licensing rules','A license with no application'],why:'Reciprocity is a possible trade-exam waiver, not automatic licensure. The current CSLB page lists Arizona, Louisiana, Mississippi, Nevada, and North Carolina, with classification and experience requirements. Check CSLB’s current list rather than memorizing an old three-state list.'},[['CSLB reciprocity requirements','https://www.cslb.ca.gov/Contractors/Applicants/Reciprocity/Reciprocity_Requirements.aspx']]);
reviseQuestion('n15',{why:'No more than three firms in a one-year period. Additional firms must meet one of the statutory connections: common ownership of at least 20%, a qualifying subsidiary/joint venture relationship, or specified overlapping management. Personal 20% ownership is not the only route.'},[lawRef('BPC','7068.1')]);
reviseQuestion('n19',{opts:['They never collect a deposit','The project is below $1,000, needs no permit or employees, and the ad states they are unlicensed','The work is residential','They subcontract everything'],why:'The minor-work exemption now uses less than $1,000 for the entire project, requires no building permit and no employees, and cannot be used to split a larger job. Advertising must disclose unlicensed status; being below the dollar amount alone is not enough.'},[lawRef('BPC','7048')]);
reviseQuestion('n40',{why:'Crew toolbox/tailgate meetings must occur at least every 10 working days. General construction supervisory safety meetings are periodic, not universally monthly; monthly is a separate tunnel-safety requirement.'});
reviseQuestion('n41',{why:SHEET_HELP[3][7][0]});
reviseQuestion('n42',{q:'After learning of a work injury requiring treatment beyond first aid or lost time beyond the injury date, the employer must report it to the insurer within:',why:SHEET_HELP[3][8][0]});
reviseQuestion('n43',{why:'Ordinarily give at least two working days’ notice, excluding the notification date, and no more than 14 calendar days in advance. Required operator responses and onsite meetings must also be complete. Do not assume a Thursday call alone clears a Monday start.'});
reviseQuestion('n45',{q:'Under the asbestos standard, employee exposure-monitoring records generally must be retained for at least:',why:'Exposure-monitoring records generally remain for at least 30 years. Employee medical records generally remain for employment duration plus 30 years. Ordinary injury logs use a different five-year rule.'},[dirRef('1529'),dirRef('3204')]);
reviseQuestion('n48',{},[lawRef('BPC','7099.2'),lawRef('BPC','7028.7')]);
reviseQuestion('n50',{opts:['Fine if you sub it out','A misdemeanor advertising violation, with a $700–$1,000 statutory fine','Only a problem if someone hires you','Legal under $1,000'],why:'BPC 7027.1 prohibits advertising work outside the classification held, subject to its general-contractor provision. It specifies a $700–$1,000 fine in addition to other applicable punishment. The ad itself can violate the rule.'},[lawRef('BPC','7027.1')]);
reviseQuestion('n54',{q:'A knowing and willful 811-law violation, without the special hazardous-pipeline-release circumstances, carries a civil penalty ceiling of:',why:SHEET_HELP[6][6][0]});
reviseQuestion('n67',{q:'For an otherwise eligible CSLB mandatory-arbitration case, the relevant contract-price or demand threshold is:',why:SHEET_HELP[0][9][0]});
reviseQuestion('n79',{q:'For wages subject to both ordinary Social Security and Medicare taxes, before additional Medicare withholding, the usual employer FICA rate is:',why:SHEET_HELP[5][10][0]});
reviseQuestion('m7',{q:'An employee earns $2,000 of wages below the Social Security wage cap, with no Additional Medicare Tax due. Ordinary employee FICA withholding is:',why:'$2,000 × (6.2% Social Security + 1.45% Medicare) = $153. The employer generally matches this $153. Wage-cap and Additional Medicare rules can change other cases.'});
reviseQuestion('n80',{q:'A covered nonexempt installer works 13 hours under the ordinary California daily-overtime rule. The 13th hour is paid at:',why:'Hours over 12 in a workday are double time under the ordinary rule. Hours over eight through twelve are time-and-a-half. Alternative schedules and exemptions can change the analysis.'});
reviseQuestion('n81',{q:'In 2026, which statement about a no-employee contractor’s workers’ compensation requirement is correct?',opts:['Every active licensee is already required to have coverage with no exceptions','No licensed contractor needs coverage','A qualifying no-employee licensee may file an exemption, but specified classifications still require coverage','Only corporations need coverage'],why:'In 2026 a qualifying no-employee contractor may claim the statutory exemption, except C-8, C-20, C-22, C-39, and D-49 classifications. The broader coverage change is scheduled for January 1, 2028. A D-28 holder with employees needs coverage; do not confuse a future effective date with today’s rule.'},[lawRef('BPC','7125')]);
reviseQuestion('n86',{why:SHEET_HELP[6][3][0]});
reviseQuestion('l1',{q:'Which list includes CSLB’s general and specialty license categories, including residential remodeling?',opts:['Residential, commercial, industrial','A, B, B-2 Residential Remodeling, and C specialty classifications','Master, journeyman, apprentice','Prime, sub, supplier'],why:'A is General Engineering; B is General Building; B-2 is Residential Remodeling; C covers specialties, including C-61 Limited Specialty and D-28. B-2 is distinct and has its own scope limits.'},[lawRef('BPC','7055'),lawRef('BPC','7057.5')]);
reviseQuestion('l2',{q:'For the usual multi-trade B General Building route, excluding its framing/carpentry and other statutory exceptions, the project requires:',opts:['Any single trade','At least two unrelated trades other than framing or carpentry','Only painting','A permit over $50,000'],why:'BPC 7057 has important exceptions: B contractors may take framing/carpentry projects; qualifying prime contracts can also use an appropriate specialty classification or properly licensed subcontractor. A blanket statement that a B contractor can never take a single-trade prime contract is incorrect.'},[lawRef('BPC','7057')]);
reviseQuestion('e5',{opts:['15 minutes after 3 hours','At least 30 minutes beginning no later than the end of the fifth hour','60 minutes after 6 hours','No meal period is required'],why:'Under the ordinary rule, an eight-hour employee receives a duty-free meal period of at least 30 minutes beginning no later than the end of hour five. A second meal is ordinarily due by the end of hour ten when working more than ten hours; statutory exceptions and waivers can apply.'},[['California meal-period rules','https://www.dir.ca.gov/dlse/FAQ_MealPeriods.htm']]);
reviseQuestion('s6',{q:'For residential-type framing work on top plates, joists, rafters, or similar members covered by Cal/OSHA §1716.2, fall protection is required at:',opts:['4 feet','7.5 feet','6 feet or more','15 feet'],why:'The current residential-type framing rule uses 6 feet or more. Fall-protection requirements depend on the task and equipment; do not apply one blanket height to every ladder, roof, scaffold, or lift.'},[dirRef('1716.2')]);

/* Plain-English definitions. Written to be understood cold, with no other
   legal knowledge assumed. Longer terms are listed first so "mechanics lien"
   matches before "lien". */
const GLOSSARY = [
  // --- liens & property ---
  {t:"mechanics lien", d:"A legal claim you file against someone's PROPERTY when they don't pay you. It sticks to the house or building. The owner usually can't sell or refinance until it's paid off."},
  {t:"stop payment notice", d:"A demand that freezes the MONEY still sitting with the owner or the bank, instead of going after the property. This is what you use on government jobs, where you can't lien the property."},
  {t:"preliminary notice", d:"A letter you send at the START of a job telling the owner and lender you're working there. It's not a complaint. But if you skip it, you lose the right to file a lien later."},
  {t:"notice of completion", d:"A paper the OWNER files with the county saying the job is finished. Filing it shortens how long everyone has to file a lien."},
  {t:"notice of cessation", d:"A paper the owner files when work has STOPPED for 30 days straight. Same effect as a notice of completion: it starts the lien clock."},
  {t:"notice of non-responsibility", d:"A sign the owner posts and records saying 'I didn't order this work, don't lien me.' Used when a tenant hires a contractor without the owner's OK."},
  {t:"foreclose", d:"To force the sale of the property to collect what you're owed. Filing a lien is step one; foreclosing is actually going to court to make them sell it."},
  {t:"lis pendens", d:"Latin for 'lawsuit pending.' A notice you record at the county so anyone looking at the property can see there's a court case over it."},
  {t:"lien waiver", d:"A form you sign giving up your lien rights, usually in exchange for payment. CONDITIONAL means 'only if the check actually clears.' UNCONDITIONAL means 'I give up my rights right now.' Never sign unconditional before the money is in the bank."},
  {t:"real property", d:"Land and anything permanently attached to it — the dirt, the house, the garage. As opposed to things you can pick up and carry away."},

  // --- contracts ---
  {t:"mutual assent", d:"Both sides agreed to the same deal. One side offered, the other accepted. Also called 'a meeting of the minds.'"},
  {t:"consideration", d:"Each side gives up something of value. You give labor and materials; they give money. A promise with nothing given in return isn't a contract."},
  {t:"capacity", d:"Being legally allowed to sign a contract — an adult, of sound mind, not intoxicated. A contract signed by a child generally can't be enforced against them."},
  {t:"void", d:"The contract NEVER legally existed. Nobody can enforce it. Example: a contract for illegal work, or one signed by an unlicensed contractor."},
  {t:"voidable", d:"The contract is real, but the person who got wronged (through fraud, threats, or a serious mistake) can cancel it if they want to. Their choice."},
  {t:"duress", d:"Being forced or threatened into signing. A contract signed under duress can be cancelled by the person who was threatened."},
  {t:"integration clause", d:"A line in the contract saying 'this document is the whole deal.' Anything you promised out loud but didn't write down doesn't count anymore."},
  {t:"complete agreement", d:"Same as an integration clause — the written contract is the entire agreement, and verbal side-promises don't count."},
  {t:"change order", d:"A written add-on to the contract when the customer wants something extra or different. Get it signed BEFORE you do the extra work, or you may never get paid for it."},
  {t:"liquidated damages", d:"A dollar amount agreed to IN ADVANCE that you owe for each day you're late. Saves everyone from arguing later about what the delay actually cost."},
  {t:"home solicitation", d:"A sale where YOU came to THEM — knocked on the door, cold-called, or met at a home show. These give the buyer extra cancellation rights because they didn't go looking for you."},
  {t:"service and repair contract", d:"A small job ($750 or less) where the CUSTOMER called you, and it's normally done in one visit. It has its own simpler set of rules."},
  {t:"progress payment", d:"A partial payment made as the work moves along, instead of one lump sum at the end."},
  {t:"retention", d:"Money the owner holds back from each payment — usually 5-10% — until the whole job is done and accepted. Also called retainage. Budget for not seeing it for a while."},
  {t:"statute of limitations", d:"The deadline for filing a lawsuit. Miss it and you lose the right to sue at all, even if you were completely in the right."},
  {t:"substantial compliance", d:"A narrow legal excuse where a contractor whose license had a technical problem may still be allowed to collect payment. Hard to win — don't plan around it."},

  // --- licensing ---
  {t:"Registrar", d:"The person who runs the day-to-day operations of the CSLB — issues licenses, investigates complaints, and disciplines contractors. The Board sets policy; the Registrar enforces it."},
  {t:"qualifying individual", d:"The person whose experience and exam scores the license is built on. Every license needs one. Could be you as the owner, or an employee/officer who qualifies on the company's behalf."},
  {t:"RMO", d:"Responsible Managing Officer — an officer of a corporation who serves as the license's qualifying individual."},
  {t:"RME", d:"Responsible Managing Employee — an employee (not an owner) who qualifies the license. Must actually work there at least 32 hours a week or 80% of business hours."},
  {t:"disassociation", d:"When the qualifying individual leaves the business. You have 90 days to notify the CSLB and name a replacement, or the license gets suspended."},
  {t:"joint venture", d:"Two or more licensed companies teaming up to bid one project together, under a shared license."},
  {t:"reciprocity", d:"A licensing arrangement that may allow a trade-examination waiver for an eligible contractor and classification. It does not automatically grant a California license. Check CSLB’s current program and requirements; an old list of states may be outdated."},
  {t:"citation", d:"An official written violation from the CSLB with a fine attached. Not a criminal charge, but you must pay it or appeal within 15 working days."},
  {t:"delinquency fee", d:"The late penalty for renewing your license after it expired — 50% of the renewal fee on top of the renewal itself."},
  {t:"diversion of funds", d:"Taking money a customer paid for THEIR job and spending it on something else. Over $2,350 this is a felony."},
  {t:"patent defect", d:"A problem you can SEE — obvious on inspection. Cracked stucco, a crooked door. Complaint window: 4 years."},
  {t:"latent defect", d:"A HIDDEN problem, usually structural, that shows up later. Bad framing behind a wall. Complaint window: 10 years, because nobody could have spotted it."},

  // --- bonds & insurance ---
  {t:"surety", d:"The bonding company that guarantees you'll do what you promised. Important: if they pay out a claim, they come after YOU for the money. A bond is a guarantee, not insurance."},
  {t:"principal", d:"On a bond, that's you — the contractor whose performance is being guaranteed."},
  {t:"obligee", d:"On a bond, the party being protected — usually the property owner or the State of California."},
  {t:"bid bond", d:"Guarantees that if you win the bid, you'll actually sign the contract. Usually about 10% of your bid."},
  {t:"performance bond", d:"Guarantees the job gets finished per the contract. If you can't finish, the bonding company pays to have it completed."},
  {t:"payment bond", d:"Guarantees your subs and material suppliers get paid. Required on public jobs over $25,000."},
  {t:"disciplinary bond", d:"An extra, larger bond the CSLB makes you post to get your license back after discipline. Can run up to 10 times the normal bond."},
  {t:"additional insured", d:"When a general contractor asks to be added to YOUR insurance policy, so your coverage also protects them for problems caused by your work."},
  {t:"exclusive remedy", d:"The trade-off in workers' comp: an injured employee gets medical care and wage benefits automatically without proving anyone was at fault, and in exchange they generally can't sue you over the injury."},
  {t:"experience modification rate", d:"A number that adjusts your workers' comp premium based on your claims history. 1.0 is average. Above 1.0 you pay more; below 1.0 you get a discount."},
  {t:"general liability", d:"Insurance for damage YOU cause to other people or their property — a door falls on a customer's car. Different from workers' comp, which covers your own employees' injuries."},

  // --- money & accounting ---
  {t:"assets", d:"Everything the business owns that has value — cash, trucks, tools, money customers owe you."},
  {t:"liabilities", d:"Everything the business owes — loans, unpaid bills, taxes due."},
  {t:"owner's equity", d:"What's actually yours after debts are subtracted. Assets minus liabilities."},
  {t:"current assets", d:"Assets you could turn into cash within a year — cash on hand, money customers owe you, materials in the shop."},
  {t:"current liabilities", d:"Bills coming due within a year — this month's payroll, the credit card, the next loan payment."},
  {t:"working capital", d:"Current assets MINUS current liabilities. The cushion of money you have to cover near-term bills."},
  {t:"current ratio", d:"Current assets DIVIDED BY current liabilities. 2 to 1 is considered healthy. Below 1 to 1 means you can't cover your short-term bills."},
  {t:"direct costs", d:"Costs you can point at one specific job — the springs, the track, the installer's hours on that job."},
  {t:"overhead", d:"Costs of being in business that aren't tied to any one job — rent, phone, insurance, advertising, the bookkeeper. Spread across all your jobs."},
  {t:"gross profit", d:"Revenue minus DIRECT costs only. It looks bigger than your real profit because overhead hasn't been subtracted yet."},
  {t:"net profit", d:"What's actually left after subtracting BOTH direct costs and overhead. This is the real number."},
  {t:"markup", d:"A percentage added on top of your COST. Cost $100 plus 25% markup = $125 price."},
  {t:"margin", d:"Profit measured as a percentage of the PRICE. That same $125 price with $100 cost is only a 20% margin. Markup and margin are different numbers — this trips up a lot of contractors."},
  {t:"labor burden", d:"The real cost of an employee beyond their wage — payroll taxes, workers' comp, benefits. Often adds 25-35% on top of the hourly rate."},
  {t:"break-even", d:"The amount of revenue you need just to cover costs — no profit, no loss."},
  {t:"job costing", d:"Tracking what a job ACTUALLY cost versus what you estimated, so your next bid is more accurate."},
  {t:"depreciation", d:"Spreading the cost of something expensive and long-lasting, like a truck, across the years you'll use it, instead of counting it all in one year."},
  {t:"salvage value", d:"What you expect the truck or equipment to still be worth at the end of its useful life."},
  {t:"accrual", d:"An accounting method where you record income when you EARN it and expenses when you INCUR them, even if no money has moved yet."},
  {t:"cash basis", d:"An accounting method where you only record things when money actually changes hands."},
  {t:"double taxation", d:"When a C corporation pays tax on its profits, and then shareholders pay tax AGAIN on the dividends they receive from those same profits."},

  // --- employment & payroll ---
  {t:"FICA", d:"Social Security and Medicare tax. 7.65% comes out of the employee's check and the employer pays a matching 7.65%."},
  {t:"FUTA", d:"Federal unemployment tax. Paid by the EMPLOYER only — never withheld from the worker."},
  {t:"SUI", d:"State Unemployment Insurance. Employer pays this one too."},
  {t:"SDI", d:"State Disability Insurance. Withheld from the EMPLOYEE's paycheck."},
  {t:"PIT", d:"Personal Income Tax withheld from the employee's paycheck and sent to the state."},
  {t:"I-9", d:"The federal form proving a new hire is legally allowed to work in the U.S. Employer's part must be done within 3 business days of their start."},
  {t:"W-4", d:"The form where the employee tells you how much income tax to withhold from their pay."},
  {t:"ABC test", d:"California's strict three-part test for whether someone is truly an independent contractor. You must pass all three parts or they're legally your employee, with all the taxes and comp that come with it."},
  {t:"waiting time penalty", d:"A penalty of up to 30 days of that worker's wages for being late with a final paycheck. Expensive — pay fired employees immediately."},
  {t:"prevailing wage", d:"The minimum hourly rate (plus benefits) set by the state for each trade on government jobs. Higher than normal market rates. Applies to public works over $1,000."},
  {t:"certified payroll", d:"Payroll records you must submit on government jobs proving you paid everyone the correct prevailing wage."},

  // --- safety ---
  {t:"IIPP", d:"Injury and Illness Prevention Program — the written safety plan every California employer must have. Names who's in charge of safety, how hazards get spotted and fixed, and how workers are trained."},
  {t:"Code of Safe Practices", d:"A written list of safety rules for your type of work, posted or kept available at the jobsite."},
  {t:"tailgate meeting", d:"A short safety talk with the crew at the jobsite. Required at least every 10 working days. Also called a toolbox talk."},
  {t:"competent person", d:"Someone who can both SPOT a hazard and has the AUTHORITY to fix it on the spot. Both halves are required."},
  {t:"lockout tagout", d:"Shutting off the power to equipment, locking the switch so it can't be turned back on, and tagging it with your name — before you put your hands in the machinery."},
  {t:"tolerance zone", d:"The 24 inches on each side of a marked underground utility line. Inside that zone you dig by hand only, until you can see the pipe or cable."},
  {t:"SDS", d:"Safety Data Sheet — the document explaining the hazards of a chemical product and what to do if someone is exposed. Must be where workers can actually get to it."},
  {t:"Cal/OSHA", d:"California's workplace safety agency. Sets the safety rules, inspects jobsites, and issues citations."},

  // --- general legal ---
  {t:"misdemeanor", d:"A less serious crime. Typically punishable by a fine and up to a year in county jail."},
  {t:"felony", d:"A serious crime, with bigger fines and the possibility of prison rather than county jail."},
  {t:"civil penalty", d:"A fine, not a criminal charge. No jail, no criminal record — but you still have to pay."},
  {t:"arbitration", d:"Settling a dispute in front of a neutral decision-maker instead of going to court. Faster and cheaper than a lawsuit."},
  {t:"prime contractor", d:"The contractor who signed the contract directly with the property owner. Everyone else on the job works under them as subcontractors. WATCH OUT: the law now officially calls this a DIRECT CONTRACTOR, and older books say ORIGINAL CONTRACTOR. Three names, one job."},
  {t:"direct contractor", d:"The current legal term for the contractor who has the contract directly with the owner. Same thing older materials call the PRIME contractor or ORIGINAL contractor. On liens, this is the one who gets 60 days when a notice of completion was filed."},
  {t:"public works", d:"Construction paid for with government money — schools, roads, city buildings. Comes with extra rules: prevailing wage, certified payroll, DIR registration."},
  {t:"DIR", d:"California's Department of Industrial Relations. Sets prevailing wage rates and requires contractors to register before doing public works."},
  {t:"Notice of Cancellation", d:"The form you must hand the buyer WITH the contract, in TWO copies, spelling out their right to cancel within 3 business days (5 if they are 65 or older). Leave it out and the buyer's cancellation clock never starts, so they can cancel much later."},
  {t:"Mechanics Lien Warning", d:"A warning that must appear in every home improvement contract. It tells the owner that if you or your suppliers go unpaid, a lien can be put on their home EVEN IF the owner already paid you in full. Skipping it is grounds for discipline."},
  {t:"Agreement to Arbitrate", d:"The form the CSLB mails to both sides when a complaint is headed to arbitration. Send it back within 30 days so a hearing can be scheduled."},
  {t:"CSLB", d:"Contractors State License Board. The California agency that issues contractor licenses, investigates complaints, and disciplines contractors. Its number one job is protecting the public."},
  {t:"the Board", d:"Another way of saying the CSLB. Fifteen members: 8 from the public, 5 contractors, 1 local building official, 1 labor representative. The Board sets policy; the Registrar carries it out."},
  {t:"EDD", d:"Employment Development Department. California's payroll tax and unemployment agency. Every new hire must be reported to them within 20 days."},
  {t:"HIC", d:"Home Improvement Contract. Must be in writing for any home improvement job over $500, and must contain specific notices like the Mechanics Lien Warning."},
  {t:"LLC", d:"Limited Liability Company. A business structure that keeps business debts away from your personal assets. Contractor LLCs in California need an extra $100,000 worker bond and at least $1 million in liability insurance, and must use an attorney in civil court."},
  {t:"IRS", d:"Internal Revenue Service, the federal tax agency. Your payroll tax deposits go to them, and how OFTEN you deposit depends on how much you owe."},
  {t:"Labor Commissioner", d:"The California official who enforces wage laws and collects certified payroll records on public works jobs."},
  {t:"Limited Specialty", d:"The C-61 license class. It covers trades that do not fit the other categories and is split into 'D' subcategories. Yours is D-28, doors and gates."},
  {t:"General Building", d:"The Class 'B' license. A 'B' can only take a project that involves at least TWO unrelated trades, otherwise the job belongs to the matching specialty contractor."},
  {t:"General Engineering", d:"The Class 'A' license. Covers fixed works like roads, bridges, pipelines, and other heavy engineering projects."},
  {t:"Underground Service Alert", d:"The free 811 service you call before digging. They send utilities out to paint-mark their buried lines. Call at least 2 working days ahead, and no more than 14 calendar days."},
  {t:"fraud", d:"Lying on purpose to get money or an advantage. On this exam, the word 'fraud' in a question almost always signals CRIMINAL penalties and possible jail, not just a fine."},
  {t:"sole proprietorship", d:"A business owned by one person with no legal wall between the business and the owner. Cheapest and simplest to set up, but business debts can reach your personal house, truck, and savings."},
  {t:"subcontractor", d:"A contractor hired by the prime (direct) contractor rather than by the owner. They must hold a valid license. If they do not, the law treats them as YOUR employee, with payroll taxes and workers' comp owed."},
  {t:"journeyman", d:"A fully trained, experienced worker in a trade. On public works, apprentice hours are measured against journeyman hours at roughly 1 apprentice hour per 5 journeyman hours."},
  {t:"apprentice", d:"A worker enrolled in a state-approved training program who learns the trade while getting paid. Required on public works contracts of $30,000 or more."},
  {t:"Social Security", d:"The federal retirement program funded by payroll tax. It is the 6.2% half of FICA; Medicare is the other 1.45%."},
  {t:"ETT", d:"Employment Training Tax. A small California payroll tax paid by the EMPLOYER, never withheld from the worker."},
  {t:"good faith", d:"Acting honestly and fairly, without trying to cheat anyone. A 'good faith dispute' means you genuinely believe you owe less, which is different from just refusing to pay."},
  {t:"willful", d:"On purpose, knowing what you were doing. Willful violations carry much bigger penalties than careless or accidental ones."},
  {t:"negligent", d:"Careless. You did not mean to cause harm, but you failed to take reasonable care. Penalties are lower than for willful violations."},
];

/* ==== STORAGE: localStorage, survives updates and reloads ==== */
var KEY = 'cslb_lb_trainer_v1';
var S = { weak:{}, mastered:{}, scores:[], notes:[], history:{}, study:null, activeQuiz:null, lastTab:'home', sheet:{open:0,detail:''}, sheetReview:{}, learning:{quiet:false,paused:false} };
var storageFailed=false;
function load(){
  try{ var r = localStorage.getItem(KEY); if(r){ var d = JSON.parse(r);
    S.weak=d.weak||{}; S.mastered=d.mastered||{}; S.scores=d.scores||[]; S.notes=d.notes||[];
    S.history=d.history||{}; S.study=d.study||null; S.activeQuiz=d.activeQuiz||null; S.lastTab=d.lastTab||'home';
    S.sheet=d.sheet||S.sheet; S.sheetReview=d.sheetReview||{}; S.learning=d.learning||S.learning; } }
  catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageFailed=false; }catch(e){storageFailed=true;} }

var CATS = ["All","Contracts","Employment","Finances","Safety","Licensing","Ins & Liens","Public Works"];
var WEIGHTS = {"Contracts":21,"Employment":20,"Finances":15,"Safety":14,"Licensing":13,"Ins & Liens":12,"Public Works":5};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; } return a; }
function byId(id){ for(var i=0;i<BANK.length;i++) if(BANK[i].id===id) return BANK[i]; return null; }

/* ==== WORD HELP: finds hard words in a question and explains them ==== */
var GSORT = GLOSSARY.slice().sort(function(a,b){ return b.t.length-a.t.length; });
var gCache = {};
function termsIn(item){
  if(gCache[item.id]) return gCache[item.id];
  var hay = (item.q+' '+item.opts.join(' ')+' '+item.why).toLowerCase();
  var found=[], used='|';
  for(var i=0;i<GSORT.length;i++){
    var t=GSORT[i].t.toLowerCase();
    var re=new RegExp('(^|[^a-z])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)');
    if(re.test(hay) && used.indexOf('|'+t+'|')===-1){ found.push(GSORT[i]); used+=t+'|'; }
    if(found.length>=5) break;
  }
  gCache[item.id]=found;
  return found;
}
var wordHelpOpen = {}, activeDef = null, diaOpen = {};
function toggleWords(id){ wordHelpOpen[id]=!wordHelpOpen[id]; render(); }
function showDef(t){ activeDef = (activeDef===t?null:t); render(); }
function toggleDia(id){ diaOpen[id]=!diaOpen[id]; render(); }
function defByName(t){ for(var i=0;i<GLOSSARY.length;i++) if(GLOSSARY[i].t.toLowerCase()===t.toLowerCase()) return GLOSSARY[i]; return null; }

/* underline any glossary word found in the text so it can be tapped */
function mark(text, item){
  var out = esc(text);
  var ts = termsIn(item);
  if(!ts.length) return out;
  var pat = ts.map(function(g){ return g.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|');
  var re = new RegExp('\\b('+pat+')\\b','gi');
  return out.replace(re, function(m){
    return '<span class="gt" onclick="showDef(\''+m.toLowerCase().replace(/'/g,"")+'\')">'+m+'</span>';
  });
}

/* the definition panel that opens when a word is tapped */
function defPanel(){
  if(!activeDef) return '';
  var g = defByName(activeDef);
  if(!g) return '';
  return '<div style="background:#F2F6FF;border:1.5px solid #1E4FD8;border-radius:10px;padding:13px 15px;margin-top:10px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
    +'<div style="font-weight:700;font-size:15px;color:var(--cobalt)">'+esc(g.t)+'</div>'
    +'<button onclick="showDef(null)" style="background:none;border:none;color:var(--steel);font-size:18px;line-height:1;cursor:pointer;padding:0 2px">\u00D7</button></div>'
    +'<div style="font-size:14.5px;line-height:1.6;color:var(--inkSoft);margin-top:5px">'+esc(g.d)+'</div></div>';
}

/* fallback list, catches hard words that sit in the answer choices */
function wordHelp(item){
  var ts=termsIn(item);
  if(!ts.length) return '';
  var open=wordHelpOpen[item.id];
  var body='';
  if(open){
    body='<div style="padding:2px 14px 12px">'+ts.map(function(g){
      return '<div style="padding:9px 0;border-top:1px solid #C9D9FA">'
        +'<div style="font-weight:700;font-size:14.5px;color:var(--ink)">'+esc(g.t)+'</div>'
        +'<div style="font-size:14px;line-height:1.55;color:var(--inkSoft);margin-top:3px">'+esc(g.d)+'</div></div>';
    }).join('')+'</div>';
  }
  return '<div style="background:#F2F6FF;border:1px solid #C9D9FA;border-radius:10px;margin-top:10px;overflow:hidden">'
    +'<button onclick="toggleWords(\''+item.id+'\')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:none;border:none;cursor:pointer;font-family:inherit">'
    +'<span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--cobalt)">ALL WORD MEANINGS ('+ts.length+')</span>'
    +'<span style="color:var(--cobalt);font-size:18px">'+(open?'\u2212':'+')+'</span></button>'+body+'</div>';
}

/* the picture, when this question has one */
function diaBlock(item){
  var key = QDIA[item.id];
  if(!key || !DIAGRAMS[key]) return '';
  var d = DIAGRAMS[key], open = diaOpen[item.id];
  return '<div style="background:#FFF;border:1.5px solid var(--cobalt);border-radius:10px;margin-top:10px;overflow:hidden">'
    +'<button onclick="toggleDia(\''+item.id+'\')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:none;border:none;cursor:pointer;font-family:inherit">'
    +'<span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--cobalt);text-align:left">SHOW ME THE PICTURE</span>'
    +'<span style="color:var(--cobalt);font-size:18px">'+(open?'\u2212':'+')+'</span></button>'
    +(open?'<div style="padding:0 10px 12px"><div style="font-size:13.5px;font-weight:600;color:var(--inkSoft);margin-bottom:6px">'+esc(d.t)+'</div>'+d.svg+'</div>':'')
    +'</div>';
}

/* ==== APP STATE ==== */
var tab='home';
var st={cat:'All',mode:'all',order:[],idx:0,picked:null,streak:0,focusOpen:false};
var qz={cat:'All',len:10,qs:null,i:0,picked:null,right:0,done:false};
var openSheet=0, showBackup=false, restoreMsg='', glossQuery='';
var keepPagePosition=false;
function setGloss(v){ glossQuery=v; render();
  var el=document.getElementById('gq'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } }

/* ==== RENDER ==== */
function render(){
  var m=document.getElementById('main');
  document.body.classList.toggle('quiet-mode',!!S.learning.quiet);
  var learningTab=['study','quiz','sheet'].indexOf(tab)>-1;
  if(learningTab&&S.learning.paused) m.innerHTML='<div class="card"><h2>Take a quiet break</h2><p style="line-height:1.7">Your place is kept. Look away from the screen and return whenever you are ready. No countdown, no penalty.</p><button class="btn" onclick="togglePause()">RESUME WHERE I LEFT OFF</button></div>';
  else if(tab==='home') m.innerHTML=viewHome();
  else if(tab==='study') m.innerHTML=viewStudy();
  else if(tab==='quiz') m.innerHTML=viewQuiz();
  else if(tab==='sheet') m.innerHTML=viewSheet();
  else m.innerHTML=viewNotes();
  if(learningTab&&!S.learning.paused) m.innerHTML='<div class="learning-tools"><button onclick="togglePause()">Ⅱ Take a break</button><button class="'+(S.learning.quiet?'quiet-on':'')+'" aria-pressed="'+!!S.learning.quiet+'" onclick="toggleQuiet()">'+(S.learning.quiet?'✓ Quiet motion':'Quiet motion')+'</button></div>'+m.innerHTML;
  if(storageFailed) m.innerHTML='<div class="save-warning" role="alert">This browser could not save your latest changes. Keep this tab open and copy your backup from Notes before closing it.</div>'+m.innerHTML;
  var tabs=[['home','HOME'],['study','STUDY'],['quiz','QUIZ'],['sheet','SHEET'],['notes','NOTES']];
  document.getElementById('nav').innerHTML=tabs.map(function(t){
    return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  if(!glossQuery && !keepPagePosition) window.scrollTo(0,0);
  keepPagePosition=false;
}
function go(t){ tab=t; S.lastTab=t; save(); render(); }
function toggleQuiet(){S.learning.quiet=!S.learning.quiet;save();keepPagePosition=true;render();}
function togglePause(){S.learning.paused=!S.learning.paused;save();render();if(!S.learning.paused){if(tab==='sheet')scrollToSheetHelp();else if(tab==='study')scrollToStudyQuestion();}}


/* ---- WEAKNESS TRACKING ----
   Current needs-work questions / distinct answered questions. A correct retry
   removes that question from needs work. Unanswered questions are excluded. */
function catStats(cat){
  var qs=BANK.filter(function(q){ return cat==='All'||q.cat===cat; });
  var right=0, weak=0;
  qs.forEach(function(q){
    if(S.weak[q.id]) weak++;
    else if(S.mastered[q.id]) right++;
  });
  var seen=right+weak;
  return {cat:cat,total:qs.length,seen:seen,right:right,weak:weak,
    acc:seen?Math.round(right/seen*100):null,
    needPct:seen?Math.round(weak/seen*100):null,
    weight:WEIGHTS[cat]||0};
}
function allStats(){ return CATS.filter(function(c){return c!=='All';}).map(catStats); }
function byPriority(a,b){
  var ar=a.seen?a.weak/a.seen:-1, br=b.seen?b.weak/b.seen:-1;
  return br-ar || b.weak-a.weak || b.weight-a.weight;
}
function weakestCategory(){ return allStats().filter(function(s){return s.weak>0;}).sort(byPriority)[0]||null; }
function statusInfo(s){
  if(!s.seen) return {key:'neutral',label:'Not started',color:'var(--steel)'};
  if(s.needPct===0) return {key:'clear',label:'0% needs work',color:'var(--green)'};
  if(s.needPct>=40) return {key:'danger',label:s.needPct+'% needs work',color:'var(--red)'};
  return {key:'warning',label:s.needPct+'% needs work',color:'#A86B09'};
}
function statusIcon(key){
  if(key==='clear') return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(key==='danger') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 20h18.4L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5m0 3h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if(key==='warning') return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6m0 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
}
function catPill(c,active,fn){
  var s=catStats(c), worst=weakestCategory();
  var info=statusInfo(s), label=info.label;
  var help=s.seen?s.weak+' of '+s.seen+' answered questions still need work; '+s.total+' total questions.':'No questions answered yet.';
  return '<button class="pill '+info.key+' '+(active?'on ':'')+(worst&&worst.cat===c?'weakest':'')+'" aria-pressed="'+active+'" title="'+help+'" onclick="'+fn+'(\''+c+'\')">'
    +'<span class="category-title-row"><span class="category-status-icon" style="color:'+info.color+'">'+statusIcon(info.key)+'</span><span class="category-name">'+(c==='All'?'All categories':c)+'</span></span>'
    +'<span class="category-rate '+info.key+'">'+label+'</span>'
    +'<span class="category-mini-bar"><span style="width:'+(s.seen?s.needPct:0)+'%;background:'+info.color+'"></span></span></button>';
}
function focusPicker(){
  var s=catStats(st.cat), info=statusInfo(s);
  return '<button class="focus-picker '+info.key+(st.focusOpen?' open':'')+'" onclick="toggleFocus()" aria-expanded="'+st.focusOpen+'">'
    +'<span class="focus-picker-icon">'+statusIcon(info.key)+'</span>'
    +'<span class="focus-picker-copy"><span class="focus-picker-label">Study focus</span><span class="focus-picker-value">'+(st.cat==='All'?'All categories':st.cat)+'</span><span class="focus-picker-rate">'+info.label+'</span></span>'
    +'<svg class="focus-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
}
function focusCard(){
  var worst=weakestCategory();
  if(!worst) return '';
  return '<button class="focus-card" onclick="jumpCat(\''+worst.cat+'\')">'
    +'<span><strong>Focus next: '+worst.cat+'</strong><small>Weakest area · '+worst.needPct+'% needs work · '+worst.weak+' of '+worst.seen+' answered</small></span>'
    +'<span class="focus-action">Practice missed →</span></button>';
}
function weakPanel(){
  var stats=allStats().sort(byPriority);
  return '<section style="margin:20px 0 12px"><h2 class="section-label">YOUR WEAK AREAS</h2>'
    +'<p class="progress-help">Red marks high needs work, yellow means you are improving, and green means the category is cleared. Correct a missed question to bring the percentage down.</p>'
    +focusCard()+stats.map(function(s){
      var info=statusInfo(s), label=info.label, col=info.color;
      return '<button class="wrow" onclick="jumpCat(\''+s.cat+'\')">'
        +'<div class="wtop"><span class="wname">'+s.cat+'</span><span class="wpct" style="color:'+col+'">'+label+'</span></div>'
        +'<div class="wbar"><div style="width:'+(s.needPct||0)+'%;background:'+col+'"></div></div>'
        +'<div class="wsub"><span>'+s.weak+' need work / '+s.seen+' answered · '+s.total+' total</span><span>'+s.weight+'% of exam</span></div></button>';
    }).join('')+'</section>';
}
/* tapping a row takes you straight to drilling that category */
function jumpCat(c){
  st.cat=c;
  st.mode = catStats(c).weak>0 ? 'weak' : 'all';

/* ---- STUDY ---- */
function practiceAllMissed(){
  st.cat='All'; st.mode='weak'; st.focusOpen=false;
  reorder(); tab='study'; S.lastTab='study'; saveStudyState();
  render(); scrollToStudyQuestion();
}
function studyPool(){
  var p=BANK.filter(function(x){ return st.cat==='All'||x.cat===st.cat; });
  if(st.mode==='weak') p=p.filter(function(x){ return S.weak[x.id]; });
  return p;
}
function reorder(){ st.order=shuffle(studyPool().map(function(x){return x.id;})); st.idx=0; st.picked=null; }
function saveStudyState(){
  S.study={cat:st.cat,mode:st.mode,order:st.order.slice(),idx:st.idx,picked:st.picked,streak:st.streak};
  save();
}
function toggleFocus(){ st.focusOpen=!st.focusOpen; keepPagePosition=true; render(); }
function setCat(c){ st.cat=c; st.focusOpen=false; reorder(); saveStudyState(); render(); scrollToStudyQuestion(); }
function setMode(m){ st.mode=m; reorder(); saveStudyState(); render(); scrollToStudyQuestion(); }
function scrollToStudyQuestion(){
  requestAnimationFrame(function(){
    var el=document.getElementById('study-question');
    if(el) el.scrollIntoView({behavior:S.learning.quiet||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth',block:'start'});
  });
}
function viewStudy(){
  if(!st.order.length) reorder();

  var needs=catStats(st.cat).weak;
  var modes='<button class="pill '+(st.mode==='all'?'on':'')+'" onclick="setMode(\'all\')">All questions</button>'
          + '<button class="pill '+(st.mode==='weak'?'on':'')+'" onclick="setMode(\'weak\')">Needs work ('+needs+')</button>';
  var chooser=focusPicker()+(st.focusOpen?'<div class="focus-menu"><h2 class="section-label">CHOOSE YOUR FOCUS</h2><div class="category-grid">'+pills+'</div><p class="progress-help">Red = high needs work, yellow = improving, green = cleared. Unanswered questions do not count.</p></div>':'');
  var head=chooser+'<div class="study-modes">'+modes+'</div>';

    +(st.mode==='weak'?'Nothing in the needs-work pile here. Nice.':'No questions in this category.')+'</div>';
  var tag = st.streak>=3 ? '\u{1F525} '+st.streak+' IN A ROW' : (S.mastered[item.id]?'\u2713 MASTERED':(S.weak[item.id]?'MISSED \u00D7'+S.weak[item.id]:'NEW'));
  return head
    + '<div id="study-question" class="question-stage"><div class="meta"><span>'+item.cat.toUpperCase()+' \u00B7 '+(st.idx+1)+'/'+st.order.length+'</span><span>'+tag+'</span></div>'
    + qCard(item, st.picked, 'pickStudy')
    + (st.picked!==null?'<button class="btn" onclick="nextStudy()">NEXT QUESTION \u2192</button>':'')+'</div>';
}
function qCard(item,picked,fn){
  var h='<div class="card"><div class="q">'+mark(item.q,item)+'</div>';
  for(var n=0;n<item.opts.length;n++){
    var cls='opt', mk='';
    if(picked!==null){
      if(n===item.ans){ cls+=' right'; mk='<span class="mk">\u2713</span>'; }
      else if(n===picked){ cls+=' wrong'; mk='<span class="mk">\u2715</span>'; }
    }
    h+='<button class="'+cls+'" onclick="'+fn+'('+n+')"><span class="ltr">'+'ABCD'[n]+'.</span>'+esc(item.opts[n])+mk+'</button>';
  }
  if(picked!==null){
    var ok=picked===item.ans;
    h+='<div class="why '+(ok?'ok':'no')+'"><b>'+(ok?'Correct \u2014 here\u2019s the why:':'Not quite \u2014 the answer is '+'ABCD'[item.ans]+'.')+'</b>'+mark(item.why,item)+questionReferences(item)+'</div>';
    h+=diaBlock(item);
  }
  h+=defPanel();
  if(picked!==null) h+=wordHelp(item);

function pickStudy(n){
  if(st.picked!==null) return;
  var item=byId(st.order[st.idx]); st.picked=n;
  if(n===item.ans) st.streak++; else st.streak=0;
  recordAnswer(item,n===item.ans,'study');
  saveStudyState(); keepPagePosition=true; render();
}
function nextStudy(){
  var remaining=st.order.slice(st.idx+1);
  if(st.mode==='weak'){
    remaining=remaining.filter(function(id){return S.weak[id];});
    if(remaining.length){st.order=remaining;st.idx=0;st.picked=null;}
    else reorder();
  } else {st.picked=null;st.idx=(st.idx+1<st.order.length)?st.idx+1:0;}
  saveStudyState(); render(); scrollToStudyQuestion();
}

/* ---- QUIZ (weighted to the real exam) ---- */
function recordAnswer(item,correct,source){
  if(correct){ delete S.weak[item.id]; S.mastered[item.id]=true; }
  else { S.weak[item.id]=(S.weak[item.id]||0)+1; delete S.mastered[item.id]; }
  var h=S.history[item.id]||{right:0,wrong:0};
  if(correct) h.right++; else h.wrong++;
  h.cat=item.cat; h.lastCorrect=correct; h.lastAnswered=Date.now(); h.lastSource=source;
  S.history[item.id]=h; save();
}
function saveQuizState(){
  S.activeQuiz=qz.qs?{cat:qz.cat,len:qz.len,ids:qz.qs.map(function(q){return q.id;}),i:qz.i,picked:qz.picked,right:qz.right,done:qz.done}:null;
  save();
}
function setQCat(c){ qz.cat=c; saveQuizState(); render(); }
function setQLen(n){ qz.len=n; saveQuizState(); render(); }
function startQuiz(){
  var picked=[];
  if(qz.cat==='All'){
    var total=0; for(var k in WEIGHTS) total+=WEIGHTS[k];
    var t=[]; for(var c in WEIGHTS){ var ex=(WEIGHTS[c]/total)*qz.len; t.push({c:c,n:Math.floor(ex),rem:ex-Math.floor(ex)}); }
    var got=0; t.forEach(function(x){got+=x.n;});
    t.sort(function(a,b){return b.rem-a.rem;});
    for(var i=0;i<qz.len-got;i++) t[i%t.length].n++;
    t.forEach(function(x){
      var pool=shuffle(BANK.filter(function(q){return q.cat===x.c;}));
      picked=picked.concat(pool.slice(0,Math.min(x.n,pool.length)));
    });
    picked=shuffle(picked).slice(0,qz.len);
  } else {
    picked=shuffle(BANK.filter(function(q){return q.cat===qz.cat;})).slice(0,qz.len);
  }
  qz.qs=picked; qz.i=0; qz.picked=null; qz.right=0; qz.done=false; saveQuizState(); render();
}
function pickQuiz(n){
  if(qz.picked!==null) return;
  qz.picked=n;
  var item=qz.qs[qz.i];
  var correct=n===item.ans; if(correct) qz.right++;
  recordAnswer(item,correct,'quiz'); saveQuizState(); keepPagePosition=true; render();
}
function nextQuiz(){
  if(qz.i+1<qz.qs.length){ qz.i++; qz.picked=null; }
  else {
    var pct=Math.round(qz.right/qz.qs.length*100);
    S.scores.push({pct:pct,cat:qz.cat,when:new Date().toLocaleDateString()});
    qz.done=true;
  }
  saveQuizState(); render();
}
function resetQuiz(){ qz.qs=null; qz.picked=null; qz.done=false; saveQuizState(); render(); }
function viewQuiz(){
  if(!qz.qs){
    var pills=CATS.map(function(c){ return catPill(c, qz.cat===c, 'setQCat'); }).join('');
    var recent='';
    if(S.scores.length){
      recent='<div style="margin-top:16px"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--steel);margin-bottom:6px">RECENT SCORES</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
        + S.scores.slice(-8).map(function(s){
            var bg=s.pct>=90?'#E6F4EC':(s.pct>=70?'#FDF3E0':'#FBEAEA');
            var fg=s.pct>=90?'var(--green)':(s.pct>=70?'#A87613':'var(--red)');
            return '<span class="score" style="background:'+bg+';color:'+fg+'">'+s.pct+'%</span>';
          }).join('') + '</div></div>';
    }
    return '<h2 class="section-label">QUIZ CATEGORIES</h2><div class="category-grid">'+pills+'</div>'
      + '<div class="card"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:24px;font-weight:700">Exam Simulator</div>'
      + '<p style="font-size:14.5px;color:var(--inkSoft);line-height:1.55">All-category quizzes approximate the topic weights in CSLB’s March 2026 study guide. These are practice questions, not the official exam; this score does not predict or guarantee a pass.</p>'
      + '<details style="font-size:13px;line-height:1.6;margin-bottom:14px"><summary>2026 reference foundation</summary><p>The 2026 CSLB Law &amp; Reference Book is our legal reference, supplemented by current agency rules. Individual source checking of the older question bank is still in progress. Checked items have specific links in their answer explanations; your previous results are preserved, not retroactively regraded.</p><a class="help-source" href="'+LAW_BOOK+'" target="_blank" rel="noopener noreferrer">Read the 2026 law book ↗</a><a class="help-source" href="'+EXAM_GUIDE+'" target="_blank" rel="noopener noreferrer">Official exam topics and weights ↗</a></details>'
      + '<div class="row" style="padding-bottom:12px"><button class="pill '+(qz.len===10?'on':'')+'" onclick="setQLen(10)">Quick 10</button>'
      + '<button class="pill '+(qz.len===25?'on':'')+'" onclick="setQLen(25)">Exam Sim 25</button></div>'
      + '<button class="btn" style="margin-top:0" onclick="startQuiz()">START QUIZ</button>'+recent+'</div>';
  }
  if(qz.done){
    var pct=Math.round(qz.right/qz.qs.length*100);
    var col=pct>=90?'var(--green)':(pct>=70?'var(--amber)':'var(--red)');
    var msg=pct>=90?'Strong result on this practice set. Take a break or revisit saved reviews.':(pct>=70?'Review missed questions whenever you feel ready.':'Your missed questions are saved. Try one explanation at a time.');
    return '<div class="card" style="text-align:center">'
      + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--steel)">FINAL SCORE</div>'
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:64px;font-weight:700;line-height:1;color:'+col+'">'+pct+'%</div>'
      + '<div style="font-size:15px;color:var(--inkSoft);margin:10px 0 4px">'+msg+'</div>'
      + '<button class="btn" onclick="startQuiz()">RUN ANOTHER '+qz.len+'</button>'
      + '<button class="btn dark" onclick="resetQuiz()">BACK</button></div>';
  }
  var Q=qz.qs[qz.i];
  return '<div class="meta"><span>QUESTION '+(qz.i+1)+' OF '+qz.qs.length+'</span><span>'+qz.right+' CORRECT</span></div>'
    + '<div class="bar"><div style="width:'+(qz.i/qz.qs.length*100)+'%"></div></div>'
    + qCard(Q,qz.picked,'pickQuiz')
    + (qz.picked!==null?'<button class="btn dark" onclick="nextQuiz()">'+(qz.i+1<qz.qs.length?'NEXT QUESTION \u2192':'SEE MY SCORE')+'</button>':'');
}

function sheetKey(k,r){return k+'-'+r;}
function validSheetKey(key){var parts=String(key).split('-');return parts.length===2&&/^\d+$/.test(parts[0])&&/^\d+$/.test(parts[1])&&!!(SHEET_HELP[+parts[0]]&&SHEET_HELP[+parts[0]][+parts[1]]);}
function saveSheet(){S.sheet.open=openSheet;save();}
function toggleSheet(k){openSheet=(openSheet===k?-1:k);S.sheet.detail='';saveSheet();keepPagePosition=true;render();}
function toggleSheetHelp(k,r){var key=sheetKey(k,r);S.sheet.detail=S.sheet.detail===key?'':key;saveSheet();keepPagePosition=true;render();if(S.sheet.detail)scrollToSheetHelp();else focusSheetButton(key);}
function focusSheetButton(key){var el=document.getElementById('term-'+key);if(el)el.focus({preventScroll:true});}
function scrollToSheetHelp(){requestAnimationFrame(function(){var el=document.getElementById('row-'+S.sheet.detail);if(el){el.scrollIntoView({behavior:'auto',block:'start'});focusSheetButton(S.sheet.detail);}});}
function reviewSheetItem(k,r){var key=sheetKey(k,r);if(S.sheetReview[key])delete S.sheetReview[key];else S.sheetReview[key]={savedAt:Date.now()};save();keepPagePosition=true;render();var el=document.getElementById('review-'+key);if(el)el.focus({preventScroll:true});}
function openSavedSheet(key){if(!validSheetKey(key))return;openSheet=+key.split('-')[0];S.sheet.detail=key;S.learning.paused=false;saveSheet();keepPagePosition=true;render();scrollToSheetHelp();}
function sheetExplanation(k,r){
  var key=sheetKey(k,r),d=SHEET_HELP[k][r],marked=!!S.sheetReview[key];
  var sources=d.slice(3).map(function(s){return '<a class="help-source" href="'+esc(s[1])+'" target="_blank" rel="noopener noreferrer">Read the source: '+esc(s[0])+' ↗</a>';}).join('');
  return '<section class="sheet-help" id="help-'+key+'" aria-label="Explanation: '+esc(SHEETS[k].rows[r][0])+'">'

    +'<button onclick="toggleSheetHelp('+k+','+r+')">Close explanation</button></div></section>';

    +'<p class="sheet-intro" style="font-size:12px">Plain-English study summaries, not verbatim quotations or legal advice. Sources checked September 2026; exceptions and later changes may apply. <a href="'+LAW_BOOK+'" target="_blank" rel="noopener noreferrer">Open the 2026 CSLB Law &amp; Reference Book ↗</a></p>';
}

  }
  return '<textarea id="draft" placeholder="Jot a memory hook, a number you keep missing, a question to look up" style="min-height:90px"></textarea>'
    + '<button class="btn" style="padding:13px 0;font-size:17px" onclick="addNote()">SAVE NOTE</button>'
    + '<div style="margin-top:16px">'+list+'</div>'
    + '<div class="acc" style="margin-top:18px"><button onclick="toggleBackup()">'
    + '<span class="h">MOVE PROGRESS TO ANOTHER DEVICE</span><span class="pm">'+(showBackup?'\u2212':'+')+'</span></button>'+backup+'</div>';
}

function restoreAppState(){
  var savedOpen=Number(S.sheet.open);openSheet=(savedOpen===-1||savedOpen===999||(savedOpen>=0&&savedOpen<SHEETS.length&&Number.isInteger(savedOpen)))?savedOpen:0;
  if(!validSheetKey(S.sheet.detail)||+String(S.sheet.detail).split('-')[0]!==openSheet)S.sheet.detail='';
  var tabs=['home','study','quiz','sheet','notes'];
  if(tabs.indexOf(S.lastTab)>-1) tab=S.lastTab;
  if(S.study){
    if(CATS.indexOf(S.study.cat)>-1) st.cat=S.study.cat;
    if(S.study.mode==='all'||S.study.mode==='weak') st.mode=S.study.mode;
    if(Array.isArray(S.study.order)) st.order=S.study.order.filter(function(id){return !!byId(id);});
    st.idx=Math.max(0,Math.min(Number(S.study.idx)||0,Math.max(0,st.order.length-1)));
    st.picked=typeof S.study.picked==='number'?S.study.picked:null;
    st.streak=Number(S.study.streak)||0;
  }
  if(S.activeQuiz&&Array.isArray(S.activeQuiz.ids)){
    var restored=S.activeQuiz.ids.map(byId).filter(function(q){return !!q;});
    if(restored.length){
      qz.cat=CATS.indexOf(S.activeQuiz.cat)>-1?S.activeQuiz.cat:'All';
      qz.len=Number(S.activeQuiz.len)||restored.length; qz.qs=restored;
      qz.i=Math.max(0,Math.min(Number(S.activeQuiz.i)||0,restored.length-1));
      qz.picked=typeof S.activeQuiz.picked==='number'?S.activeQuiz.picked:null;
      qz.right=Number(S.activeQuiz.right)||0; qz.done=!!S.activeQuiz.done;
    }
  }
}

load(); restoreAppState(); render();if(tab==='sheet'&&S.sheet.detail&&!S.learning.paused)scrollToSheetHelp();
</script>
